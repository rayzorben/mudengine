<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="380" viewBox="0 0 1280 380">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="0.55" stop-color="#0f1f24"/>
      <stop offset="1" stop-color="#0b3633"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.35" r="0.55">
      <stop offset="0" stop-color="#14b8a6" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#14b8a6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.035"/>
    </pattern>
    <clipPath id="card"><rect width="1280" height="380" rx="20"/></clipPath>
    <style>
      .mono { font-family: 'JetBrains Mono', 'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace; }
      .sans { font-family: 'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif; }
    </style>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1280" height="380" fill="url(#bg)"/>
    <rect width="1280" height="380" fill="url(#grid)"/>
    <rect width="1280" height="380" fill="url(#glow)"/>

    <!-- map nodes, as drawn on the Map card -->
    <g stroke="#94a3b8" stroke-opacity="0.35" stroke-width="2" fill="none">
      <path d="M90 300H170V250H250M170 300V340M250 250H320"/>
    </g>
    <g fill="#1e293b" stroke="#94a3b8" stroke-opacity="0.5" stroke-width="1.5">
      <rect x="80" y="290" width="20" height="20" rx="4"/>
      <rect x="160" y="290" width="20" height="20" rx="4"/>
      <rect x="160" y="330" width="20" height="20" rx="4"/>
      <rect x="310" y="240" width="20" height="20" rx="4"/>
    </g>
    <rect x="236" y="236" width="28" height="28" rx="6" fill="#5eead4" stroke="#14b8a6" stroke-width="3"/>
    <path d="M170 240l12 12-12 12-12-12z" fill="#4ade80" fill-opacity="0.75" transform="translate(0 -2)"/>

    <!-- title -->
    <text x="80" y="128" class="sans" font-size="76" font-weight="700" fill="#f0fdfa" letter-spacing="-1">mudengine</text>
    <text x="84" y="172" class="mono" font-size="20" fill="#5eead4" letter-spacing="2">MAJORMUD · GREATERMUD · PARADIGM</text>
    <text x="84" y="212" class="sans" font-size="21" fill="#94a3b8">Terminal, map, live cards and scripting in one window.</text>

    <!-- terminal -->
    <g transform="translate(640 54)">
      <rect width="580" height="272" rx="12" fill="#000000" stroke="#14b8a6" stroke-opacity="0.45"/>
      <circle cx="22" cy="20" r="6" fill="#f87171"/>
      <circle cx="42" cy="20" r="6" fill="#fbbf24"/>
      <circle cx="62" cy="20" r="6" fill="#4ade80"/>
      <text x="560" y="25" text-anchor="end" class="mono" font-size="13" fill="#64748b">Festus · Paradigm</text>
      <g class="mono" font-size="16">
        <text x="20" y="64" fill="#e2e8f0">[HP=328/369,MA=83/90]: <tspan fill="#cbd5e1">aa short eradicator</tspan></text>
        <text x="20" y="90" fill="#fb923c">*Combat Engaged*</text>
        <text x="20" y="116" fill="#22d3ee">Crimson Fortress, Hallway</text>
        <text x="20" y="142" fill="#d946ef">Also here: <tspan fill="#e879f9">Lukster, short eradicator.</tspan></text>
        <text x="20" y="168" fill="#4ade80">Obvious exits: east, west</text>
        <text x="20" y="194" fill="#f87171">You cut short eradicator for 90 damage!</text>
        <text x="20" y="220" fill="#e2e8f0">You gain 3000 experience.</text>
        <text x="20" y="246" fill="#e2e8f0">[HP=328/369,MA=83/90]: <tspan fill="#5eead4">█</tspan></text>
      </g>
    </g>
  </g>
  <rect x="0.5" y="0.5" width="1279" height="379" rx="19.5" fill="none" stroke="#14b8a6" stroke-opacity="0.3"/>
</svg>
