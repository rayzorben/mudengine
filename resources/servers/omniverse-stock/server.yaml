# OmniverseBBS - Stock: a stock MajorMUD realm. See `majorbbs/server.yaml` for the login list.

name: 'OmniverseBBS - Stock'
host: omniversebbs.com
port: 3237
encoding: cp437

login:
  - when: 'Please enter your User-ID'
    send: '{user}'
  - when: 'Enter your password:'
    send: '{password}'
  - when: Make your selection
    send: G
  - when: (SHOWCASE)
    send: '3'
  - when: '[MAJORMUD]'
    send: E
  - when: Do you want to see it now
    send: N
  - when: '(N)onstop, (Q)uit, or (C)ontinue?'
    send: Q
    repeat: true
