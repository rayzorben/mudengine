# Paradigm TEST PVE.
#
# One of the six Paradigm realms this client ships, the same six MegaMUD's own
# Paradigm distribution defines (`mega-paramud/BBS/*/BBS.INI`).
# The test server, on its own port. Realm 1 there, as Game 1 is realm 1 on
# the game server -- the number is per server, not global.
#
# `resources/servers/paradigm-game-1-pve/server.yaml` is the annotated copy:
# what each key is for, why the menus live on the realm and the account does
# not, and why none of these names a `database:`. Only the realm number below
# differs between them.

name: Paradigm TEST PVE
host: paramud.mudinfo.net
port: 2324
encoding: cp437

login:
  - when: 'Please enter your selection'
    send: P
  # Which realm on this server.
  - when: 'Please select a realm'
    send: '1'
  # The character slot. A second character on this realm states its own
  # `login.steps` on its own file rather than editing this.
  - when: 'Please select a character'
    send: '1'
  - when: '[PARADIGM]'
    send: E
  - when: Accept these realm rules to continue
    send: '1'
  - when: '(N)onstop, (Q)uit, or (C)ontinue?'
    send: ''

# No `database:`: the world that ships with the client is Paradigm's own,
# built from `default-pmud.mdb`.
