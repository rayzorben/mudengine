# mudengine — internal settings
#
# How the client behaves about its *own* commands. Not the options file: that
# one is yours, and every value in it is a choice about a character. This one
# is the client's, kept where it can still be read and edited, and reloaded the
# moment it is saved.
#
# Nothing in a profile can override it, on purpose: two characters that
# disagreed about which of the client's housekeeping shows in the console would
# be two consoles that behave differently for no reason a player chose.

terminal:
  quiet:
    # Commands the client sends on its own behalf whose echo and answer stay
    # out of the console — `rm` is asked on every arrival so the map knows
    # where it is, and answers with a line nobody reads. Only what automation
    # sends is ever quiet; anything you type is always shown, and so is
    # anything the server volunteers in the middle of an answer — a monster
    # walking in, somebody talking — because that is not the answer.
    enabled: true
    # The first word of the command, as the client sends it.
    #
    # The client never sends `l` on its own behalf any more: a look tells
    # everybody in the room that this character is looking around, which is
    # spam in company and a tell in a fight. It re-reads the room with a bare
    # Enter, which prints the same block and says nothing to anybody. That has
    # no first word, so it answers to `enter` here -- add it to keep the idle
    # and mid-fight re-reads out of the console as well.
    #
    # `pro` and `set` are the status-line routine's: thirty lines of profile
    # and a `Done.`, sent only when `automation.statline.control` is on.
    commands:
      - rm
      - look
      - pro
      - set

  # Decorate what the console recognises: a glyph beside a shop or bank's
  # name, and a monster's, item's or spell's name that can be clicked for what
  # the realm knows about it. Drawn outside the character grid, so nothing the
  # server lays out in rows and columns moves.
  enrich: true

# Which commands the palette (Ctrl/Cmd K) pins to the top on a fresh client.
#
# The palette opens on a pinned section and four collapsed headings; expanding
# one shows the rest of that group, and typing finds every command there is --
# pinning curates the shelf, it does not lock the warehouse. A pinned command
# is drawn at the top *instead of* in its own group, so no row is ever in the
# list twice.
#
# This is the shelf you start with, not the shelf you keep: the pin at the end
# of any row (or Ctrl/Cmd P on the highlighted one) moves a command on or off
# it, and that is remembered without rewriting this file. Editing a line here
# still wins for the command it changes its mind about.
#
# Patterns are command ids, exact or with a trailing `*`: `loop:*` is every
# loop your character defines, `pane:*` every split. They are matched against
# the group the command itself belongs to. Stating this block replaces the
# default list whole.
palette:
  pinned:
    character:
      - settings
    navigate:
      - route
      - 'loop:*'
      - 'move:stop'
    # Nothing in View is reached often enough to earn a permanent row; expand
    # the heading, or pin what you use with one click.
    layout:
      - 'pane:*'
      - 'cards:reset'

# Which buttons the toolbar draws on a fresh client.
#
# The toolbar is one row of glyphs docked above the console -- automation you
# reach for while playing, and the transport controls beside it. Every one is a
# toggle whose answer lives in the character's own file, so pressing one edits
# `automation:` there and the button and the settings screen can never disagree
# about what the character is doing.
#
# The vocabulary is far longer than a row, so this is the row you *start* with:
# the `...` at the end of the toolbar lists every button there is and pins or
# unpins it, and that choice is remembered without rewriting this file. Editing
# a line here still wins for the button it changes its mind about. Stating this
# block replaces the default list whole.
#
# Names are button ids. The switches are `automation` (the master), `combat`,
# `retaliate`, `engageWhileWalking`, `retreat`, `hangUp`, `loot`, `drop`,
# `search`, `autoDeposit`, `openDoors`, `pickLocks`, `bashDoors`, `sneak`,
# `healParty`, `assistLeader`, `defendParty`, `restWithLeader`, `remotes`,
# `gangpath` and `lookAtPlayers`; the rest are `connect`, `gear:restore`,
# `loop:open` (the shelf of every loop), `loop:build` (the card a loop is drawn
# on, by clicking rooms on the map) and `move:toggle` -- one key for the whole
# transport, which goes or stops whichever of a route and a loop is on.
toolbar:
  pinned:
    - connect
    # Put the kit back on, from what the client saw in each slot. A death takes
    # everything off and leaves it in the pack, so this is the first press of
    # that recovery -- which is why it sits beside the dial rather than with the
    # loop's transport. Greyed when there is nothing in the pack to put back.
    - 'gear:restore'
    - automation
    - combat
    - retaliate
    - loot
    # Searching every room, on the row rather than in the kebab: it costs a
    # command per room, so it is the kind of switch somebody turns on for one
    # corridor and off again -- and one you toggle that often behind a menu is
    # one you stop toggling.
    - search
    - 'loop:open'
    - 'move:toggle'

# Every number the client uses to decide something.
#
# The rule this block exists for: no value that makes a determination is
# written into the code that acts on it. A timeout too short for your link, a
# retry count one too few for your realm, a cap that truncates a listing your
# server actually sends -- every one of those used to be a code change for a
# number. They are all here, so the answer is an edit to this file.
#
# Read once at startup and again on every save, like the rest of this file.
# Anything you leave out keeps the value below; anything unreadable does too,
# and a key this client has never heard of is ignored rather than carried.
# Durations end in `Ms` and are milliseconds and floor at 1 -- a
# zero-millisecond timer spins a core -- and a value that is a fraction here
# stays one, clamped to 0-1.
#
# Most of these should never need touching. They are here so that when one
# does, you can fix it without waiting for a release.
tuning:
  # Framing, negotiation and the socket itself — `src/main/net/`.
  net:
    # How long to wait for a socket to open before giving up on it.
    #
    # Generous for a BBS on a slow link and far short of the operating
    # system's own patience, which is what matters: the OS gives up on an
    # unanswered SYN after roughly two minutes, and a client that waits that
    # long has already stopped being usable.
    connectTimeoutMs: 15000

    # Trailing window in which repeated geometry changes coalesce into one
    # NAWS report. A pane transition remeasures on every frame; without this,
    # one drag puts a report on the wire per frame of it.
    nawsCoalesceMs: 150

    # Cap on a single unterminated line held in the framing buffer. Past this
    # the content is not a line in any useful sense and is released as one:
    # losing the framing beats losing the process.
    maxPendingBytes: 65536

    # Longest partial escape sequence held back while the rest of it is
    # awaited. CSI sequences in this domain are far shorter; the cap only
    # stops a stuck stream when a lone ESC arrives and nothing follows.
    maxPartialEscapeBytes: 32

    # How long after `end()` a closing socket is destroyed outright. `end()`
    # waits for the FIN handshake; this guarantees the socket is gone even if
    # the peer never replies.
    destroyDelayMs: 250

  # Dialling back a connection that was LOST — `src/main/session/Reconnect.ts`.
  #
  # A character asks for this in its own profile (`autoReconnect`, on by
  # default); these are the waits it uses. The ladder is
  # `min(maxDelayMs, attempts * stepMs)`, so out of the box the first attempt is
  # immediate and the rest wait 5s, 10s, then 15s for as long as it takes.
  #
  # It never fires for a disconnect you asked for — pressing Disconnect, the
  # low-health hang-up, switching realms, quitting — and never once you have
  # left the realm on purpose.
  reconnect:
    # What each consecutive failure adds to the wait before the next one.
    stepMs: 5000

    # Where the wait stops growing, and sits for every attempt afterwards. On a
    # link that takes a minute to come back, raise this rather than editing a
    # schedule.
    maxDelayMs: 15000

    # Consecutive failures before the client stops and says so. Effectively no
    # limit: a router that comes back at 4am should find the client still
    # asking.
    maxAttempts: 999999

    # Consecutive connections that OPENED and were dropped before they settled,
    # before the client stops and says so. Far lower than maxAttempts and
    # bounding a different thing: an outage refuses or never answers, and
    # dialling that for as long as it takes is the point of the number above. A
    # server that accepts and hangs up seconds later is a full BBS, a realm
    # rebooting -- or a front end answering a refused password with a sentence
    # this client has no pattern for, where the credentials would go back out on
    # every rung.
    maxFlaps: 5

    # How long a connection has to hold before the NEXT loss starts the ladder
    # over rather than continuing it. Without it, a server that accepts and
    # immediately drops — a full BBS, a realm rebooting — would be dialled again
    # as fast as TCP allows, for ever.
    settledMs: 30000

    # How long a command may go unanswered before the link is called dead and
    # hung up, so the ladder above can dial back. A socket staying open is not
    # evidence that anything is on the other end of it -- a NAT table that
    # forgot the flow, or a host that went away without a FIN, leaves a
    # writable socket that will never answer again.
    #
    # Counted only while an answer is OWED: the clock starts when a command
    # goes on the wire and stops at the next byte in. Silence on its own would
    # be wrong twice over -- this realm repaints its status line unprompted
    # every thirty seconds, and a client that has asked for nothing is owed
    # nothing.
    #
    # 0 switches it off. Whether the client then dials back is the character's
    # own `autoReconnect`.
    silentForMs: 15000

  # Reading the stream — `src/main/parse/`.
  parse:
    # A text match on its own. Most blocks never get a colour opinion.
    baseConfidence: 0.8

    # Text match plus the colour the rule expected.
    colourAgrees: 0.95

    # Text matched, but not in the colour this rule usually wears.
    colourDisagrees: 0.6

    # Cap on description lines held for one room. A description is defined by
    # what it is *not*, so a room that never completes must not accumulate
    # without bound. Comfortably above the longest seen from the live server.
    descriptionLines: 20

    # Cap on the lines of a `who` listing -- the one listing whose length is the
    # realm's business rather than the pattern's, because it has one row per
    # person logged in. What actually ends the listing is the status line the
    # server prints after it; this is the backstop for a realm whose prompt this
    # client has never met, so it has to sit above any population you play on.
    # It was 60 beside the pattern, and a busier realm silently lost everybody
    # past the sixtieth row -- a `who` on screen with the client calling the
    # person on it offline.
    rosterLines: 400

    # How often a monster heals itself, in milliseconds.
    #
    # A monster regenerates on a server tick and nothing announces it, so a
    # wound estimate built from damage alone only ever falls and drifts below
    # the truth as a fight drags on. The realm data states the amount per
    # monster; this is the cadence.
    #
    # 30s on GreaterMUD (6 rounds of 5s) and 90s on stock MajorMUD (18 rounds).
    # A realm running faster than its own clock -- a test server, say -- wants
    # this scaled to match, which is why it is a setting and not a constant.
    mobRegenMs: 30000

    # How long after this character's own landed blow an unattributed damage
    # line still reads as that blow's weapon proc, in milliseconds.
    #
    # The backstop, not the discriminator. What binds a proc to the blow that
    # fired it is that the server composes the two into one write, so nothing
    # but the repainted prompt sits between them; any other line in the gap
    # breaks the binding. A window alone could not do that -- the server
    # writes a whole round in one breath, so another player's spell is inside
    # 41ms as readily as a proc is.
    #
    # This bounds what adjacency cannot: a blow, a long silence, and then an
    # unattributed line that is nobody's proc. Measured: 581 procs across the
    # recorded sessions of 2026-09-06, median 3ms behind the blow and slowest
    # 41ms.
    procWindowMs: 1000

    # Remembered attackers in one fight. The names matter, not the count.
    maxAttackers: 12

    # Monsters tracked in one fight. The oldest ledger is dropped.
    maxLedgers: 8

    # Unanswered directions remembered. Deep enough for a burst a player can
    # type or a walk can enqueue, shallow enough that a client which has lost
    # the thread stops pretending.
    maxPendingMoves: 12

    # Commands sent and not yet seen echoed back. The server echoes what it is
    # given, in order, without waiting for one to be answered before echoing
    # the next -- so a burst comes back as a run of bare lines, one per command,
    # and what this client sent has to be a queue rather than one value. It was
    # one value, and only the last command of any burst was recognised as its
    # own echo; the rest were read as though the game had said them.
    maxPendingEchoes: 32

    # And how long one of them may wait before the client gives up on it. The
    # cap above and this one are the same claim on two axes -- "this client has
    # lost the thread" -- and only the depth one used to exist. A sentence the
    # parser cannot read answering a move leaves the claim outstanding for ever,
    # and running away, walking a route, running a loop and hitting back all
    # stand down while one is. Long enough for a step the server is slow with;
    # short enough that a fight is still a fight when it lapses.
    staleMoveMs: 8000

    # Pack changes held against a listing that has not finished arriving. A
    # listing takes about a second; this covers what a person or a fight can
    # do in one, and no more.
    maxPackChanges: 16

    # Possible rooms kept for the resolution trace.
    maxRoomCandidates: 8

    # The band a line has to be inside to be read as a room's name.
    #
    # Tuned against the capture corpus: the shipped realm's longest is well
    # inside the ceiling, and the floor is what keeps a two-letter answer from
    # being taken for a place. Losing a name is not cosmetic — the room block
    # completes with nothing to look up, so the client stops knowing where it
    # is standing.
    roomNameMinChars: 3

    roomNameMaxChars: 60

  # The one writer to the socket, and what drives it.
  queue:
    # How long a half-typed line keeps holding automation after the last
    # keystroke, before it is written off as abandoned. It has to survive any
    # pause a person actually takes mid-word — a release landing in the middle
    # of one produced `lpu thin kobold thief`, said out loud in the room
    # (captured live, 2026-08-26) — and it must not silence the keep-alive for
    # a whole evening because somebody typed two characters and walked away.
    abandonedLineMs: 20000

    # How long a command the server threw away waits before it is sent again.
    #
    # `You fumble in confusion!` is the server discarding whatever was sent
    # before it looked at it, and the same branch puts the character in a
    # 1000ms delay -- so the status line that follows arrives inside that wait
    # and a resend on it would be sent into a server not listening yet. This is
    # the server's own figure, and erring long costs latency where erring short
    # costs the command a second time.
    fumbleRetryMs: 1000

    # How long after the last combat message `mid-round` fires.
    midRoundMs: 100

    # A floor on the idle poll rate, not on the configured quiet period.
    # Unreachable from any options file — it exists so a config that arrived
    # here unnormalised cannot spin a timer hot.
    minIdleTickMs: 100

    # The shortest gap between two roster catch-up `who` commands.
    #
    # Somebody entering the realm is a fact about who is online, and only a
    # listing settles what they are. Asking on each arrival would spend a
    # command per arrival on a busy realm; asking only when the character next
    # goes quiet meant one that fights and walks all evening never asked at all
    # -- a `who` on screen and a record saying "offline" on the same screen.
    # So it is a debounce: the first arrival asks, and the arrivals inside the
    # window are answered by the same listing.
    rosterAskMs: 60000

    # The floor between two looks at other players, and how long one is worth
    # sending. A room that fills up should not spend six commands at once on
    # something nobody asked for urgently -- and the answer is about somebody
    # standing in THIS room, so a look held behind a fight for a minute arrives
    # at a person who has walked out.
    lookAskMs: 4000
    lookExpiresMs: 20000

    # Decision-trace entries kept; it answers "why did it do that?".
    traceLimit: 200

  # Fighting on the character's behalf — `AutoCombat`.
  combat:
    # How long after the last combat line a round verb goes out. Inside a
    # round rather than between rounds, and the one piece of timing worth
    # taking from `tproxy`. It also collapses a burst of six combat lines into
    # the one round they are.
    roundMs: 100

    # The shortest gap between two attempts to open a fight on the same thing.
    # Not pacing — pacing comes from the prompt — but a floor on *asking*: an
    # attack refused for a reason this client cannot see leaves the room
    # exactly as it was.
    engageCooldownMs: 4000

    # How long an arrival sentence stays pending its own state change. Short,
    # because what it bounds is the case where the change never comes.
    arrivalWindowMs: 2000

    # How long a typed `break` stands auto-combat down. The stand-down ends
    # early when the player attacks or the room changes; this is the backstop
    # for standing still.
    breakStandoffMs: 30000

    # How old a sighting of the leader's target may be before it is nobody's.
    assistFreshMs: 60000

  # How a monster's hazards are priced when auto-combat decides what to hit
  # first. A blow is hit points and needs no pricing; everything else a
  # monster can do is priced in rounds of the whole room's blows against this
  # character — a round spent paralysed costs whatever everything in the room
  # lands in a round, because that is exactly what happens during it.
  menace:
    # A round held (HoldPerson): unable to leave, in a realm where leaving is
    # the only escape. Whole rounds, like afraid, summon and teleported; the
    # three halves below are fractions of one.
    held: 1

    # A round confused, scaled by the spell's stated chance of an action
    # misfiring.
    confused: 0.5

    # A round blind.
    blinded: 0.5

    # A round slowed.
    slowed: 0.25

    # A round afraid, scaled by the stated chance of being shoved out of the
    # room.
    afraid: 1

    # One summoned ally: a fresh monster, in this room, now.
    summon: 2

    # Being teleported somewhere the character did not choose.
    teleported: 1

    # Multiplier for a spell that reaches everybody in the room: it lands on
    # the character whoever the monster is facing, and on the party besides.
    roomWide: 2

    # How many three-second effect ticks of a poison or a lasting damage spell
    # are counted. A bite that poisons for a hundred ticks runs five minutes
    # and is cured or outrun long before that; twenty is a minute.
    lastingTicks: 20

    # The least one round of the room is worth, in hit points. A room of pure
    # casters lands no blows, and a round held in it is still not free.
    unitFloor: 10

    # A death spell fires once; it is spread over this many rounds so it
    # counts towards the order — taken early, at full health — without
    # outweighing every round of blows before it.
    deathOverRounds: 5

  # Casting on the character's behalf — `AutoHeal`, `Cures`, `Blessings`.
  spells:
    # How sure one cast has to be of finishing the monster before the cheapest
    # spell that would outranks the hardest hitter, under Auto Choose Best Spell.
    killConfidence: 0.9

    # How long a heal proposal stays worth sending.
    healExpiresMs: 3000

    # Long enough for the next status line to say whether the heal worked.
    healCooldownMs: 6000

    # How long a cure proposal stays worth sending.
    cureExpiresMs: 3000

    # How often the blessing maintainer looks at what has lapsed.
    buffTickMs: 1000

    # How long a blessing proposal stays worth sending. Never urgent.
    buffExpiresMs: 10000

    # The gap between blessing proposals, module-wide: one blessing at a
    # time, at the pace the server confirms casts, because a second spell in
    # the same round is answered with a refusal.
    blessCooldownMs: 6000

    # How long a proposed blessing that was never confirmed is trusted to be
    # in flight before it is proposed again — a cast refused, under-manaed or
    # expired in the queue. The cures' own retry, for the same reason.
    blessRetryMs: 30000

    # The watchdog behind a self blessing whose duration has never been
    # measured: how long the buff is trusted when no wear-off frame is read.
    # Once a cast→wear-off pair has been observed, the measured duration
    # (plus blessSlack) replaces this.
    blessWatchdogMs: 300000

    # Slack on a measured duration, as a fraction of it: the watchdog fires
    # this much after the buff should have ended, so the wear-off frame —
    # the honest signal — always gets to speak first.
    blessSlack: 0.25
    # How soon after a cast an onset line (`You feel safe from evil!`) is
    # learned as that spell's, so the `st` timer can be attributed to it.
    onsetWindowMs: 3000
    # How long a sentence nothing recognised is kept as a possible ending for a
    # buff whose ending is unknown, waiting for an `st` sheet to settle it.
    pendingStopMs: 600000
    # How soon after a learned ending removed a buff the buff reappearing
    # unprompted counts as the wire contradicting the lesson.
    stopContradictionMs: 120000
    # The least often an `st` is asked for to settle a buff ending nothing
    # recognised.
    sheetAskMs: 30000
    # The longest a sentence nothing recognised may wait for an `st` and still
    # have the sheet's silence count as "not a lasting effect". Past this the
    # candidate is dropped unresolved instead.
    effectVerdictMs: 15000
    # How far apart an unnameable effect ending and a condition ending may be
    # and still be read as one event, which is what confirms what it causes.
    effectCauseMs: 5000

  # Drinking on the character's behalf — `Potions`.
  potions:
    expiresMs: 3000

    # Long enough for the next status line to say whether it worked.
    cooldownMs: 6000

  # Picking things up — `AutoLoot`.
  loot:
    expiresMs: 5000

  # Where to hunt — `src/shared/hunting.ts`, the cycle model MMUD-Explorer's
  # Model D is built on, closed-form. `roundSeconds` is a combat round;
  # `restTickSeconds` and `passiveTickSeconds` the two regeneration ticks;
  # `killOverheadMs` the looting and retargeting per kill; `stepMs` one
  # step of a walk; `greatermudRespawnOffsetSeconds` the thirty seconds
  # GreaterMUD's regen adds before comparing with a room's delay (its author
  # calls it a kept bug), so a lair comes back that much sooner there;
  # `backstabMultiplier` what the opening backstab is worth in swings
  # (measured 4.1×); `maxLoopRooms` and `maxSpots` bound the suggestions;
  # `betterSpotRadius` is how far the lap's low-experience stop looks for a
  # better lair.
  hunting:
    roundSeconds: 5
    restTickSeconds: 15
    passiveTickSeconds: 121
    killOverheadMs: 1500
    stepMs: 1250
    greatermudRespawnOffsetSeconds: 30
    backstabMultiplier: 4
    maxLoopRooms: 8
    maxSpots: 12
    betterSpotRadius: 80

  # Going back for the kit after a death — `GearRecovery`. `collectMs` is how
  # long the pack has to reflect the `get`s before the kit is put on with what
  # arrived; `expiresMs` drops a command still queued when the room has changed.
  gearRecovery:
    collectMs: 8000
    expiresMs: 6000

  # Spending character points on the stat screen — `StatScreen`. `echoMs` is
  # how long the screen has to echo a keystroke before the driver lets go of
  # it; `expiresMs` drops a `train stats` still queued when the moment has
  # passed.
  train:
    echoMs: 4000
    expiresMs: 8000

  # Getting back into the shadows between fights — `AutoStealth`.
  # `askEveryMs` floors the retry after a failed roll, so a low-Stealth
  # character is not asking once per status line; `expiresMs` drops an ask
  # still queued when the room has already changed.
  stealth:
    askEveryMs: 4000
    expiresMs: 5000

  # Readying a light before a dark step — `AutoLight`. A `light` or `remove`
  # still queued after this is for a room already left.
  light:
    expiresMs: 4000

  # Keeping the pack stocked — `Supplies`. `buyTimeoutMs` is how long a `buy`
  # may go unanswered by `You just bought …` before it is taken as refused;
  # `retryMs` how long a refused item is left alone; `maxLegs` how many times
  # the walk to the shop is planned again after a fight stops it.
  supplies:
    buyTimeoutMs: 8000
    expiresMs: 6000
    retryMs: 300000
    maxLegs: 4
    # The whole errand's deadline, after which it gives the lap back — a leg
    # superseded by another walk raises no ending of its own.
    errandTimeoutMs: 300000

  # Shedding named junk — `AutoDrop`.
  drop:
    expiresMs: 5000

  # Looking for what a room did not print — `AutoSearch`. Shorter than the
  # loot's on purpose: a search is about the room the character is standing in,
  # so one still queued after it has walked out would look somewhere else.
  search:
    expiresMs: 3000

  # Banking the purse — `AutoDeposit`.
  banking:
    # Long enough for the deposit sentence to move the purse; without it a
    # status line arriving before the answer would propose the same deposit
    # again.
    cooldownMs: 10000
    expiresMs: 10000

  # Sitting down — `Recovery`.
  rest:
    # Generous, unlike an attack's: what this reacts to is a number that moves
    # slowly, and a `rest` that arrives two seconds late is still a rest.
    expiresMs: 5000

    # A lair whose effective respawn is at most this many seconds is not a
    # resting place; a rest takes minutes, and a clock of ten minutes or less
    # runs out during it. `peekMs` is how long the look next door, and then the
    # step, may go unanswered.
    lairClockMaxSeconds: 600
    peekMs: 4000

    # How long a proposed `rest` is trusted to be in flight before it is asked
    # for again. `(Resting)` is the server's answer and does not exist until the
    # `rest` has been answered, so with eight probe replies outstanding at login
    # eight status lines came back before the first one did and each proposed
    # another — eight `You are now resting.` inside 80ms, measured 2026-09-02.
    # Bounded rather than permanent, so a `rest` the server swallowed is still
    # asked for again; cleared the moment the flag does arrive.
    askedMs: 3000

  # Commands on a clock — `Events`.
  events:
    tickMs: 1000

    # How long a proposal stays worth sending. A timed command is not urgent.
    expiresMs: 10000

  # Walking a planned route — `Walker`.
  walk:
    # How long one hold lasts before the walk tries the step again.
    holdMs: 1500

    # How many holds run back to back before it walks on regardless.
    maxHolds: 3

    # How far the character may have wandered from what it was walking before
    # pressing play asks about it first.
    #
    # A stop is a pause that may or may not be permanent, so the thing it
    # stopped is still there hours later -- and the character may have been
    # walked across the realm, or killed and reborn in a temple on another map,
    # in between. Picking it back up is then a journey in its own right that
    # nobody asked for, which on a realm full of wandering monsters is not free.
    # Past this many steps the client answers play with a question.
    #
    # Measured in the steps the resume would actually walk: for a route, how
    # many *more* than it still owed when it stopped, so walking on down a
    # route you were already on never asks however long it is; for a lap, the
    # distance to the stop it was heading for, since a leg is short by
    # construction and that distance is how far off the lap you are.
    resumeAskSteps: 30

    # How long a route waits out a fight before it gives up on the journey.
    #
    # A fight normally ends by itself — the monster dies, the character runs,
    # or the character does — so the hold that waits for it needs no clock. This
    # is the floor under the case where *nothing in this client can end it*:
    # auto-combat and the retreat are both off by default, so a wandering monster
    # can open on an unattended character with neither of the two things that
    # would finish the fight switched on, and the route would stand there
    # silently for the evening.
    #
    # Generous on purpose: a fight this client is actually fighting is seconds,
    # so two minutes only ever expires on one it is not.
    fightHoldMs: 120000

    # How long a walk stands still for a condition before spending one step to
    # find out whether it is over.
    #
    # A retry, not a deadline. The other bounds here give up; this one asks. A
    # hold ends when the realm says so, and the client reads twenty-two of those
    # sentences: the two fixed in the server's own code, and the twenty the
    # message table pairs with a spell the realm marks as holding. A realm is
    # free to ship a twenty-third, and a wear-off nothing here can read would
    # otherwise stand a route still for the evening.
    #
    # One step settles it, and it is the cheapest thing that can: the server
    # either walks the character or prints the holding spell's own sentence
    # again, which re-arms the hold with a fresh window. Being wrong costs one
    # command every half minute; having no bound at all costs the journey.
    heldFallbackMs: 30000

    # How much longer than this realm's own slowest answer a step may go
    # unanswered before the walk sends one bare Enter to force a status line out
    # of the server.
    #
    # A margin over a measurement, never a claim about the server. This used to
    # be the whole deadline and meant "a move is answered in well under a
    # second" — true of one realm, stated about all of them. Paradigm's movement
    # round is a measured 1,239ms, so the fallback fired on every step of every
    # walk, and the bare Enter it sends is answered with a full reprint of the
    # room: every room appeared twice, all the way round the lap.
    #
    # The walk now measures what a move actually costs on your realm and this is
    # the headroom on top. It is also the whole deadline until a move has been
    # answered once, which is the only moment there is nothing to measure
    # against. One per step; the full stepTimeoutMs runs behind it before the
    # walk gives up.
    nudgeAfterMs: 1000

    # How many recent move answers that deadline is measured over.
    #
    # The statistic is the slowest of them: the deadline exists to be later than
    # a normal answer, and one fast answer says nothing about the slow case — a
    # step whose room dead reckoning had already placed answers in a millisecond
    # and is not evidence the realm is quick. A window rather than an all-time
    # maximum, so one lagged answer ages out instead of standing the fallback
    # down for the evening.
    nudgeSamples: 5

    # Confirmed steps kept for a retreat to look back over.
    recentSteps: 5

    # How far below a barrier's stated number the character's own skill may
    # sit and still be worth spending a command on.
    #
    # **Not measured.** The realm records one number per barrier and nothing
    # says what a roll against it looks like. The two differ because the two
    # attempts do not cost the same: a failed pick costs a command, a failed
    # bash costs a command *and* health, so the cheaper attempt is allowed the
    # longer reach.
    bashMargin: 10

    pickMargin: 20

    # How long a walk stands at a hidden exit between two searches for it.
    #
    # There is no count. The realm's own data says a search reveals this exit,
    # and stopping after two rolls of a skill check would be the client
    # deciding the realm is wrong -- which is what happened: a hand-typed third
    # search found the exit a moment after the route had struck the corridor
    # out. So this is the pace, and the pace is the whole of what bounds it.
    searchRetryMs: 1500

    # How often a walk repeats the line about the hidden exit it is waiting for.
    #
    # The searching has no ceiling, so the hold can outlast a lap -- and said
    # once, the reason for a standstill is a line eight hours up the scrollback.
    # Five minutes: never the chrome talking over the game, and short enough
    # that somebody who looks at the console gets an answer without scrolling.
    searchSayEveryMs: 300000

    # How many failed searches before the walk asks the server to reprint the
    # room, rather than only after a search that succeeded.
    #
    # A found exit joins the room's own `Obvious exits:` line, and that line is
    # what the walk reads to decide the exit is there -- but the server says
    # `You found an exit to the south!` and does not reprint the room. So a
    # walk went on searching a room whose exit it had already found. A success
    # always asks for the reprint; this is the same reprint on a count, for the
    # two ways a success can be missed -- the sentence arriving in a burst, and
    # somebody else opening the way.
    searchRecheckEvery: 3

    # How many rounds of levers one action-gated exit is worth. Counted where a
    # search is paced, because the realm names the exact phrase that opens this
    # one: a couple of rounds either works or the phrase is not what the realm
    # claims. A search is a skill check the realm expects to fail sometimes.
    leverTries: 2

    # How long a walk stands at a shut door it could not force before running
    # the whole ladder — open, pick, bash — again.
    #
    # Long enough that a character resting under restBelow gets several status
    # lines of recovery between rounds, which is the case the retry exists for:
    # a bash costs health, and the rung that spends it is refused while the
    # character is too hurt to travel.
    barrierRetryMs: 5000

    # How many times that ladder is run again before the walk gives up on the
    # door.
    #
    # fightHoldMs's argument in the other shape: a hold whose end nothing in
    # this client can bring about needs a floor under it, or an unattended
    # character stands at a portcullis sending `bas w` all evening. What ends
    # this one is the door opening — by the next bash, by a lock that rolls
    # better, or by somebody else walking through it — and none of the three is
    # guaranteed. Twelve rounds at five seconds is a minute of trying.
    barrierRetries: 12

  # Running a loop — `LoopRunner`.
  loop:
    # Consecutive non-combat failures before the loop gives up on itself.
    maxFailures: 3

    # How many times a lost loop asks the realm where it is before giving up.
    maxLocates: 5

    # How long to give a fact already on its way before asking for it. Long
    # enough that the answer normally arrives first, short enough that a move
    # the server swallowed does not leave a loop reporting progress it is not
    # making.
    locateWaitMs: 2500

    # How long an arrival stands in a stop that asked for no longer.
    #
    # Not a politeness pause. Engagement fires from character state while the
    # character is *standing somewhere*, and a loop that advanced the moment
    # each leg confirmed walked past twelve laps of monsters engaging nothing.
    dwellMs: 2000

    # How long a loop stands still after an escape before it will plan again.
    #
    # An escape leaves the character one room from what it ran from, and the
    # lap's next leg is planned from where it landed. The health hold
    # (`restTo`) covers running away hurt; this is the floor under it,
    # for running away from a crowd at full health.
    escapeSettleMs: 8000

    # The margin a lap held for health resumes above the floor it paused at,
    # when no ceiling is set.
    #
    # `restTo` is the ceiling and also the resume floor -- but `restTo: 0` means
    # *the single sit-down* rather than *no hysteresis*. Read literally, a lap
    # would resume marching at exactly the health it paused at and the next hit
    # would put it straight back, at status-line cadence. So a 0 ceiling resumes
    # this fraction of maximum above the floor instead.
    resumeMarginWhenUncapped: 0.1

    # How long a lap runs before its experience rate is held against
    # `automation.walk.minExpPerHour`. The first minutes of any lap are the walk
    # to the first lair, at no experience at all, and a floor judged then would
    # stop every lap on the way out of town.
    expRateGraceMs: 900000

  # Answering for an absent player; see `automation.afk` in the options file.
  afk:
    # How often one sender is told the player is away. A person who telepaths
    # twice in a minute has been answered once; a reply per line is a client
    # arguing with them.
    replyEveryMs: 600000

  # The `@` conversation with another player's client.
  remotes:
    # How long a question sent to another client waits for its answer before it
    # is written off.
    #
    # It decides one thing only: whether an extended remote — a question only
    # this client can answer — went to somebody who is not running it, so the
    # plain wording is sent instead and the player is recorded as not reachable
    # that way. Erring long costs a question its latency once; erring short
    # records somebody as the wrong client on a slow evening.
    #
    # Not measured against a peer: there has never been a second one of these
    # clients to capture. Revisit with a capture.
    replyMs: 30000

  # How many commands one press or one `@` may spend.
  #
  # One budget, because it is one budget: each `wear`, `get` or `drop` comes
  # out of the same allowance the fight is being fought with, and a pack's
  # worth of them queued behind an escape is the failure pacing exists to
  # prevent. Said out loud when it bites, rather than silently doing ten of
  # eighteen.
  spending:
    # One `@get-all`, or one `@drop-all`.
    maxGets: 10

    # One press of the gear button.
    maxGear: 10

  # What one session keeps in memory for the diagnostics cards.
  session:
    # How far experience must fall before the client suspects a character was
    # deleted and made again on the same login.
    #
    # The weakest of the four signals it looks at, and the only one with an
    # innocent explanation -- a death costs experience -- which is why it is a
    # SHARE of what was there rather than any drop at all. The other three (the
    # race changed, the class changed, the level went back to 1) are facts a
    # character cannot do to itself and have no threshold. 0 switches this one
    # off. Nothing is ever deleted without being asked.
    resetExpDropShare: 0.3

    # Negotiation records the diagnostics pane can look back over.
    telnetLogLimit: 500

    # Framed lines retained; the terminal keeps the real backscroll.
    lineLogLimit: 500

    # How long a prompt that has opened its bracket and not closed it may keep
    # arriving before the client stops waiting for the rest. The bearfather BBS
    # writes its prompt in two pieces about a tenth of a second apart (median
    # 123ms, longest seen 686ms), and a prompt cut there used to be neither
    # read nor redrawn. Waiting costs nothing: nothing else can follow a prompt
    # on the wire until it ends. This is only what paints a prompt the server
    # never finishes.
    promptHoldMs: 1000

    # How long the lines of a listing the client redraws (ui.rewrites) wait for
    # the status line that ends the listing before they are painted as sent.
    # The listing is redrawn whole at that prompt, which the idle flush frames
    # 150ms after the last byte; this is the bound for a server that stalls in
    # the middle of one.
    rewriteHoldMs: 2000

    # Records the debug window keeps, and therefore how far back a bug report
    # reaches.
    #
    # Larger than the others on purpose: this ring holds every kind of record at
    # once -- the raw stream, the framed line, the classification, the state
    # change and the decision -- so one line of the game costs several entries,
    # and a report that only covers the last few seconds does not cover the
    # thing you are reporting. It fills whether or not the window is open,
    # because a trace you have to turn on before the surprise is one that never
    # catches it.
    debugLogLimit: 4000

    # Sent commands the decision trace keeps — enough to cover the minute
    # before something went wrong, which is the window anyone asks about.
    sentLogLimit: 60

    # Safety decisions kept. Small on purpose: these are rare by construction,
    # so a long list means something is wrong rather than something is busy.
    safetyLogLimit: 40

    # How long a `safe-haven` retreat waits for the fight to end.
    retreatPatienceMs: 20000

    # How long a `safe-haven` retreat waits for the escape move to land.
    retreatSettleMs: 5000

    # Minimum gap between decision-trace publishes. The queue changes several
    # times a second in combat and every change interests a diagnostics card
    # and nothing else.
    automationPublishMs: 250

    # Actions offered on the room line the console just printed. Capped
    # because a row of eight buttons pushes the room's name off the screen.
    roomActions: 4

    # Cap on the half-typed line the client keeps a copy of. Past this it is
    # not a command anybody is typing, and dropping it beats growing for ever.
    outboundLineLimit: 512

    # How long a direction the player typed is watched for its room before it
    # is written off. A walk or a loop stands down when the player moves the
    # character themselves, and it is the arrival that says they did — a
    # direction into a wall moves nobody and must not end a lap.
    playerMoveWindowMs: 15000

    # How often the heal, the potion, the cures and the resting re-decide with
    # no new status line to decide from.
    #
    # Everything automated hangs off a state change and a state change needs a
    # status line — which a standing, idle character gets only when the server's
    # own regeneration moves a vital, once every thirty seconds. So a decision
    # deferred on a clock of its own (a heal's cooldown, a cure's retry) was not
    # taken when the clock lapsed: it was taken whenever the game next spoke, or
    # whenever you pressed Enter. Measured 2026-09-02, a cast came off a
    # six-second cooldown at 97.6s and went out at 120.5s, on a keystroke.
    #
    # Blessings owns this same clock for itself and is deliberately not driven
    # from here.
    reconsiderMs: 1000

  # What the client writes to disk about a character and a realm.
  records:
    # How long the fight log holds records before writing them.
    fightFlushMs: 2000

    # How many it holds if a flush never happens.
    fightsHeld: 2000

    # How many recorded fights are folded per turn of the event loop when a
    # character's record is first read back, so the socket is read between slices.
    fightsFoldSlice: 500

    # How long the conversation log holds lines before writing them.
    talkFlushMs: 2000

    # How many it holds if a flush never happens.
    talkHeld: 500

    # How long a balance change waits before it is written.
    belongingsWriteDelayMs: 2000

    # Vaults kept for one character. The shipped realm has seven banks; a file
    # past this is one being fed something that is not a bank name.
    maxVaults: 100

    # How long a discovery waits before it is written. A discovery happens
    # while somebody is walking, which is the one time this process must not
    # touch a disk.
    memoryWriteDelayMs: 2000

    # Observations one character keeps.
    memoryLimit: 2000

    # Rows in one realm's find log -- what searching has turned up, and where --
    # before the oldest is dropped. A find is one thing in one room, so this is
    # a count of places worth searching rather than of searches: a room searched
    # every lap is one row whose count climbs.
    findLimit: 2000

    # How long learned monster health waits before it is written.
    loreSaveDelayMs: 5000

    # Learned monsters per realm. The shipped realm names about 1,450 and
    # learning is only for the ones it does not, so a file past this is keyed
    # on something that is not a monster name.
    maxLearned: 4000

    # How long a walk's destination waits before it is written.
    destinationsSaveDelayMs: 5000

    # Destinations kept per realm. Generous: a row is one place somebody
    # deliberately walked to, so the list grows at the speed a person plays
    # rather than at the speed the server talks, and the whole point of it is
    # that somewhere visited months ago is still the answer to a search.
    maxDestinations: 500

    # Recent destinations offered above the realm's own answer.
    #
    # Five, because the list is a *shortcut* and not the search: past a handful
    # it stops being scannable at a glance and starts being a second set of
    # results to read, which is the thing it exists to save somebody from.
    destinationsShown: 5

    # How long a change to the player book waits before it is written.
    playersSaveDelayMs: 5000

    # Players per realm. Low deliberately: the registry rides on
    # `CharacterState`, which is structured-cloned to the window on every
    # status line.
    maxPlayers: 1000

    # How long a book that could not read its file waits before retrying.
    playersRetryMs: 30000

  # The realm knowledge base — conversion, routing and the local map.
  world:
    # Converted realms kept on disk. Editing a realm leaves the old conversion
    # behind, which makes going back free and was unbounded until this.
    keepRealms: 8

    # Ceiling on placed rooms, so a dense area cannot produce a vast grid.
    mapCells: 200

    # What a barrier the character cannot force costs to route through.
    #
    # Priced as a wall that can still be walked through when there is no other
    # way at all — never `null`, because refusing outright would hide the only
    # route there is.
    wallCost: 100000

    # What a room-script teleport costs over an ordinary step, so the router
    # prefers plain corridors unless the portal genuinely shortens the way —
    # usually across maps, which is what most of them are for.
    portalPenalty: 3

    # What a step along a route you saved costs, as a fraction of an ordinary
    # one. A route drawn on the loop builder and saved (`prefer: true` in its
    # file) is you saying *this is the way*: every step on it is priced at this
    # fraction, so the router follows it wherever it can and leaves it only for
    # a way shorter by more than the discount. A tenth means a saved route of a
    # hundred rooms still beats a shortcut of eleven. Zero makes it free; one
    # makes saving a route mean nothing.
    preferredStepCost: 0.1

    # What a lair expected to take half of your current health in one pass
    # costs to route through, in plain steps. A lair is priced by one pass
    # through it: its worst monster that attacks on sight, as many as the lair
    # holds at once, for the rounds spent inside (`passRounds`), as a share of
    # the health you have *now*. The step costs `dangerCost × share / (1 − share)`:
    # a tenth of the bar costs about two doors, a quarter about five, a half
    # this figure, and the price climbs without bound as a pass approaches the
    # whole bar — up to `deadlyShare`, where it is a wall. Two hundred is about
    # what resting half a bar back takes, in commands.
    dangerCost: 200

    # The share of current health one pass is expected to take at which a lair
    # is priced as a wall: walked only when there is no other way at all, never
    # preferred while there is. One is *expected to die there*.
    deadlyShare: 1

    # What one pass through a room whose spell this client cannot read is
    # priced at, as a share of the bar.
    #
    # A room's own spell is followed to its harm at build time, and 27 of the
    # shipped realm's room spells end in a verb this reader cannot evaluate.
    # Unknown is never the reassuring answer, and here the reassuring answer is
    # "walk through it for free" — which is what put a route down eighty-eight
    # rooms of the Silver River. Small on purpose. Zero restores the bug.
    unreadHazardShare: 0.02

    # The share of the bar a room's own spell has to take before the router
    # goes looking for a way round it.
    #
    # A second A* per route, so it is worth spending only where the answer
    # would change somebody's mind. A twentieth of the bar per room is nothing
    # on its own and a hundred rooms of it is the Silver River, so the
    # threshold is per room: at or above this is worth asking "is there another
    # way", and below it is weather.
    otherWayShare: 0.05

    # How many steps shorter the way with the right items has to be before it
    # is offered beside the plan. The river with a log raft against the slums
    # without one is 88 steps against 107 and worth a choice; a way two steps
    # shorter is the same way with a corner cut.
    alternativeMinSteps: 10

    # How many rounds of a lair's blows one pass through the room is priced at.
    # In and out is one round from whatever attacks on sight; two prices every
    # lair as if you stood a round longer in each.
    passRounds: 1

    # How many times nearer than every other row sharing its name a monster has
    # to spawn before the room is taken to have resolved which row it is.
    #
    # The wire carries a name and the realm holds several rows under it — a
    # `gnoll scout` is a 100-HP row and an 830-HP one — so the card folded them
    # and answered `100-830 hp`. Where the room's own lair names one, that is
    # the answer and this does not apply. Where it does not, nearest-wins on its
    # own would resolve a room one step nearer one row than the other, which is
    # evidence of nothing: monsters wander and are dragged. Eight means five
    # steps beats forty-one and does not beat thirty-nine.
    mobRowMargin: 8

    # How many rooms that search may reach before it gives the question up. It
    # stops on its own as soon as no room left could change the answer, so this
    # is only reached by a name whose rows all spawn a long way off — where the
    # honest answer is "this room says nothing".
    mobRowRooms: 20000

  # The process itself.
  app:
    # How long a quitting client waits for its last message to reach a pipe
    # nobody may be reading. The one thing worse than losing the message is not
    # exiting at all.
    exitDrainMs: 500

  # Watching the files the client owns.
  files:
    # One listing twice a second costs nothing.
    pollIntervalMs: 500

    # Collapses the burst of writes an editor emits into a single reload.
    debounceMs: 80

  # Serving the window over HTTP (MUDENGINE_WEB=1).
  web:
    # The largest message a browser tab may send on the socket. A settings
    # draft or a loop handed over whole is tens of kilobytes; anything near
    # this is not a call the window makes.
    maxMessageBytes: 1048576

    # How much may be queued for a tab that has stopped reading before it is
    # closed. The game stream keeps arriving whether or not a tab takes it.
    maxBufferedBytes: 8388608

    # How long a wrong password waits for its answer. A guess a second is what
    # the delay costs an attacker; nothing at all is what it costs somebody
    # who mistyped once.
    loginDelayMs: 1000

    # How often the client pings each tab. A proxy closes an idle socket and a
    # tab that vanished never says goodbye; a ping unanswered by the next one
    # is how either is found.
    pingIntervalMs: 20000

  # The window's own numbers.
  #
  # Read through `src/renderer/src/lib/tuning.ts`, which is fed the moment
  # this file reaches the window. A render that happened before it arrived ran
  # on these defaults, which is the correct fallback rather than a gap.
  view:
    # Diagnostics log kept in renderer memory.
    telnetLogLimit: 500

    # How often a browser tab that lost its socket tries the client again
    # before reloading itself. Web mode only.
    webReconnectMs: 1500

    # Framed lines kept for the Stream card.
    lineLogLimit: 200

    # Remembered conversation. Generous, because the point of keeping it is
    # that somebody can come back to what they missed.
    talkLimit: 500

    # How long the Talk card waits, after the reader's last scroll, before it
    # goes back to following the newest line. Scrolling up is a question being
    # asked of the backlog, and a log that yanks itself back down mid-sentence
    # answers it by taking it away; but a log that stops following for good
    # leaves the card frozen on a conversation from five minutes ago, which is
    # the failure it exists to prevent. Measured from the last scroll, so
    # reading up through a backlog keeps extending it; landing back at the
    # live edge resumes at once and does not wait.
    talkFollowResumeMs: 15000

    # Lines the Talk composer remembers for its Up arrow. A short list on
    # purpose: this is the shell's history, not the card's backlog — what it is
    # for is saying the same thing again, or fixing a typo in what was just
    # said, and nobody arrows back forty lines to do either.
    talkHistoryLimit: 40

    # Remembered notices. Same reasoning, same generosity.
    noticeLimit: 400

    # The least time between two desktop notifications of the same kind about
    # the same character. Without it the client raises one per flush that
    # carries a new alert, and being attacked is a fresh line several times a
    # round -- an evening away would leave hundreds of them. Per kind, so a
    # floor on being attacked cannot swallow the notice that the character
    # then died.
    desktopAlertGapMs: 60000

    # The most panes worth having; see docs/profiles.md §7.3.
    maxPanes: 4

    # Minimum gap between chrome state flushes in a window. Pushed facts queue
    # and paint together at most this often, so a busy realm cannot make the
    # cards re-render per line. The console itself never waits on this.
    chromeFlushMs: 100

    # Rows the debug window keeps on screen.
    #
    # Its own key rather than main's session.debugLogLimit, because the two
    # bound different costs: main's ring is memory behind a bug report, and this
    # is DOM in a window that is scrolled through. Wanting a deeper report is
    # not the same as asking the window to hold more rows, and the window is the
    # half that gets slow first.
    debugRows: 4000

    # Characters per second above which the window is under pressure.
    streamHighWater: 1500

    # Consecutive high samples before quieting the chrome. The entry used to
    # have no hysteresis at all, so one sample over the line dimmed the whole
    # window -- and at a 250ms sample that is 375 characters, which is a single
    # combat round with its colour codes. The chrome pulsed once per round for
    # as long as you were fighting. Four samples is one second of sustained
    # pressure; a burst shorter than that has finished painting anyway.
    streamHighSamples: 4

    # Consecutive calm samples before relaxing, so it cannot flicker.
    streamCalmSamples: 8

    streamSampleMs: 250

    # Long enough that typing a sentence is one save, short enough that
    # somebody who stops to think has been saved by the time they look up.
    autoSaveDelayMs: 700

    # How far an undo will go back. Bounded so a long session cannot grow.
    historyDepth: 50

    # Below this height the rail cannot show three cards comfortably.
    compactHeight: 820

    compactWidth: 1180

    # How old a sighting of what a party member is fighting may be.
    fightingFreshMs: 60000

    # Where a monster's bar turns from green to amber to red.
    #
    # **Not chosen, and changing them makes the client contradict itself.**
    # These are the server's own wound bands (`src/shared/wounds.ts`)
    # collapsed to three, so the colour and the word under it can never
    # disagree. They are here because everything is; they are the two numbers
    # in this block least likely to be worth moving.
    woundCaution: 0.7

    woundCritical: 0.3

    # The width below which the console stops being a character grid.
    #
    # **Not a preference either.** The game lays out maps and stat columns by
    # counting characters and the server repaints its status line with a
    # literal `CSI 79 D`; there is no width this client can report that
    # changes what it sends.
    minColumns: 80

    # Advance widths differing by more than this fraction count as uneven.
    fontTolerance: 0.02

    # The longest name the console will try to recognise, in words. Eight,
    # counted against the shipped realm's room table rather than chosen: 396
    # of its 55,806 names are six words or more.
    maxNameWords: 8

    # How far the pointer must travel before a press becomes a drag. Not zero:
    # a card header carries a close button, and a press that dragged
    # immediately would make it unclickable for anyone whose hand is not
    # perfectly still.
    dragSlop: 5

    # Between a popover and its anchor, and between a popover and the edge.
    popoverGap: 8

    popoverMargin: 8

    # How wide a slide-out panel is allowed to be, and how small it may be
    # dragged.
    #
    # It was a flat 300px in the stylesheet, and a panel that narrow turns a
    # monster's "0 hp a round against you" into a column one word wide and
    # twenty lines tall -- the panel then scrolls, so the answer you asked for
    # is below the fold on a screen with room for it three times over. The
    # width is chosen from the room actually beside the name that was clicked,
    # between these two: the floor is what the readout's two columns need to
    # read as columns, and the ceiling is where a line stops being comfortable
    # to read and starts being a paragraph the eye has to track back across.
    popoverWidthMin: 300

    popoverWidthMax: 560

    # The smallest a panel may be dragged to and still be worth reading.
    popoverMinHeight: 120

    # How close a popup menu may come to the edge of the window.
    menuMargin: 4

    # Room radius on the map, and the margin that keeps one in the viewBox.
    mapRoomRadius: 3

    # How far out the local map walks, as the bounds a *measured* radius is
    # clamped into.
    #
    # The view asks for the radius its window can show -- what it reaches from
    # the centre room at its zoom and pan, measured from the laid-out box --
    # rather than always asking for five, which is what it did until
    # 2026-08-31: a map dragged twice as tall drew the same six rooms twice as
    # large, because the viewBox scaled the picture and nothing ever fetched
    # more of it.
    #
    # The floor is what a rail card can show and the ceiling is what stops a
    # full-screen float walking the whole realm -- the search is exponential in
    # the radius, and `world.mapCells` alone bounds the result, not the work.
    # The ceiling is also where the wheel stops zooming out: a window wider
    # than the widest fetch would show blank space around it.
    mapRadiusMin: 2
    mapRadiusMax: 12

    # How many pixels one room's cell wants, at each end of the Map card's
    # density slider -- sparse first, dense second. The legibility budget: how
    # small a room may be drawn and still be a thing somebody can point at.
    #
    # There was one figure, 34, until 2026-09-02, and it decided for the player
    # how much of the realm a map showed. The ends are chosen so a rail-sized
    # card (about 200px on the short side) spans 5x5 rooms at the sparse end
    # and 20x20 at the dense one; the middle lands at 25, close to the single
    # figure it replaces. A float is bigger and shows more at every setting.
    # `mapRadiusMin` went 3 -> 2 with them: 5x5 is a radius of two, and the old
    # floor would have quietly refused the sparse end.
    mapRoomPixelsSparse: 40
    mapRoomPixelsDense: 10

    # How much one notch of the wheel zooms a map, as a percentage of the
    # room's size -- in towards the reader, out away -- about the point under
    # the pointer, between the two ends above.
    mapZoomStepPercent: 25

    # How many colours the way on a map may use before it stops changing. A lap
    # that comes back the way it went draws one line over another, so the way
    # changes colour each time it starts doubling back over ground it has
    # already covered. Capped because the point is to tell a few passes apart:
    # past three the map is a colour chart. Bands beyond the cap all draw in
    # the last colour, which still says "covered before".
    mapTrailBands: 3

    # How long after the last notch the Map card writes its zoom into its own
    # settings, where the density slider reads it. One write once the hand has
    # stopped, rather than one per wheel event.
    mapZoomSettleMs: 400

    # How often a card redraws a running clock — the uptime readout, and how
    # long a loop has been going. A second, because that is the unit shown.
    clockTickMs: 1000

    # How long a room search waits after the last keystroke, and the shortest
    # query worth running.
    #
    # The realm has 55,806 rooms and a two-letter query matches a lot of them.
    # Shared by the route panel's own field and by the palette, which searches
    # the same index — two debounces that drifted would be two surfaces
    # answering the same typing at different speeds.
    roomSearchDebounceMs: 150

    roomSearchMinChars: 2

    # How long a pointer rests on a room before its quick view opens, and how
    # long the panel stays after the pointer has left both it and the room.
    #
    # The dwell exists so sweeping across the map does not open two hundred
    # panels; the linger exists because the panel is a thing to read, and a
    # card that vanished while the hand was travelling the twenty pixels
    # towards it would be unreachable by pointer. A click settles it, and
    # neither number applies to a settled panel.
    roomPeekDelayMs: 250

    roomPeekLingerMs: 220

    # How far the Hunting card looks from where the character stands, in
    # steps, at its usual reach; near is half and far is double.
    huntRadiusSteps: 80

    # The server's own combat pulse, in milliseconds. Damage per round is the
    # one figure that needs a length for a round, and the stream carries blows
    # rather than ticks. Five seconds is what MegaMUD's own status bar counted
    # down; a derivative that pulses differently is a number to change here.
    combatRoundMs: 5000

    # How long a scope must have run before the Combat Stats card claims a rate
    # for it. The rates divide a total by the scope's own clock, which is
    # answerable from the first millisecond and absurd there -- 66 experience
    # 300ms in reads as 792,000/hr, and "Will level in" as nine seconds. A
    # Deliberately short: the complaint these rates were fixed for was a dash
    # where a figure was wanted, at forty seconds elapsed, so a longer floor
    # would put that dash back for the first minute of every session.
    rateFloorMs: 5000
