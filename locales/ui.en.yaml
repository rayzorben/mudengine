  # Running a quest's plan -- `automation.quests` (todo 102). One switch,
  # and the warning in the open: a run walks, buys, hunts and fights unattended.
  quests:
    legend: Quests
    warning:
      A run walks across the realm, buys, hunts and fights for as long as the chain takes, and
      stops only for what stops a route. Turn it on for a character you mean to leave to it.
    enabled: Auto-Quest
    enabledHint:
      Lets the Quest card's Run it carry a plan step by step, through the walker, the shopping
      errand and auto-combat. Off, the press refuses and names this switch.
  talk:
    legend: Other Players
    lookHint:
      Once per person, on an idle moment rather than the instant they arrive, and never during a
      fight. What they wear shows on their Worn tab with the time it was read.
    lookLabel: Auto-Inspect Players
    lookWarning: A look is a command from the same budget walking and fighting spend from, and
      the server tells the person they were looked at.
  worldDatabaseHint:
