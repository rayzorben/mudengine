    maxMonsterExpLabel: Max Monster Exp
    minMobsLabel: Min Monsters in Room
    minMobsHint: Will not start a fight in a room with fewer monsters than this, for a character who
      relies on an area spell. 0 is off.
    maxTargetHealthHint: Will not attack anything with more health than this, according to the world
      data. 0 is off, and monsters missing from the world data are not skipped.
    maxTargetHealthLabel: Max Target Health
    engageAll: Attack All Monsters
    engageHint: Goes by what the world data says about a monster, never its name. A monster it calls
      good is only attacked if listed below.
    engageHostile: Hostile / Aggressive Only
    engageLabel: Attack Target Selection
    engageLikely: Suspected Hostiles Only
    engageNone: Retaliate Only
    hitBack: Retaliate When Attacked
    hitBackHint: Attacks whatever is already attacking this character. Never starts a fight.
    defendAfterRounds: Defend After Rounds
    defendAfterRoundsHint: With auto-combat off, how many rounds of being hit without moving before
      auto-combat turns on, until you next enter another room. 0 never does.
    politeAttacks: Polite Attacks
    politeAttacksHint: MegaMUD's Polite Attacks. When on, a monster that someone outside your party
      is already fighting is left to them, and the Automation card says whose it was. Fighting back
      is unaffected.
    masterSwitch: Enable Auto-Combat
    masterSwitchHint: The master switch. With this off, nothing below sends anything.
    maxMobsHint: Will not start a fight in a room with more monsters than this. 0 is no limit.
    maxMobsLabel: Max Monsters in Room
    monstersLegend: Monsters
    openerHint: Sent only for the first attack of a fight. Blank for none.
    openerLabel: Opening Attack
    openerPlaceholder: bs
    hideForOpener: Hide Between Fights
    hideForOpenerHint: Sends hide when this character is in an empty room, or sneak during a loop or
      route, so your opening backstab works again. Only used when the opener is bs.
    openingFightsWarning: Starting fights on its own can get a character killed; the default only
      fights back.
    openWarning: With this on, the client starts fights by itself, but never with a player.
    refreshHint: Rounds between looks, to notice a monster that died or walked in. 0 never looks.
    refreshLabel: Room Look Interval (Rounds)
    rulesPointerNote: When to cast, bless and loot are set in automation.rules in the options file,
      as rules with comments explaining them. YAML handles that better than this screen.
