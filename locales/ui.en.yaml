      captureLabel: Record Raw Transcript
      conversationDaysHint: Anything older is deleted when the client starts. The default is one
        year and the minimum is one day. To keep nothing, turn off the switch above.
      conversationDaysLabel: Keep Conversations, Days
      conversationsHint: The Talk card picks up where it left off instead of starting empty. Only
        chat channels are kept, so the file never holds a password.
      conversationsLabel: Persist Conversations
      enabled: Keep Session Log
      fightsHint: Nothing reads it yet. It exists so that any later question about how a character
        fights has a record to answer from.
      fightsLabel: Write Fight Log
      folderLabel: Folder
      folderPlaceholder: beside the options file
      maxBytesLabel: New Log After, Bytes
