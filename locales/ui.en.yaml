      any: Anyone
      evil: Evil
      good: Good
      neutral: Neutral
    source:
      # The three acts a script hands a thing over for. The verb, the place
      # word and the words to say are drawn apart from the names because a
      # name is a lookup control and a room is a walk, and `kill` and `in` are
      # neither. An ask names no place: the asker is the place.
      askVerb: ask
      forWord: for {word}
      inWord: in
