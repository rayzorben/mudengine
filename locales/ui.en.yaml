        reverse-step strategy is now step-back. There is no flee command on this server family —
        the client sent it eleven times in one fight on 2 September 2026 and every one came back
        "Your command had no effect." The escape sends a direction now: the way you came where that
        is known, an exit of the room otherwise, and nothing at all rather than a word that does
        nothing. Your threshold and your switch are unchanged. {fileList}'
      one: 'Running away was renamed from flee to retreat in {count} file, and any flee or
