        every command this client can answer, written out by name; a gang that was trusted keeps
        the same list. Edit either from the Gang card or by clicking a name. {fileList}'
      partyGroundDropped:
        'The "party" ground is gone and was not carried across: a party is a group anybody can
        invite anybody into, so it was a permission anybody could grant themselves. Name the people
