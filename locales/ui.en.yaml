    idPlaceholder: thorn
    manageRealms: Manage realms…
    namePlaceholder: Thorn the Unready
    passwordHint:
      Kept in this character’s own file, and never shown back. The realm’s login steps send it
      where they say {password}, which is how a realm that words its prompt differently is
      answered at all.
