  health:
    belowHealthLabel: Below Health %
    belowManaLabel: Below Mana %
    belowManaHint: Also run below this share of mana (MegaMUD's ManaRun%). A caster out of mana is
      losing, whatever their health. 0 never runs for mana.
    retreatHint: 'Walking out of the fight ends combat without the penalty a disconnect carries.
      This server family has no flee command, so running always means moving in a direction: the way
      you came in if known, otherwise an exit of this room. It only runs while something is moving
      the character (a route, a loop, an errand, a quest run); once a route has arrived, the
      character stays put.'
    retreatLabel: Auto-Run
    retreatLegend: Auto-Run
    retreatStrategyHint: 'How far to run. step-back moves one room. safe-haven makes the same move,
      then walks to the room below once the fight is over. The exit is not a setting: the way you
      came is always preferred over one never used.'
    retreatStrategyLabel: Where to Run
    safeHavenHint: Named the same way as a loop stop, with the map/room number so a shared name is
      not guessed.
    safeHavenLabel: Safe Room
    safeHavenPlaceholder: Newhaven, Town Gates 1/2150
    fleeGotoLabel: Auto-Teleport
    fleeGotoHint: "After Auto-Run: the realm's own teleport, sent mid-fight once running has had its
      chance. On GreaterMUD, sys is a sysop command; a player is told it had no effect, and it is
      not sent again that session."
    fleeGotoCommandLabel: Teleport Command
    fleeGotoCommandHint: Sent exactly as written. Blank uses the realm's own.
    fleeGotoRealmHint: This realm's teleport, sent exactly as written, such as GreaterMUD sys go 1
      297 or MajorMUD sys goto silvermere. Blank means none; a character can set its own.
    fleeGotoCommandPlaceholder: sys go 1 297
    hangPenaltiesHint: Whether this realm penalizes a hangup. Paradigm's realm menu reports this
      itself, and that takes priority.
    hangPenaltiesLabel: Hang Penalties
    hangPenaltiesGlobal: As Global says
    hangPenaltiesRealm: As the realm says
    hangPenaltiesYes: Charged
    hangPenaltiesNo: Not charged
    hangUpLabel: Auto-Hangup / Emergency Disconnect
    hangUpLegend: Auto-Hangup
    hangUpOnPlayer: Hang Up When a Player Is Seen
    hangUpWarning: On a realm with hang penalties, a disconnect costs part of your maximum health,
      and at low health it kills. Use Auto-Run instead.
    meditateBelowHint: Sends med below this. Ignored for a class with no mana.
    meditateBelowLabel: Meditate If Below Mana %
    outnumberedHint: A health threshold notices being swarmed too late. 0 is off.
    outnumberedLabel: Run If Attackers Exceed
    pvpActionHint: What to do about the fight itself. Running happens as soon as the attack is seen,
      whatever Auto-Run says, because a player attacking you is not a health threshold.
    pvpActionLabel: PvP Reaction
    pvpLegend: Attacked by a Player
    pvpNotifyHint: Announces it on the gangpath (bg), once per attacker every five minutes, with the
      room and your health. Your whole gang sees it.
    pvpNotifyLabel: Broadcast PvP Alert to Gang (bg)
    # The player's own *use this when that* list (todo 19), and since todo 00
    # the only one. The name field is filtered by the condition from the
    # realm's own data, so a rule for poison offers the antidotes and not the
    # healing potions.
    potionRuleLegend: When to use an item
    useWards: Follow the game's own item rules too
    useWardsHint: The game has rules like these of its own; this decides whether to follow them.
      When the game says a spell blocks a room's effect and using a carried item casts that spell,
      the item is used before stepping into such a room, and again whenever the spell wears off
      while you are in one. Each use costs a charge and a round. This realm's rules are listed
      below.
    wardRow:
      one: against {hazard}, cast in {rooms} room
      many: against {hazard}, cast in {rooms} rooms
    potionRuleNote: Name an item and when to use it. The list shows what the world data says helps
      with the condition. You can type anything else, but only an item in your inventory is ever
      used.
    potionRuleAdd: Add a rule
    potionRuleNamePlaceholder: item, as your inventory lists it
    potionRuleNameAria: 'Item for rule {number}'
    potionRuleWhenAria: 'When rule {number} fires'
    potionRuleBelow: below
    potionRuleBelowAria: 'Threshold for rule {number}, as a percentage'
    potionRuleVerbAria: 'Verb for rule {number}'
    potionRuleRemoveAria: 'Remove rule {number}'
    potionRuleRemoveTitle: Remove this rule
    potionRuleDuplicate: An earlier rule already uses this item for this condition and threshold.
    potionWhenHp: health below
    potionWhenMana: mana below
    potionWhenPoisoned: poisoned
    potionWhenBlind: blinded
    potionWhenDiseased: diseased
    potionWhenHeld: held
    recoverLegend: Recover
    restBelowHint: Rests out of combat below this, and pauses a running loop at the same point. 0
      never rests or pauses a loop.
    restBelowLabel: Rest If Below HP %
    restToHint: Sits back down after something interrupts the rest, and resumes a paused loop, once
      health reaches this. Casting interrupts a rest and standing regenerates six times slower, so
      this lets you rest, heal, rest, heal. 0 rests once and resumes at the lower threshold. Raised
      to Rest If Below if it is lower.
    restToLabel: Keep Resting To HP %
    restBeforeTrapsHint: Before walking into a trap, waits until health covers the trap's damage and
      still leaves this share of your maximum, or what the lair beyond is expected to cost, if more.
      This is its own switch, so it rests before a trap even with Rest If Below at 0. 0 walks into
      any trap at any health.
    restBeforeTrapsLabel: Keep After a Trap HP %
    restNextDoor: Rest Next Door to a Lair
    restNextDoorHint: A room that spawns monsters on a short regen time is not a place to rest. The
      character looks into a neighboring room with no lair, steps in only if it is empty, rests, and
      steps back.
    restingNote: One pair of settings for both, because nothing rests while a loop is moving. A
      separate, lower pause setting kept the character walking while too hurt to rest. Resting lasts
      until you move, attack or cast, so nothing is sent while the status line already shows
      (Resting), and no command is spent standing up, because your next command does that anyway.
