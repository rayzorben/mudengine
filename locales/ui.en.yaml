      fight. What they wear shows on their Worn tab with the time it was read.
    lookLabel: Auto-Inspect Players
    lookWarning: A look is a command from the same budget walking and fighting spend from, and
      the server tells the person they were looked at.
  worldDatabaseHint: Blank for the bundled world; point at your own .mdb or SQLite copy for a realm
