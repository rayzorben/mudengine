        waiting for the game to answer, with one forced prompt in between. A step is given up after
        about twice this.'
      stepTimeoutLabel: Wait Per Step, ms
      minExpRateHint: Stops a running loop whose exp/hr has dropped below this, once it has run for
        15 minutes. A loop that has stopped paying looks the same as one that works until someone
        checks. 0 never stops.
      minExpRateLabel: Stop Loop Under Exp/Hr
    realm:
      hostPlaceholder: paramud.mudinfo.net
      loginMenuSendPlaceholder: '1'
      loginMenusNote: When the game shows the text on the left, the client sends the text on the
        right. {user} and {password} stand for the character's own. A new realm starts with these,
        and each realm keeps its own copy on its page afterwards.
      noteBeforeCharacter: Until you have made a character, this is also the address the client connects to.
    saved: Settings saved.
    startingValuesNote: Starting values. A new realm or character copies these when you create it
      and keeps its own copy afterwards, so changing them here only affects new ones.
    tabs:
