    whyHitBackGuard: 'hitting back: {target} protects {ward}, so it goes first'
    whyInRoom: in the room
    whyStillOn: 'still on {target}: one target at a time, until it is dead'
    whyRanked: 'first of {count} here: your priority list ranks {target} {band}'
    whyRankedAlone: 'your priority list ranks {target} {band}'
    whyRankedOver: 'first of {count} here: your priority list ranks {other} {band}'
    whyMostDangerous: 'the most dangerous of {count} here ({perRound} hp a round against you, {costs}{hazards})'
    costByHealth: '{hp} hp'
    costBound: 'up to {rounds} rounds and {cost} hp to kill'
    costEstimate: 'about {rounds} rounds and {cost} hp to kill'
