  realm:
    commandUnavailable: This realm has no "{command}" command, so it was said out loud in the room
      instead of answered. Automation will not send it here again.
    familyDisagrees: This server is {server}, but the world data in {source} is {data}. Both are
      kept, and nothing that depends on one family's formulas is calculated from the other's.
    worldDisagrees: This realm says it is {realm}, but this session loaded the {world} world. Reopen
      this character's tab to use the {realm} world, or set one on the realm's settings page.
    left: Left the realm. Everything known about this character is cleared; entering again reads it
      fresh.
  stats:
    asked: you asked to train stats
    screen: the stat screen is up
    held: 'Automation is paused and its queue cleared: the stat screen has the keyboard, and
      anything sent now would be typed into one of its fields. Your own typing still goes through.'
    released: Back at a prompt; automation is running again.
  remotes:
    peerPlaced: '{who} is in {room} ({address}).'
    peerPlacedUnnamed: a room they did not name
    comebackWalking: '{who} asked this character to come to {address}; walking {stepCount} steps.'
    comebackRefused: '{who} asked this character to come to them, and the route was refused:
      {reason}'
  statline:
    exact: The game reports the status line as {statline}; every prompt is read by it exactly.
    full: The game reports the status line as full; the prompt is read by the usual pattern.
    loose: The game reports the status line as {statline}, which this client cannot build a pattern
      from; the prompt is read by the usual pattern.
    verified: The prompt matches the status line the game reported.
    mismatch: The prompt no longer matches the status line the game reported. Reading it by the
      usual pattern and sending pro again.
    tooWide: The status line you designed is {cells} cells wide and the line holds {max}, so the
      game's own line is shown instead. Shorten it in the Status Line section of settings.
  walk:
    keptOutDemand: crossing {word}, which you avoid
    keptOutChoose: This way crosses {wordList}, which you avoid. Choose the way through or the way
      around in the route panel.
    claimLapsed: Nothing answered "{command}" in {seconds}s, so the client stopped waiting and is
      treating the room on screen as where you are. Running away, walking a route and walking a loop
      all wait for a step, so they were held until now.
    claimLapsedUntyped: Nothing answered the last move in {seconds}s, so the client stopped waiting
      and is treating the room on screen as where you are. Running away, walking a route and walking
      a loop all wait for a step, so they were held until now.
    claimProbed: 'Nothing has answered "{command}" in {seconds}s. Asking the game where you are: if
      that is answered first, the step is not coming; if not, the game is just slow and the step
      waits.'
    claimProbedUntyped: 'Nothing has answered the last move in {seconds}s. Asking the game where you
      are: if that is answered first, the move is not coming; if not, the game is just slow and the
      move waits.'
    claimSettledByLocate: The game answered a later question before "{command}", so that step is not
      coming. Treating the room the game named as where you are.
    probeReason: a step went unanswered; asking where you are tells a slow game from a lost step
    readSettledByLocate: The game answered a later question before "{command}", so that re-read is
      not coming. Nothing was held up by it.
    exitBackOpen: The room lists {direction} again, so routes will use it once more.
    exitRefused: The world data says there is an exit {direction}, but the game refuses it; routes
      will avoid it.
    exitShut: The way {direction} is closed, not missing; routes will avoid it until the room lists
      it again.
    readLapsed: Nothing answered "{command}" in {seconds}s, so the client stopped waiting for it. It
      was a re-read, not a step, so nothing was held up.
    readLapsedUntyped: Nothing answered the last re-read in {seconds}s, so the client stopped
      waiting for it. Nothing was held up.
    readLapsedSeveral: Nothing answered the last {count} re-reads in {seconds}s, so the client
      stopped waiting for them. Nothing was held up.
    stoppedByPlayer: you asked it to
    stoppedConnectionClosed: the connection closed
    stoppedLeftRealm: you left the realm
    resumed: Back in the realm; resuming the walk to {destination} from here.
    notResumed: 'Not walking on to {destination}: {reason}'
    replanned: 'That route started in a room you have since left, so it was re-planned from here:
      {steps} steps to {destination}.'
  world:
    realmMismatch: The game says you are in room {map},{room}, which the loaded world data does not
      have. This character's world.database may not match this realm, so routes will fail from here.
# What the automations say: loops, login, peers, hang-up.
automation:
  # Going and getting what a route needs -- `ItemErrand` (todo 07). The route
  # says what the door wants; the realm says where it comes from.
  collect:
    abandoned: 'Gave up collecting {item}: {why}'
    becauseDoor: 'the way needs {item}'
    buying: Going to buy {item} at {shop} in {room} first, {detour} steps off the way.
    buyingOnTheWay: 'Going to buy {item} at {shop} in {room} first; the way there goes past it.'
    gotAndKept: '{item} is in your inventory and on the keep list, so it stays.'
    gotForTheDoor: '{item} is in your inventory: picked up for this door, not kept.'
    hunting: 'Looking for {item}: {mob} drops it, starting at {room}, {steps} steps away.'
    huntingHere: 'Looking for {item}: {mob} drops it, starting here in {room}.'
    huntingNextDoor: 'Looking for {item}: {mob} drops it, starting next door in {room}.'
    loopName: 'Collect: {item}'
    refusalBusy: Something is already being collected.
    replacingLap: Stopping {loopName} to go and get it; it will not restart on its own.
    refusalLapStopped: The hunt for {item} stopped before you had one.
    refusalNoSource: The world data names nowhere this comes from.
    refusalDropperUnplaced: Dropped only by {mobs}, which the game summons instead of placing
      anywhere.
    refusalDropperUnreachable: Dropped only by {mobs}, which the world data places nowhere this
      character can reach from here.
    refusalNotBought: '{item} was not bought, so the route is not being walked.'
    refusalNotInRealm: This character is not in the realm.
    refusalRouteRefused: 'The way is open now, but the route did not start: {why}'
    several: This way needs {items}; getting each in turn before walking it.
    asking: 'Going to {room}, {steps} steps away, to say "{say}" for {item}.'
    askingHere: 'Saying "{say}" here in {room} for {item}.'
    reasonSay: 'collecting: {command}'
    reasonPackAfter: 'collecting: was the item handed over?'
    refusalNotReached: 'Not collecting: the walk to {room} ended somewhere else.'
    refusalAskedNothing: Said "{say}", but no {item} came of it; the way that needed it is not being
      walked.
    refusalPackUnread: Checked inventory after the handover and got no answer, so it is not known
      whether the item arrived.
    # The pack listed again and again after the phrase (todo 814), never with the item.
    refusalHandoverUnlisted: Said "{say}", and for {seconds}s after it your inventory never showed
      {item}. A handover can set a quest flag instead of giving an item; the way that needed it is
      not being walked.
    refusalUnsent: 'Could not say "{say}": it was never sent, so the way that needed it is not being
      walked.'
    summonedBy: '{mob}, summoned when {summoner} dies'
    stoppedGotIt: you have {item}
    whyLeftRealm: the realm was left
  # Keeping a room's ward up off a carried item -- `Wards` (todo 105).
  wards:
    reason: 'using {item} for {spell} against {hazard}'
    using: 'Using {item} for {spell}: the rooms ahead cast {hazard}, and nothing you carry blocks
      it.'
    nothingCarried: The rooms ahead cast {hazard}, which {spells} would block, and you carry nothing
      that casts one of them.
    lentForRun: 'Using wards for the quest run: the plan bought them to be used, even though "Follow
      the game''s own item rules" is off in settings.'
    returnedAfterRun: The quest run is over; wards are off again, as your settings say.
    lendEnded: '"Follow the game''s own item rules" was turned off, so the quest run continues
      without wards.'
  # Running a quest's plan -- `QuestRunner` (todos 102-103). Every sentence
  # names the step it is about, and every refusal says what stopped it.
  quests:
    because: 'running {quest} to rank {to}'
    becausePressed: the Quest card's Run it was pressed
    started: 'Running {quest} to rank {to}: {count} steps.'
    finished: '{quest} reached rank {to}. The run is done.'
    refused: 'Quest run stopped: {why}'
    abandoned: 'Quest run stopped: {why}'
    going: 'Step {nth}: walking to {room} ({steps} steps).'
    buying: 'Step {nth}: buying {item} ×{count} at {shop}, {room}.'
    hunting: 'Step {nth}: hunting {mob} for {item}.'
    handover: 'Step {nth}: getting {item} — {command}.'
    asking: 'Step {nth}: {command}.'
    askingAgain: 'Step {nth}: {command} again — try {tries} of {max}; the roll did not pass.'
    stepDone: 'Step {nth} done: {quest} is at rank {rank}.'
    stepAssumed: Step {nth} sent. This realm shows no quest counter and the step takes and gives
      nothing, so it is assumed done.
    reasonPack: checking inventory for the quest run
    reasonAbil: 'reading the quest counter after the act'
    reasonAct: 'quest step {nth}'
    reasonHandover: 'asking for {item} for the quest'
    reasonPackAfter: checking inventory after the quest step
    detailFetching: 'getting {item}'
    detailWalking: 'walking to {room}'
    detailKilling: 'fighting {mob}'
    detailWaitingFor: 'at {who}'
    detailConfirming: reading the counter
    whyReset: the connection was reset
    whyLeftRealm: the realm was left
    whyPlayerMoved: you moved the character yourself
    whyStopped: you asked it to
    whySwitchedOff: Auto-Quest was switched off
    whyWalkStopped: the walk stopped
    whyErrandEnded: the shopping errand ended without it
    whyNothingMoved: nothing happened for long enough that something is stuck
    whyLegStalled: the walk to the next step stood still
    heldUp: 'Held up: {why}. Trying again in {seconds}s (setback {tries} of {max}).'
    stockingUp: Stocking up on {item} before step {nth}; this leg passes closest to the shop.
    stockUnfilled: 'Continuing without {item}: the shop had none, and the quest does not need one.'
    refusalGaveUp: '{why}, and that is {tries} setbacks in a row with no progress'
    refusalSwitchedOff: 'Auto-Quest is off. Turn it on under Quests in the settings, then press Run it again.'
    refusalBusy: A quest is already being run.
    refusalNotInRealm: This character is not in the realm.
    refusalNothing: The plan has no steps to run.
    refusalUnplaced: This character's location is unknown, so nothing can be walked.
    refusalWalking: A route is being walked; stop it first.
    refusalEscaping: The character is running away.
    refusalNoPlan: There is no plan for this step.
    refusalUnknownStep: 'No quest holds step {block}.'
    refusalPackUnread: Inventory was requested and nothing answered.
    refusalItemGone: Step {nth} needs {item}, which the plan said you had, but you do not.
