  realms:
    confirmRemove: Remove this realm?
    databaseBrowse: Browse…
    databaseClear: Clear
    empty: Choose a realm, or add one.
    loginLegend: Login Menus
    loginNote:
      When the realm prints the text on the left, the client sends what is on the right. Leave
      the answer blank to send a bare Enter, which several menus want. Write {user} or {password}
      to send this character's own — realms word those two prompts differently, so they are rows
      here like any other, and the account itself stays on the character's page.
    loopsNote:
      Every character that plays here can walk these, without being told to. A character may
      add loops of its own on its own page.
    mobRuleNote:
      Every character that plays here follows these, under any row of its own. A monster set to
      Never Attack is left alone; where one of the others is in the room the band decides
      outright and the usual weighing is skipped.
    nameHint: What your characters call this realm. Renaming it moves every character that plays here.
    nameLabel: Name
    namePlaceholder: Paradigm Game 1 PVE
    new: + New realm
    removed: Realm removed.
    saved: '{realmName} saved.'
    stepSendPlaceholder: '1'
    stepWhenPlaceholder: Please select a realm
    submit: Add realm
  gear:
    legend: Equipment Sets
    note:
      A set names only the slots it cares about. What the character has on is the "always" set with
      whichever other set applies laid over it — so "Moving" is one line about boots rather than a
      second copy of the whole kit.
    enabled: Swap kit to suit
    enabledHint:
      With this on, the sets below are put on and taken off as the situation changes — walking,
      fighting, or fighting one named monster. The off-hand comes off before a two-handed weapon
      goes on, and the weapon hand is sent first, so coming back the other way frees the hand
      before the shield is asked for.
    setAdd: Add a set
    setNamePlaceholder: What to call it
    setNameAria: Set {number} name
    setWhenAria: When set {number} applies
    setMobPlaceholder: Any monster
    setMobAria: Set {number} monster
    setRemoveTitle: Remove this set
    setRemoveAria: Remove set {number}
    setShadowed: An earlier set already claims this situation, so this one never applies.
    itemAdd: Add an item
    itemPlaceholder: The item, as the pack lists it
    itemAria: Set {number}, item {item}
    itemRemoveTitle: Remove this item
    itemRemoveAria: Remove item {item} from set {number}
    whenAlways: always
    whenMoving: while moving
    whenFighting: while fighting
    offRoundLegend: Between rounds
    offRoundNote:
      Using an item on what is being fought, between swings. The server will not use a weapon that
      is not in hand, so a two-handed one costs six commands a round — off-hand off, weapon on,
      use, weapon back, off-hand back — against a window of three. 0 rounds never uses it.
    offRoundItem: Item to use
    offRoundItemHint:
      The item, as the pack lists it. It is put in hand, used on whatever is being fought, and the
      kit put back afterwards.
    offRoundEvery: Every (rounds)
    offRoundEveryHint:
      At most one use this many rounds. 0 never uses it. Every use is a round this character is not
      swinging in, so a low figure on a long fight is a fight fought with fewer blows.
  sections:
    character: Character
    login: Login
  nav:
    character: Which character
    label: Settings sections
    realm: Which realm
  spells:
    addBlessing: Add a blessing
    blessingDownAria: Move blessing {number} down
    blessingDuplicate:
      An earlier row already casts this spell at this target — only that one is kept when this
      saves.
    blessingDownTitle: Lower priority
    blessingFallback: Recast After, s
    blessingFallbackAria: Blessing {number} fallback seconds
    blessingInCombat: In Combat
    blessingMinMana: Not Below Mana %
    blessingMinManaAria: Blessing {number} mana floor %
    blessingOverHeal: Before Healing
    blessingSpellAria: Blessing {number} spell
    blessingTargetAria: Blessing {number} target
    blessingTargetParty: Party
    blessingTargetSelf: Self
    blessingUpAria: Move blessing {number} up
    blessingUpTitle: Higher priority
    blessingsLegend: Auto-Buff / Blessings
    blessingsNote:
      Spells the client keeps active for you. When the game says one has worn off, it is cast
      again straight away. The top of the list is cast first, and blessings on yourself always
      come before ones on the party. A blessing on a party member recasts on its own timer,
      because its wear-off shows on their screen, not yours.
    notifyWearOffLabel: Notify Caster on Buff Wear-Off
    autoBlessLabel: Auto-Bless
    autoBlessHint:
      Cast the blessings below unasked. Off keeps the mana for healing through a fight without
      emptying the list; the toolbar has the same switch.
    invokeItemsLabel: Bless from an item
    invokeItemsHint:
      Ask a carried item for the blessing it casts, when that blessing is not up. Only items the
      realm says can be used without limit — nine weapons in the shipped realm bless this way,
      for no mana and no charge. An item with a fixed number of charges is left alone.
    notifyWearOffHint:
      When a party member's blessing on this character wears off, telepath them @bless-expired so
      their client recasts at once instead of on its clock. Both ends must run mudengine.
    cureBlindnessLabel: Cure Blindness Spell
    cureDiseaseLabel: Cure Disease Spell
    cureLegend: Cures
    cureNote: Cast the moment the game says you are blinded, poisoned or diseased, and again after
      thirty seconds if it still shows. A blank field does nothing. A field is greyed out when
      your spellbook has nothing that cures it.
    curePoisonLabel: Cure Poison Spell
    cureHint: The spell to cast when this lands on you. Blank does nothing.
    cureClosedHint: Your spellbook has no spell that cures this, so there is nothing to cast.
    bookUnreadNote:
      This character's spellbook hasn't been read yet. The client reads it automatically the
      next time the character logs in; until then these fields can't suggest anything.
    pickerPlaceholder: search spells
    removeBlessingAria: Remove blessing {number}
    removeBlessingTitle: Remove
    areaCastHint:
      Cast bare — c <spell>, no target — when the fight is crowded enough. Refused while a monster the realm
      calls good stands in the room, because an AE spell hits everything there.
    areaCastLabel: Area Effect (AE) / Room Spell
    areaMinManaHint:
      The AE spell is the expensive one, so its floor is the higher of this and the ordinary mana floor. 0
      defers to that floor alone.
    areaMinManaLabel: AE Spell Min Mana %
    areaMinMobsHint:
      Targets at or above which the AE spell is chosen — what is in this fight or would join
      it, never a shopkeeper.
    areaMinMobsLabel: AE Min Targets
    castHint:
      Sent as c <spell> <target> on the mid-round tick. The whole name — the realm matches on a
      prefix.
    castLabel: Combat Spell (Round Spell)
    autoChoose: Auto Choose Best Spell
    autoChooseHint:
      Picks the round spell each round from your spellbook and the realm's figures — never one the
      monster resists, the cheapest that would finish it, else the hardest hitter. Healing is
      chosen the same way against the hit points actually missing, so a scratch is not mended with
      a major heal, and the cures are picked where their boxes are blank. The spells below are cast
      with this off, and with it on wherever the spellbook cannot answer.
    fallbackCastHint:
      Cast instead for the rest of the fight once the game says the combat spell has no effect on
      the target. Blank leaves the fight to the round attacks.
    fallbackCastLabel: Fallback Spell
    attackCastsHint:
      Casts of the combat spell per target, then the round attacks carry it. 0 is no limit;
      MegaMUD's own default is 1.
    attackCastsLabel: Casts Per Target
    areaCastsHint: Casts of the AE spell per fight. 0 is no limit.
    areaCastsLabel: AE Casts Per Fight
    healBelowInCombatHint:
      A separate floor while fighting. 0 uses the one beside it for both; set it lower so a scratch
      does not cost a round.
    healBelowInCombatLabel: Heal In Combat Below %
    healBelowLabel: Heal If Below HP %
    healHint: Cast on this character, bare. Only spells the realm lets you cast on yourself are offered.
    healLabel: Self Healing Spell
    healLegend: Healing
    healNoSelfCast: The realm says this spell cannot be cast on yourself.
    healNoPartyCast: The realm says this spell cannot be cast on another character.
    healParty: Auto-Heal Party Members
    healPartyHint: A member the roster has not listed has no health to read, and is never healed on a guess.
    healPartyWithHint:
      Cast on the member who is hurt. Only spells the realm lets you cast on another character
      are offered.
    healPartyWithLabel: Party Healing Spell
    healToHint: Keep healing that target until it is back to this. 0 casts once at the threshold.
    healToLabel: Heal Up To HP %
    legend: Attack Spell
    minManaHint: Falls through to the round attacks below this. 0 always casts.
    minManaLabel: Not Below Mana %
    note: Buffs, heals and everything conditional are automation.rules in the options file.
    rulesPointerNote:
      One cast, chosen by a number, on the mid-round tick — which is the one thing about
      a spell a rule cannot express. Everything else a caster wants is automation.rules.
  statline:
    legend: The Prompt
    controlLabel: Own the Status Line
    controlHint:
      Sends the client's own template on the way in, so every prompt carries maximum health and
      mana, experience, what the next level still costs and the purse; then asks pro once for
      what the realm holds, which is what the prompt is read by.
    templateNote:
      'The template sent is set statline full custom [HP=%h/%H,MA=%m/%M,Exp=%x,Need=%X,Wealth=%c%r]:
      — the realm keeps it on the character, so it stays set after the client is closed. Off or
      on, the client reads whatever the line turns out to be and says which pattern it reads it by.'
  rewrites:
    listLegend: Your Designs
    note: Each design draws in place of what the realm printed, with what the client knows laid
      beside it, the moment the listing completes; what was drawn stays drawn in the scrollback.
      One design draws each listing, and turning one on turns off the others for it.
