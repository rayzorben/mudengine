        fights (or sneaks, during a loop or route) so your opening backstab works again.'
      many: '"automation.combat.hideForOpener" was added to {count} files ({fileList}), turned off.
        It hides between fights (or sneaks, during a loop or route) so your opening backstab works
        again.'
    coinsCanBeShed:
      one: '"automation.loot.discardKinds" was added to {fileList}, empty. It lists coins to drop
        whenever you carry any, the opposite of "coinKinds". Nothing is dropped until you add one.'
      many: '"automation.loot.discardKinds" was added to {count} files ({fileList}), empty. It lists
        coins to drop whenever you carry any, the opposite of "coinKinds". Nothing is dropped until
        you add one.'
    roomRemoteFollowsWhere: "@where-room was added next to @where in {count} permission lists in
      {file}. It answers the same question with the room's map number instead of its name, and the
      person asking chooses which to send. @comeback-room was not added anywhere, because it lets
      someone else walk this character, and that should be a deliberate choice."
    partyRemotesStated: '"automation.remotes.party" was added to {file}. It lists the remote
      commands anyone who has joined this character''s party may use. It comes with @health,
      @bless-expired and @heal, which is what the client already answered. Nothing changes until
      "remotes.enabled" is on.'
    profileLoopsLifted:
      many: '{count} loops moved out of {characterId} into {loopsDir}.'
      one: '{count} loop moved out of {characterId} into {loopsDir}.'
    realmOwnsDatabase:
      many: The world database now belongs to the realm instead of each character, so two characters
        on one realm share one map. It was added to {realmCount} realm files, and the old `world:`
        setting was removed from {characterCount} character files.
      one: The world database now belongs to the realm instead of each character, so two characters
        on one realm share one map. It was added to {realmCount} realm file, and the old `world:`
        setting was removed from {characterCount} character files.
    realmOwnsDatabaseCleared: The world database now belongs to the realm instead of each character.
      None was set, so nothing moved and every realm keeps the built-in world. The unused `world:`
      setting was removed from {characterCount} files.
    worldsNamed:
      many: '{count} realm files named a built-in world by the file it was built from, and now name
        it directly: majormud or paradigm.'
      one: 'A realm file ({file}) named a built-in world by the file it was built from, and now
        names it directly: {world}.'
    rosterCapStated: '"tuning.parse.rosterLines" was added to your tuning file. The who list used to
      be capped at 60 lines, so on a realm with more players than that, everyone past the sixtieth
      was missed, including in the record of who is online.'
    nudgeWindowStated: Walking now measures how long your realm takes to answer a move, and waits
      that long before asking for a prompt, instead of assuming one second. Paradigm takes 1.24
      seconds, so the old setting made every normal step look late and showed every room twice.
      "tuning.walk.nudgeSamples" was added to your tuning file next to it.
    actionsFamilied: Actions on a carried item are now a set of separate controls. {file} had a
      rewrite using "{action}", which no longer draws anything, so it now uses
      "{action.toggleEquip}". "{action.drop}" adds a drop control next to it.
    lightWaitStated: 'When a walk enters a room too dark to see, it now waits for Auto-Light to
      light a torch and look again, instead of stopping because it cannot tell where the character
      is. "tuning.walk.lightWaitMs" was added to your tuning file: how long it waits before giving
      up.'
    replanDriftStated: Pressing Walk on a route you planned before the character moved now re-plans
      it from where the character is and walks it, instead of refusing because the route starts
      somewhere else. If the character has moved more than ten rooms, or the new way needs something
      the old one did not, the new route is shown to you first. "tuning.walk.replanDriftSteps" was
      added to your tuning file.
    stepNudgeStated: When a walk sends a step and hears nothing back, it now asks the game for a
      prompt after one second instead of waiting out the whole timeout. The interval was added to
      your tuning file with the other walk settings.
    profilesFolded:
      many: '{count} character files moved into their own folders, so each can hold its own loops.'
      one: 1 character file moved into its own folder, so it can hold its own loops.
    freedomCureStated:
      many: 'A Freedom spell, cast when the character is held in place, was added blank to the cures
        in {count} files: {fileList}'
      one: 'A Freedom spell, cast when the character is held in place, was added blank to the cures
        in {count} file: {fileList}'
    trapRest:
