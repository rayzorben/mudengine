        health covers the trap ahead and leaves that share of the bar after it. {fileList}'
      one: 'Resting before a trap was added to {count} file, at 45%: a walk now waits until
        health covers the trap ahead and leaves that share of the bar after it. {fileList}'
    restCeiling:
      many: 'A resting ceiling was added to {count} files, off: keep sitting back down until health
        reaches it. Casting turns out to break a rest and standing regenerates six times slower, so
        without it one heal ended the resting for the whole recovery. {fileList}'
      one: 'A resting ceiling was added to {count} file, off: keep sitting back down until health
