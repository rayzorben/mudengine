      {needed} HP (now {hp}) before going through.
    trapResumed: Enough health for the trap into {stepName}; walking on.
    holdingBlind: Blind; waiting here until you can see again.
    holdingHeld: Held fast; waiting here until you can move again.
    holdingPoisoned: Poisoned; waiting here until it runs its course.
    holdingConfused: Confused; waiting here until your head clears.
    afflictionResumed: The condition has passed; walking on.
    holdingDark: Too dark to tell where this is; waiting for a light.
    lightResumed: The room can be read again; walking on.
    gateMissed: The way through needed {condition}, which this client cannot check. You are in
      {roomName} instead; re-planning from here.
    leverFetching: The way to {stepName} is opened by "{phrase}" in {roomName}. Going there to pull
      it, then continuing.
    leverNext: Lever pulled; {roomCount} more to go.
    leverPulled: Lever pulled; walking on to {destination}.
    leverRun: The way to {stepName} needs levers in {roomCount} rooms. Walking to them in the game's
      own order, then continuing.
    leverRunRefused: 'The way to {stepName} needs levers in {roomCount} rooms, and they cannot all
      be reached: {reason}'
    leverUnreachable: 'The way is opened by "{phrase}" in {roomName}, and there is no route there:
      {reason}'
    leversScattered: The way to {stepName} needs levers in {roomCount} different rooms, and the
      world data does not say in which order. Pull them by hand and the way opens.
    reasonAmbiguous: the client can no longer tell which room you are in
    reasonBarrier: '{barrier} blocked {command}. {detail}'
    reasonBashing: bashing the {barrier} to {stepName}
    reasonCombat: a fight started
    reasonDarkUnresolved: Room is {lightLevel}; cannot tell where you are without a light source.
    reasonDied: you were killed, and the game has moved you
    reasonFightUnending: nothing here is ending the fight, so the route is not waiting any longer
    reasonLostAfterFight: the fight ended somewhere the client could not place
    reasonMoveUnanswered: the fight ended with {command} still unanswered, so there is nowhere to plan from
    reasonNotQueued: the client refused to send {command}
    # A walk that ended inside `Walker.start` with no reason recorded (todo 06, on review).
    stoppedAtStart: the walk stopped before its first step went out
    reasonNotSent: '{command} never left the client'
    reasonNudge: forcing an answer after {command}
    # A portal left from a pitch-black room is not nudged: nothing in a dark reprint
    # tells the Enter's answer from the landing (todo 808).
    noNudgeUnseen: 'No Enter after {command}: the room is too dark to tell its reprint from
      arriving, so the walk waits for the portal.'
    reasonOpening: opening the {barrier} to {stepName}
    reasonPicking: picking the {barrier} to {stepName}
    reasonPlayerTookOver: you moved the character yourself
    reasonRefused: the game refused {command}
    reasonUnlocking: unlocking the {barrier} to {stepName} with the key you are carrying
    reasonLever: '"{phrase}" to open the hidden way to {stepName}'
    reasonWalkingThroughFight: Auto-combat is not fighting this, so the route keeps walking through
      the fight instead of waiting for it to end, which is also how it ends.
    reasonRereading: reading the room again for the hidden way to {stepName}
    reasonSearching: searching for the hidden way to {stepName}
    searchHolding: The world data says the way to {stepName} is hidden here. Searching for it, and
      staying put until it is found.
    reasonSneak: sneaking before the route
    # Todo 104: the sheet's own figure decides, from `SneakCommand.cs`'s roll.
    sneakNoSkill: 'Not sneaking before steps: this character has no Stealth (the stats say 0), so
      the game refuses every attempt. Auto-Sneak on Move is ignored for this session.'
    reasonStepping: walking to {stepName}
    reasonTimeout: nothing came back after {command}
    # A step on the wire when the character dropped: refused there, and handed
    # no state, so not a silence (todo 764).
    reasonGrounded: you fell to the ground with {command} still unanswered, and nothing is walked
      from there
    reasonWrongRoom: Off the path / location mismatch ({roomName}).
    refusalDisabled: Automation is disabled.
    refusalInCombat: You are in combat; a route will not walk out of a fight.
    refusalMoveInFlight: A move has not been answered yet, so the client cannot tell which room to
      plan from. Try again in a moment.
    refusalNoRoute: No route to there.
    refusalStaleRoute: That route starts somewhere else. Plan it again from here.
    refusalUnknownStart: The client cannot tell which room you are in, so it will not start walking.
    started:
      many: Walking {stepCount} steps to {destination}.
      one: Walking {stepCount} step to {destination}.
    stopped: 'Walk stopped: {reason}'
    superseded: Dropped the walk to {destination}; something else is moving the character now.
    fallbackMove: the move
    fallbackLight: light
    fallbackBarrier: door
# Play was pressed on a movement that was stopped a long time and a long way
# ago. A stop keeps its place, so the lap you stopped at ten o'clock is still
# there at midnight -- after the character has been walked to a bank, killed,
# and reborn in a temple two maps away. Past `tuning.walk.resumeAskSteps` the
# client asks rather than walking it back across the realm unasked. Both
# figures are the same measurement -- how much *further* away the character is
# now than when the movement stopped -- so a movement stopped and started again
# from the same room asks nothing, however long it still had to go.
movement:
  # The back button, when the previous room is not one step away: a one-way
  # exit, a door that shut, a corridor that only runs the other way.
  backNotAStep: The room you came from is {stepCount} steps away; there is no single step back to
    {destination}.
  backTitle: 'Going back is a journey for {name}'
  stay: Stay here
  title: '{name} has moved a long way'
  walkIt: Walk it back
  wanderedFromLoop: '{loopName} is {stepCount} steps farther away than when the loop stopped.'
  wanderedFromRoute: '{destination} is {stepCount} steps farther away than when the route stopped.'
  whatHappens: 'Walking back is a trip like any other: through whatever lives on the way, with
    auto-combat and your other settings working as usual. Staying here changes nothing: the loop or
    route keeps its place, and you can press play again.'

# The client thinks the character in the realm is not the one its records are
# about, and is asking. It only ever asks: deleting the only copy of what
# somebody learned is not a decision taken from a heuristic.
reset:
  class: Class
  exp: Experience
  forget: Forget the old character
  keep: Keep everything
  level: Level
  noticed: 'This does not look like the same character: {signals}.'
  nowHeading: Now
  race: Race
  signal:
    class: the class changed
    experience: the experience dropped sharply
    level: the level went back to 1
    race: the race changed
  title: Is {name} still the same character?
  wasHeading: 'Kept since {at}'
  whatGoes: 'Forgetting deletes what this client saved about the character: bank balances, worn
    slots, the spellbook, measured spell durations and quest counters. What it learned about the
    realm stays: the map, the shops and the other players did not change.'

# How a sighting of another player is phrased, shared by the people cards.
players:
  sighting:
    daysAgo: '{days}d ago'
    hoursAgo: '{hours}h ago'
    justNow: just now
    minutesAgo: '{minutes}m ago'
    secondsAgo: '{seconds}s ago'
    noRoom: not seen in a room
    roomNumber: room {roomNumber}
    unplacedRoom: a room the client could not place
# The @ command permission grid, shared by the Player flyout, the Gang card and
# the settings screen. The command names themselves are closed-union vocabulary
# rendered as itself (`@health`) and stay in code, like every other union here.
remotes:
  allow: Allow
  allowAll: Allow all
  allowAllTitle: Grant every @ command this client can answer
  allowTitle: Answer @{remote} for {name}
  clearAll: Clear all
  clearAllTitle: Remove every @ command setting, allowed and denied
  deny: Deny
  denyTitle: Never answer @{remote} for {name}, whatever the gang or party grants
  findPlaceholder: Find an @ command
  fromGang: from the gang
  fromParty: from the party
  granted: '{granted} of {total} granted'
  noMatch: No @ command matches "{query}".
  on: 'On'
  onPartyTitle: Let anyone who has joined this party ask for @{remote}
  onTitle: Let anyone in the gang ask for @{remote}
  showAll: Show all
  showing: '{shown} of {total}'
  support:
    refused: always refused
    refusedTitle: Refused for everyone, however it is granted; this client never does it.
    unread: no reply recorded
    unreadTitle: '{because}'
# Serving the window over HTTP (MUDENGINE_WEB=1): the sign-in page main draws,
# and what a browser tab says when the desktop's answer is not available.
web:
  login:
    title: mudengine — sign in
    heading: mudengine
    lead: This client is password protected. Enter the password to open the console.
    passwordLabel: Password
    submit: Sign in
    wrong: That is not the password.
    cleartext: 'This connection is not encrypted: the password is sent in plain text. Use it only on
      a network you trust, or put a TLS proxy in front of the client.'
  link:
    lost: The connection to the client was lost. Waiting for it to answer again…
  clipboard:
    readRefused: The browser would not give the clipboard to the client; paste with Ctrl+V or
      Shift+Insert, which the browser handles itself.
    writeRefused: The browser would not accept the copy; select the text and copy it yourself.
  picker:
    unavailable: There is no way to choose a world database here.
  rpc:
    noHandler: Nothing in the client answers {channel}.
# The client's files, listed in the window, where the host has no file manager.
browser:
  title: The client's files
  pickTitle: Choose a world database
  pickScope: From the client's own files under {root}, on the machine the client runs on, not this
    one. Put the database there first.
  up: Up
  copyPath: Copy path
  close: Close
  loading: Listing…
  empty: Nothing here.
  use: use this file
  realmChip: realm
