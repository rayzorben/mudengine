    exitRefused: The realm data promised an exit {direction} that the realm refuses; routes will avoid it.
    exitShut: The way {direction} is shut rather than absent; routes will avoid it until the room lists it.
    readLapsed:
      Nothing answered “{command}” in {seconds}s, so the client has stopped waiting for it. It was a
      re-read rather than a step, so nothing was held up by it.
    readLapsedUntyped:
      Nothing answered the last re-read in {seconds}s, so the client has stopped waiting for it.
      Nothing was held up by it.
    readLapsedSeveral:
      Nothing answered the last {count} re-reads in {seconds}s, so the client has stopped waiting
      for them. Nothing was held up by them.
    stoppedByPlayer: you asked it to
    stoppedConnectionClosed: the connection closed
    stoppedLeftRealm: you left the realm
    resumed: Back in the realm; picking the walk to {destination} back up from here.
    notResumed: 'Not walking on to {destination}: {reason}'
    replanned:
      That plan started in a room you have since left, so it was drawn again from here — {steps}
      steps to {destination}.
  world:
    realmMismatch: The realm says you are in room {map},{room}, which the loaded realm data does not
      have — this character's world.database may not match this realm. Routes will fail from here.
# What the automations say: loops, login, peers, hang-up.
automation:
  # Going and getting what a route needs -- `ItemErrand` (todo 07). The route
  # says what the door wants; the realm says where it comes from.
  collect:
    abandoned: 'Gave up collecting {item}: {why}'
    becauseDoor: 'the way needs {item}'
    buying: 'Going to buy {item} at {shop} in {room} first — {detour} steps off the way.'
    buyingOnTheWay: 'Going to buy {item} at {shop} in {room} first; the way there goes past it.'
    gotAndKept: '{item} is in the pack, and it is on the keep list, so it stays.'
    gotForTheDoor: '{item} is in the pack — collected for this door, not kept.'
    hunting: 'Looking for {item}: {mob} drops it, starting at {room}, {steps} steps away.'
    huntingHere: 'Looking for {item}: {mob} drops it, starting here in {room}.'
    huntingNextDoor: 'Looking for {item}: {mob} drops it, starting next door in {room}.'
    loopName: 'Collect: {item}'
    refusalBusy: Something is already being collected.
    replacingLap: 'Stopping {loopName} to go and collect it; it will not start again on its own.'
    refusalLapStopped: 'The hunt for {item} stopped before the pack held one.'
    refusalNoSource: The realm names nowhere this comes from.
    refusalDropperUnplaced: 'Dropped only by {mobs}, which the realm summons rather than places anywhere.'
    refusalDropperUnreachable: 'Dropped only by {mobs}, which the realm places nowhere this character can reach from here.'
    refusalNotBought: '{item} was not bought, so the route is not being walked.'
    refusalNotInRealm: This character is not in the realm.
    refusalRouteRefused: 'The way is open now, but the route did not start: {why}'
    stoppedGotIt: 'the pack holds {item}'
    whyLeftRealm: the realm was left
  # Keeping a room's ward up off a carried item -- `Wards` (todo 105).
  wards:
    reason: 'using {item} for {spell} against {hazard}'
    using: 'Using {item} for {spell}: the rooms ahead cast {hazard}, and nothing carried stops it outright.'
    nothingCarried:
      'The rooms ahead cast {hazard}, which {spells} would stop, and the pack holds nothing whose
      use casts one of them.'
    lentForRun:
      'Using wards for the quest run: the plan bought them to be used, though Keep a Room’s Ward Up
      is off in the settings.'
    returnedAfterRun: 'The quest run is over: wards are off again, as the settings say.'
    lendEnded: 'Keep a Room’s Ward Up was turned off, so the quest run goes on without wards.'
  # Running a quest's plan -- `QuestRunner` (todos 102-103). Every sentence
  # names the step it is about, and every refusal says what stopped it.
  quests:
    because: 'running {quest} to rank {to}'
    becausePressed: the Quest card's Run it was pressed
    started: 'Running {quest} to rank {to}: {count} steps.'
    finished: '{quest} reached rank {to}. The run is done.'
    refused: 'Quest run stopped: {why}'
    abandoned: 'Quest run stopped: {why}'
    going: 'Step {nth}: walking to {room} ({steps} steps).'
    buying: 'Step {nth}: buying {item} ×{count} at {shop}, {room}.'
    hunting: 'Step {nth}: hunting {mob} for {item}.'
    handover: 'Step {nth}: getting {item} — {command}.'
    asking: 'Step {nth}: {command}.'
    askingAgain: 'Step {nth}: {command} again — try {tries} of {max}; the roll did not pass.'
    stepDone: 'Step {nth} done: {quest} is at rank {rank}.'
    stepAssumed:
      'Step {nth} sent; this realm prints no counter and the step takes and gives nothing, so
      the act itself is taken as done.'
    reasonPack: 'reading the pack for the quest run'
    reasonAbil: 'reading the quest counter after the act'
    reasonAct: 'quest step {nth}'
    reasonHandover: 'asking for {item} for the quest'
    reasonPackAfter: 'reading the pack after the quest step'
    detailFetching: 'getting {item}'
    detailWalking: 'walking to {room}'
    detailKilling: 'fighting {mob}'
    detailWaitingFor: 'at {who}'
    detailConfirming: reading the counter
    whyReset: the connection was reset
    whyLeftRealm: the realm was left
    whyPlayerMoved: you moved the character yourself
    whyStopped: you asked it to
    whySwitchedOff: Auto-Quest was switched off
    whyWalkStopped: the walk stopped
    whyErrandEnded: the shopping errand ended without it
    whyNothingMoved: nothing moved for long enough that something is stuck
    whyLegStalled: the walk to the next step stood still
    heldUp: 'Held up — {why}. Trying again in {seconds}s (setback {tries} of {max}).'
    stockingUp: 'Stocking up on {item} before step {nth} — this leg passes nearest the counter.'
    stockUnfilled: 'Carrying on without {item}: the counter had none to spare, and the quest does not want one.'
    refusalGaveUp: '{why}, and that is {tries} setbacks in a row with nothing achieved'
    refusalSwitchedOff: 'Auto-Quest is off. Turn it on under Quests in the settings, then press Run it again.'
    refusalBusy: A quest is already being run.
    refusalNotInRealm: This character is not in the realm.
    refusalNothing: The plan has no steps to run.
    refusalUnplaced: This character is not placed, so nothing can be walked.
    refusalWalking: A route is being walked; stop it first.
    refusalEscaping: An escape is in flight.
    refusalNoPlan: The realm has no plan for this step.
    refusalUnknownStep: 'No quest holds step {block}.'
    refusalPackUnread: The pack was asked for and nothing answered.
    refusalItemGone: 'Step {nth} wants {item}, which the plan said was in the pack and is not.'
    refusalNotHandedOver: '{item} should have come from the step at rank {rank}, and the pack does not hold it.'
    refusalItemUnplaced: 'The realm names nowhere {item} comes from.'
    refusalItemUnnamed: 'The realm names no item for row {id}.'
    refusalNoWords: 'The realm names no words to say for {item}.'
    refusalNotBought: '{item} was not bought: {why}'
    refusalNotHunted: 'Could not go hunting for {item}: {why}'
    refusalHuntStopped: 'The hunt for {item} stopped before the pack held one.'
    refusalHandoverUnanswered: '{item} was asked for, and the pack listed after it does not hold one.'
    refusalHandoverUnsent: '{item} was never asked for: the ask lapsed in the queue.'
    refusalNoRoute: 'No way to {room}: {why}'
    refusalNotReached: 'Did not reach {room}: {why}'
    refusalUntraced: 'Step {nth} is traced to nobody, nowhere and no death, so there is nothing to do.'
    refusalAskerNotHere: '{who} did not turn up for step {nth}.'
    refusalMobNotHere: '{mob} did not turn up for step {nth}.'
    refusalMobNotFought: '{mob} is here for step {nth} and nothing will fight it'
    refusalNotQueued: 'The arbiter would not send {command}.'
    refusalListingUnanswered: 'abil was asked for after step {nth} and nothing answered.'
    refusalCounterUnmoved: 'Step {nth} was sent and the counter stayed at {rank}, short of {to}. Check its gates by hand.'
    refusalRollFailed: 'Step {nth} rolled {tries} times and never passed.'
    refusalRollUnreadable:
      'Step {nth} rolls and this realm prints no counter, so whether it passed cannot be read. Do it
      by hand.'
    refusalPackUnmoved: 'Step {nth} was sent and the pack listed after it did not change; the realm prints no counter to read instead.'
    refusalUnwatched: 'Step {nth} was sent and nothing on this realm says whether it took.'
