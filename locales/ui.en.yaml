      densityCompact: Compact
      densityLabel: Density
      fontSizeLabel: Size, px
      scrollbackLabel: Scrollback, Lines
      showHud: Show Cards Beside Console
      showLogo: Show The MudEngine Logo
      tabPlacementLabel: Character Tabs
      tabsLeft: Down the left, cards right
      tabsRight: Down the right, cards left
      tabsTop: Across the top
      uiFontHint: Everything except the console, which is always fixed-width. Blank uses the console
