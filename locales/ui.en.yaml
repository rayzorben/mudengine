    refusalHandoverUnsent: '{item} was never asked for: the request expired in the queue.'
    refusalNoRoute: 'No way to {room}: {why}'
    refusalNotReached: 'Did not reach {room}: {why}'
    refusalUntraced: Step {nth} is linked to no person, place or kill, so there is nothing to do.
    refusalAskerNotHere: '{who} did not turn up for step {nth}.'
    refusalMobNotHere: '{mob} did not turn up for step {nth}.'
    refusalMobNotFought: '{mob} is here for step {nth} and nothing will fight it'
    refusalNotQueued: The command queue would not send {command}.
    refusalListingUnanswered: 'abil was asked for after step {nth} and nothing answered.'
    refusalCounterUnmoved: Step {nth} was sent and the counter stayed at {rank}, short of {to}.
      Check its requirements by hand.
    refusalRollFailed: 'Step {nth} rolled {tries} times and never passed.'
    refusalRollUnreadable: Step {nth} involves a roll and this realm shows no counter, so whether it
      passed cannot be read. Do it by hand.
    refusalPackUnmoved: Step {nth} was sent and your inventory did not change; this realm shows no
      counter to check instead.
    refusalUnwatched: Step {nth} was sent and nothing on this realm shows whether it worked.
  # Hunting on its own -- `AutoHunt` (todo 05). Every sentence names a figure:
  # what it is going to, what it expects to earn there, or why it will not.
  hunt:
    becauseBetter: this lair pays {here} an hour and another is worth about {rate}
    becauseRate: 'the best lair within reach pays about {rate} an hour'
    becauseSwitch: automatic hunting is on
    company: '{who} is hunting this lair too, so it pays half as much. {loopName} is rated that way
      from now on.'
    going: 'Going hunting: {room}, {steps} steps away, about {rate} exp an hour.'
    goingFar: 'Going hunting: {room}, {steps} steps away, which is a long trip, for about {rate} exp
      an hour.'
    movingOn: '{loopName} pays {here} an hour; {mob} is worth about {rate}, so this character is
      going there.'
    refusalLoop: 'Could not start {loopName}: {why}'
    refusalNoRate: Nothing within reach pays enough to walk to, above the {floor} an hour this
      character is set for.
    refusalNoRooms: The best lair within reach has no room to stand in.
    refusalNoRoute: 'No route to {room}: {why}'
    refusalNothingReachable: Nothing within reach is worth hunting.
    refusalNotReached: 'Did not reach {room}: {why}'
    started: Hunting {loopName}, for about {rate} exp an hour.
    stoppedForBetter: '{mob} pays better'
    stoodDown: You stopped {loopName}, so Auto-Hunt is paused until this character levels, changes
      gear, or a loop stops for paying too little.
    whyStopped: the walk stopped
  stealth:
    reasonHide: 'hiding, so the next fight opens with {verb}'
    reasonSneak: 'sneaking, so the next fight opens with {verb}'
    # Todo 104: the sheet's own figure decides, from `SneakCommand.cs`'s roll.
    noSkill: 'Not hiding or sneaking for the opener: this character has no Stealth (the stats say
      0), so the game refuses every attempt.'
    ceiling: 'Stealth {skill} is above {ceiling}: moving rolls at most {ceiling} and sneaking at
      most 95, while hiding uses the full value, so Stealth above {ceiling} only helps while
      standing still.'
  combat:
    lentForHold: 'Held with auto-combat off: turning it on until the hold wears off.'
    returnedAfterHold: 'The hold wore off: auto-combat off again, walking on.'
    backOnArrival: 'Arrived: auto-combat back on.'
    # Todo 00 (2026-09-23): hit and not moving with auto-combat off lends it
    # until the next arrival in another room.
    lentForDefence:
      one: 'Hit for {rounds} round without moving, with auto-combat off: turning it on until you
        move.'
      many: 'Hit for {rounds} rounds without moving, with auto-combat off: turning it on until you
        move.'
    defendBecause: 'rounds hit without moving, with auto-combat off: {rounds}'
    defendUnwritable: "auto-combat could not be turned on in the character's file"
    returnedAfterMove: 'Moved: auto-combat back off.'
    returnedAfterDeath: 'Killed: auto-combat back off.'
    returnedAfterLeaving: 'Left the realm: auto-combat back off.'
    returnedAfterLoss: 'Connection lost: auto-combat back off.'
    returnedAfterClose: 'Disconnected: auto-combat back off.'
    # The file refused handing the lent switch back; tried again each state.
    returnStuck: Auto-combat was turned on temporarily and could not be turned back off in the
      character's file. Trying again; turn it off by hand if this continues.
    returnUnwritable: "auto-combat could not be turned back off in the character's file"
    returnedAtReset: 'New session: auto-combat back off.'
    # Todo 06: *Run it* is turn off, go -- said at the start, and again where the
    # run is picked up after a lost connection or an errand.
    runningCombatOff: 'Running it: auto-combat is off, and stays off until you turn it back on.'
    runRefused: "Not running it: auto-combat could not be turned off in the character's file."
    reason: 'auto-combat: {why}'
    reasonArrivalUnplaced: 'auto-combat: something arrived that the world data could not place'
    reasonRefresh: 'auto-combat: re-reading the room'
    reasonRoundAreaSpell: 'auto-combat: the room is crowded enough for the area spell'
    # Todo 816: the server repeats the spell each round; spent, the round changes to {verb}.
    reasonRoundMelee: 'auto-combat: {spell} is used up or out of reach, back to {verb}'
    reasonRoundSpell: 'auto-combat: attack spell'
    refusedAlreadyFighting: already fighting {target}
    # Something already swung at is still standing here. `aa` switches target,
    # so a second fight opened beside the first is always waste, and the block
    # between `*Combat Off*` and `*Combat Engaged*` is where it used to happen.
    refusedEngagedWith: already attacking {target}, which is still here
    refusedNever: '{target} is set to never attack'
    # Todo 818: the other stances, and the row's Not Hostile.
    refusedFriend: '{target} is a friend, by its monster rule'
    refusedEscapeRow: '{target} is one to run from, by its monster rule'
    refusedHangupRow: '{target} is one to hang up on, by its monster rule'
    refusedBesideEscape: '{target} is here and its monster rule says to run, so no fight is started
      next to it'
    refusedBesideHangup: '{target} is here and its monster rule says to hang up, so no fight is
      started next to it'
    refusedRowNotHostile: the monster rule for {target} says it does not attack first, and Attack
      Target Selection is not Attack All Monsters
    refusedRowNotHostileOverRealm: the monster rule for {target} says it does not attack first,
      though the world data says it does, and Attack Target Selection is not Attack All Monsters
    overrideFriend: 'The monster rule for {target} calls it a friend, though the world data says it
      attacks on sight. Following your rule: it is never attacked, the character rests next to it,
      and it is not counted as a threat.'
    overrideNotHostile: 'The monster rule for {target} says it does not attack first, though the
      world data says it does. Following your rule: it is attacked only with Attack All Monsters,
      the character rests next to it, and it is not counted as a threat.'
    # The realm lists {guard} as moving to protect {target}, and the server
    # hands a blow at {target} to it; {why} is the guard's own refusal.
    refusedGuarded: '{guard} protects {target}, and attacking the guard is refused: {why}'
    refusedCostly: Attacking {target} costs alignment (-10).
    refusedEngageNone: Attack Target Selection is Retaliate Only, so no fight is started
    refusedTooTough: '{target} has {hp} health, over the Max Target Health of {cap}'
    refusedMaxMobs: '{here} monsters here, over the Max Monsters in Room of {max}'
    refusedMinMobs: only {here} monsters here, under the Min Monsters in Room of {min}
    refusedTooRich: '{target} is worth {exp} exp, over the Max Monster Exp of {cap}'
    refusedMovePending: a step is still waiting for its room
    refusedNotHostile: the world data does not say {target} attacks first
    refusedClaimed: '{player} is already fighting {target}, and Polite Attacks is on'
    refusedRetreating: Running away
    refusedStandDown: you typed break
    refusedUncertain: the world data contradicts itself about {target}, and Attack Target Selection
