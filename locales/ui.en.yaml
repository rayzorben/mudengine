    escapeKilled: killed before the move landed
    escapePrinted: 'Running {direction}: {why}. It is an exit the room listed.'
    escapeReason: 'safety: {why}'
    escapeRetrace: 'Running {direction}, the way we came: {why}.'
    retreatBecause: Walking to the safe room ({room}) after running
