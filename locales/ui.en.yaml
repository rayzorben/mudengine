    hangingUpClean: 'Hanging up: {why}.'
    hangingUpUncharged: "Hanging up: {why}. {realm}'s realm menu says it has no hang penalty."
    hangingUpUnchargedSetting: 'Hanging up: {why}. Your settings say this realm has no hang
