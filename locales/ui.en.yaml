    realmCharges: "{realm}'s realm menu says a hangup costs {percent}%."
    realmChargesNothing: "{realm}'s realm menu says a hangup costs nothing."
    pvpAlertReason: 'safety: telling the gang about {attacker}'
    pvpAlerted: 'Telling the gang: {attacker} is attacking.'
    pvpNoGang: 'Not telling anyone about {attacker}: the who list shows you in no gang.'
