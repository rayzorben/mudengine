    retreatRefused: 'Could not walk to {room}: {reason}'
    retreatUnplaced: 'Not walking to {room}: the room could not be identified after the move.'
    # The last-ditch teleport (todo 813): {command} is the realm's own, literally.
    teleporting: 'Teleporting out with {command}: {why}.'
    teleportReason: 'safety: teleport, {why}'
    teleportRefused: 'The game refused {command}: {answer}'
    teleportNot: 'Not teleporting: {why}, but {refused}.'
    teleportUnstated: no teleport command is stated for this realm or character
    teleportRefusedBefore: the game refused {command} earlier this session
    teleportDropped: 'Not waiting on {command} any longer: the character was killed or left the realm.'
