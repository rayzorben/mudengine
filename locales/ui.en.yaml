        again.'
      many: '"automation.combat.hideForOpener" was written into {count} files ({fileList}), off:
        hide (or sneak, while a lap or route has the character) between fights, so an opening
        backstab lands again.'
    coinsCanBeShed:
      one: '"automation.loot.discardKinds" was written into {fileList}, empty: which coins to put
        back on the floor whenever any are carried, the other end of "coinKinds". Nothing is
        dropped until you name one.'
      many: '"automation.loot.discardKinds" was written into {count} files ({fileList}), empty:
        which coins to put back on the floor whenever any are carried, the other end of
        "coinKinds". Nothing is dropped until you name one.'
    roomRemoteFollowsWhere:
      "@where-room was added beside @where in {count} grants in {file}: it is the same question
      answered with the realm's own address for the room instead of its name, and which of the two
      goes out is the asker's choice. @comeback-room was not added anywhere — it walks this
      character on somebody else's word, and that is a decision to make on purpose."
    partyRemotesStated:
      '"automation.remotes.party" was written into {file}: the remotes anybody who has joined this
      character''s party may ask for. It ships with @health, @bless-expired and @heal on it, which
      is what the client was already answering with — nothing changes until "remotes.enabled" is
      on.'
    profileLoopsLifted:
      many: '{count} loops moved out of {characterId} into {loopsDir}.'
      one: '{count} loop moved out of {characterId} into {loopsDir}.'
    realmOwnsDatabase:
      many:
        'The world database belongs to the realm now rather than to each character: two characters
        on one realm walk one map. It was written into {realmCount} realm files and the old
        `world:` key removed from {characterCount} character files.'
      one:
        'The world database belongs to the realm now rather than to each character: two characters
        on one realm walk one map. It was written into {realmCount} realm file and the old
        `world:` key removed from {characterCount} character files.'
    realmOwnsDatabaseCleared:
      'The world database belongs to the realm now rather than to each character. Nothing named
      one, so nothing moved and every realm keeps the world that ships; the unread `world:` key
      was removed from {characterCount} files.'
    worldsNamed:
      many:
        '{count} realm files named a bundled world by the archive it is built from and now name it
        by its word, majormud or paradigm.'
      one:
        'A realm file named a bundled world by the archive it is built from ({file}) and now names
        it by its word: {world}.'
    rosterCapStated:
      '"tuning.parse.rosterLines" was added to your tuning file. The `who` listing''s cap was 60
      lines beside the pattern, so a realm with more adventurers than that lost everybody past
      the sixtieth row — including from the record that says who is online.'
    nudgeWindowStated:
      'A walk now measures how long your realm takes to answer a move and waits that long before
      asking for a prompt, instead of assuming a second. Paradigm takes 1.24s, so the old figure
      made every ordinary step look late and printed every room twice.
      "tuning.walk.nudgeSamples" was added to your tuning file beside it.'
    actionsFamilied:
      'What can be done with a carried thing is a family of controls now, not one: {file} had a
      rewrite naming "{action}", which since the change draws nothing at all, and it now names
      "{action.toggleEquip}". "{action.drop}" puts the thing down beside it.'
    lightWaitStated:
      'A walk into a room too dark to see in now waits for auto-light to ready a torch and read the
      room again, instead of stopping because it cannot tell where the character is standing.
      "tuning.walk.lightWaitMs" was added to your tuning file: how long it waits before giving up.'
    replanDriftStated:
      'Pressing Walk on a plan you drew before the character moved now redraws the plan from where
      it is standing and walks it, instead of refusing because the route does not start here. Past
      ten rooms of drift, or where the new way asks for something the old one did not, the new plan
      comes back for you to read. "tuning.walk.replanDriftSteps" was added to your tuning file.'
    stepNudgeStated:
      "A walk that has sent a step and heard nothing now asks the realm for a prompt after a
      second rather than waiting out the whole deadline. The interval was written into your
      tuning file, beside the walk's other figures."
    profilesFolded:
      many:
        '{count} character files moved into directories of their own, so each can carry loops of its
        own.'
      one: 1 character file moved into a directory of its own, so it can carry loops of its own.
    trapRest:
