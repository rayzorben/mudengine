    refusalNotBought: '{item} was not bought: {why}'
    refusalNotHunted: 'Could not go hunting for {item}: {why}'
    refusalHuntStopped: The hunt for {item} stopped before you had one.
    refusalHandoverUnanswered: '{item} was asked for, and the inventory check after it does not show
