      pacingWindowLabel: In Flight
    loading: Reading the options file…
    movement:
      advancedWalking: walking, and staying connected
      clearRouteLabel: Route Timeout (sec)
      idleAfterLabel: Anti-Idle Interval (sec)
      idleCommandLabel: Anti-Idle Command
      idleCommandPlaceholder: l
      idleEnabled: Enable Anti-Idle (Prevent Disconnect)
      loopsNote: Every character can walk these, on any realm. A realm's own loops go on its page,
        and a character's on its own page.
      onEnterHint: What the client asks the game once when you enter the realm. Each one is a
        command sent, so keep the list short. On GreaterMUD, `abil` fills in the quest book with the
