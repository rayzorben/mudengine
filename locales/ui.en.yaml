# The bento cards, by card; cards.titles is the vocabulary the rail and picker share.
# The words a listing the console draws itself uses: column names for a
# table's first row, the coins' names, and the few states a row can be in.
# The realm's own words -- an item's name, a slot, a title -- are never here.
rewrites:
  labels:
    n: '#'
    item: Item
    name: Name
    count: Qty
    slot: Slot
    equipped: In use
    weight: Wt
    ac: AC
    dr: DR
    min: Min
    max: Max
    damage: Dmg
    stats: AC/DR · Dmg
    kind: Kind
    price: Price
    charges: Charge
    uses: Uses
    title: Title
    alignment: Alignment
    gang: Gang
    flags: Flags
    quantity: Qty
    cost: Copper
    afford: Purse
    usable: Usable
    note: Note
    class: Class
    health: HP%
    mana: MA%
    rank: Rank
    flag: Flag
    state: State
    worn: Worn
    wearable: Wearable
    reason: Reason
    realmSlot: Slot
    speed: Speed
    strength: Str
    accuracy: Acc
    weaponType: Type
    hands: Hands
    material: Material
    minLevel: Lvl
    limit: Limit
    gettable: Gettable
    droppable: Droppable
    id: Id
    number: '#'
    effects: Effects
    effectsUnread: Unread
    value: Value
    shops: Sold at
    droppedBy: Dropped by
    short: Short
    basePrice: Base
    invited: Invited
    resting: Resting
    meditating: Meditating
    fullName: Full name
    race: Race
    level: Level
    hp: HP
    hpMax: Max HP
    manaMax: Max MA
    manaType: MA/KAI
    exp: Exp
    need: Need
    expSession: Session
    lives: Lives
    wealth: Wealth
    wealthLong: Wealth
    room: Room
    encumbrance: Load
    encumbranceMax: Max load
    encumbranceWord: Load
    rows: Rows
    first: First
    last: Last
  # One sentence per figure, read by the designer's sidebar; keyed by the
  # figure's own name, shared wherever that name is offered.
  # The heading over each list's own figures in the designer's sidebar: what
  # one row of that list is, in the words the `{for}` above it binds.
  rows:
    items: Each item
    keys: Each key
    players: Each adventurer
    members: Each member
    effects: Each effect
    shops: Each shop
    droppedBy: Each monster that drops it
  item:
    drop: Drop {itemName}
    notDroppable: The realm will not let this be put down
  fields:
    items: The rows of the listing, one per thing.
    itemCount: How many rows the listing has.
    item: The thing as the listing printed it, count included.
    name: Its name alone.
    count: How many of it, where the listing counted.
    slot: The slot the listing named it worn on.
    equipped: The listing's own note on a thing in use, such as (Head).
    worn: Whether it is in use.
    wearable: Whether this character may put it on.
    reason: Why this character may not put it on, where they may not.
    price: The realm's base price, in copper.
    charges: Uses left, where the listing counted them.
    action: What can be done with it, as controls over two cells each.
    toggleEquip: The pack card's own control; a click equips or removes it.
    drop: Puts it down; struck through where the realm will not let it go.
    weight: The realm's weight for the kind.
    ac: Armour class, from the realm data.
    dr: Damage reduction, from the realm data.
    min: The weapon's least damage.
    max: The weapon's most damage.
    damage: The weapon's damage, as least-most.
    stats: Armour's AC/DR, or a weapon's damage, in one cell.
    kind: What kind of thing the realm says it is.
    realmSlot: Where the realm says this kind is worn.
    speed: The weapon's speed.
    strength: The strength the weapon asks for.
    accuracy: The weapon's accuracy.
    weaponType: The weapon's type.
    hands: How many hands the weapon takes.
    material: What the armour is made of.
    uses: The most uses the realm records.
    minLevel: The least level the realm allows it at.
    limit: How many the realm allows to exist.
    gettable: Whether the realm lets it be picked up.
    droppable: Whether the realm lets it be put down.
    id: The realm's own number for it.
    number: The realm's row for this one, or blank where the name has several.
    effects: What the realm says it does — one row per effect, with a {name} and a {value}.
    effectsUnread: How many of its effects this client could not read.
    value: What the effect is worth, in the words its kind is stated in.
    shops: The shops known to sell it.
    droppedBy: The monsters known to drop it.
    icon: The picture for the slot it is worn on, over two cells.
    keys: The keys carried, by name.
    keyCount: How many keys are carried.
    wealth: The purse, in copper.
    wealthLong: The purse on the ladder, such as 2 gold, 3 silver.
    runic: Runic coins in the pack.
    platinum: Platinum pieces in the pack.
    gold: Gold crowns in the pack.
    silver: Silver nobles in the pack.
    copper: Copper farthings in the pack.
    encumbrance: What is carried, in the realm's units.
    encumbranceMax: The most that can be carried.
    encumbranceWord: The realm's word for the load, such as Medium.
    encumbrancePercent: The load as a percentage of the most.
    players: The rows of the roster, one per adventurer.
    title: The class and rank the roster gives.
    alignment: The alignment word the roster gives.
    gang: The gang the roster names.
    flags: The roster's status letters.
    quantity: How many the counter has.
    cost: The price in copper.
    afford: Says short when the price is more than the purse holds.
    short: Whether the price is more than the purse holds.
    usable: Why this character may not wear it, where they may not.
    note: The counter's own note on the row.
    basePrice: The realm's base price, before the counter's markup.
    members: The rows of the party, one per member.
    class: The class the listing gives.
    health: Health as a percentage, wearing the health colours.
    mana: Mana as a percentage, wearing the mana colours.
    rank: Frontrank, midrank or backrank.
    flag: The listing's status letter, such as R.
    state: The word for the status letter, such as resting.
    invited: Whether they are invited and not yet in.
    resting: Whether they are resting.
    meditating: Whether they are meditating.
    gained: What the line said was gained.
    exp: Experience after the gain.
    need: What the next level still costs.
    level: The level the client last saw.
    nextLevel: The level after it.
    expSession: Experience gained this session.
    fullName: Both names, as the stat sheet gives them.
    race: The race, as the stat sheet gives it.
    hp: Health, wearing the health colours.
    hpMax: Health at most.
    manaMax: Mana at most.
    manaType: MA for casters, KAI for monks.
    lives: Lives left.
    room: The room the client last saw.
    n: The row's place, from one.
    rows: How many rows the list has.
    first: Whether this is the first row.
    last: Whether this is the last row.
  coins:
    runic: runic
    platinum: platinum
    gold: gold
    silver: silver
    copper: copper
  shop:
    short: short
  party:
    invited: invited
    resting: resting
    meditating: meditating

cards:
  alerts:
    badge:
      critical: '{count} critical'
      kept: '{count} kept'
      warning: '{count} warning'
    columns:
      channel: Channel
      whatHappened: What happened
      when: When
    combat:
      playerAttacking: '{name} is attacking you — hanging up is penalised for five minutes'
    empty: Nothing yet.
    find: Find in the record
    # The player's own watches. `item` covers anything of that name however it
    # arrived -- lying in the room or turned up by a search, which were two
    # settings until todo 02 made the rows the only place alerts are set.
    watch:
      item: '{what} is here.'
      player: '{who} is here.'
      cash: 'Searching turned up {what}'
    party:
      memberHealth: '{name} is at {percent}%'
    realm:
      becameHostile: '{name} is in the realm — {alignment}{titleSuffix}'
      entered: '{name} entered the realm'
      seen: '{name} is in the realm{alignmentSuffix}'
    room:
      mobArrived: '{name} is in the room — {dispositionWord}'
      mobArrivedUncertainSuffix: ', by the worst of what the realm says'
      playerArrived: '{name} is in the room — {alignment}'
    session:
      dropped: The link dropped — you are out of the realm
      hungUp: Hung up for you — you are out of the realm
    severity:
      info: info
      warning: warning
      critical: critical
    tableCaption: Event & Alert Log
    title: Alerts
    vitals:
      crossing: '{label} {level}: {current} of {max}'
      # The player's own numeric watches (todo 29) -- their figure, their
      # direction, still fired on the crossing rather than on the value.
      watchHealth: 'Health {side} {mark}: now {current}.'
      watchMana: 'Mana {side} {mark}: now {current}.'
      manaLabel: Mana
    walk:
      arrived: 'Arrived at {destination}'
      arrivedSomewhere: Arrived where the route ended
  hunting:
    title: Hunting Grounds
    caption: Every lair the exits reach, priced for this character, best first
    find: Find a lair or a room
    none: No lair the client can price from here.
    loading: Pricing every lair the exits reach…
    refresh: Ask again
    from: '{count} lairs priced over {swept} rooms from {room}.'
    excluded: 'Left out: {dangerous} too dangerous, {beneath} beneath this level.'
    # The fight itself unpriced -- the rounds to kill, or the blows, unknown --
    # so the row is ordered by distance and never by what it pays.
    unpricedOne: 'The fight in one of them could not be priced; it is listed nearest first.'
    unpricedMany: 'The fight in {count} of them could not be priced; those are listed nearest first.'
    # Where the realm's own arithmetic cannot price a kill (off the GreaterMUD
    # lineage), the character's fight record does: said, with its count.
    measured: 'Kills priced from this character’s own record: {perRound} damage a round over {fights} fights, from level {level} up.'
    # Past the best few, a lair is ranked on the first estimate: its loop not
    # walked out, nothing beside it added.
    rough: rough
    roughLong: 'Ranked on the first estimate: the loop is its nearest rooms in distance order, with no lair beside it added.'
    measuring: Measuring this lair’s loop…
    columns:
      lair: Lair
      rate: Exp/h
      rooms: Rooms
      steps: Steps
      cost: Cost
    roomsCell: '{loop} of {total}'
    boss: boss
    deadly: deadly
    deadlyLong: One room of this is expected to take the whole health bar.
    ceiling: 'up to {rate}'
    unknownParts: 'Rate not known: {parts} unknown'
    unknown:
      experience: the experience
      rounds: the rounds to kill
      damage: the damage taken
      respawn: the respawn clock
      rest: the rest
      health: the health bar
      mana: the mana pool
      poison: how long its poison lasts
    afflicts:
      poison: poisons
      blinded: blinds
      held: holds
    detail:
      rate: Expected
      rateValue: '{rate} exp/h'
      ceiling: Ceiling
      spawns: Up at once
      respawn: Respawn
      respawnHours: '{hours} h'
      rounds: A kill
      roundsValue: 'about {rounds} rounds'
      openerCredited: (opener credited)
      cost: A room costs
      costValue: '{hp} hp ({share} of the bar), up to {worst} hp ({worstShare}) at its worst spawn'
      costAtLeast: 'at least {worst} hp ({worstShare} of the bar) at its worst spawn; a spawn’s rounds to kill are unknown'
      walk: The walk
      walkValue: '{steps} steps round, {ms} ms a step'
      heal: Recovery
      healValue: '{casts} heals a cycle, quicker than resting'
      poison: Poison
      poisonValue: 'no cure, so {seconds}s standing before a rest'
      poisonUnknown: no cure, and the realm states no length for it
      cycle: A cycle
      cycleValue: 'fight {combat}, rest {rest}, walk {walk}, wait {wait}'
      # A caster's cycle also sits to get its mana back, and that time is in
      # the rate. Drawn only where the character actually casts -- `meditate 0`
      # on every melee character would be noise (todo 26).
      cycleMeditate: ', meditate {meditate}'
    mobFigures: '{exp} exp · {rounds} rounds · {perRound} hp/round'
    # A monster the realm gives a clock of its own is standing in the lair on
    # only some laps, and its experience is weighed by how often -- so the
    # figure beside it is not what a lap pays. Said out loud rather than left
    # to be inferred from a rate that does not match the list.
    mobClock:
      many: 'back every {hours} hours'
      one: 'back every {hours} hour'
    roomFigures: '{map}/{room} · {steps} steps'
    fillerFigures: '{map}/{room} · +{detour} steps'
    fillerHead: Also on the way, while the clock runs
    moreRooms:
      many: 'and {count} more rooms hold this lair'
      one: 'and {count} more room holds this lair'
    walkThere: Walk there
    loopIt: Loop it
    createLoop: Create loop
    oneRoomNoLoop: One room is a place to stand, not a loop
    loopName: 'Hunt: {area} ({mob})'
    copyRow: '{mobs}: {rate} exp/h, {rooms} rooms, {steps} steps'
  quests:
    anyOf: Any one of
    # What every way into the place a step happens, or a thing is got, demands
    # be carried — the realm's own item gates on the corridors in. A frontier
    # with two doors is drawn `or`, because either one opens it.
    approach:
      or: or
      title: What every way into this place demands you carry
      verb: Way in wants
    badge:
      many: '{count} quests'
      one: '{count} quest'
    # Why a quest is drawn sunk and quiet: what shuts this character out of the
    # step they would take next, worded as `gate.*` words the same gates. Two
    # titles, because a level is a rung they climb and a class, a race or a
    # counter already spent is not.
    bar:
      counter: has started {names}
      klass: '{names} only'
      level: needs level {level}
      race: '{names} only'
      title: 'Not for this character: {reasons}'
      titleYet: 'Nothing to do here yet: {reasons}'
    bring:
      carry: Carry
      # Why one row says Carry and the next Hand over, which is the realm's own
      # distinction and reads as an inconsistency without it: `checkitem` wants
      # the thing on you and gives it back, `takeitem` keeps it.
      carryTitle: Carried, and kept — the step checks for it and does not take it
      hand: Hand over
      handTitle: Given up — the step takes it from you
      # Whether the thing is already in the pack. Drawn only where a listing
      # has been read: an unlisted pack is not an empty one, so a row nobody
      # has looked at says neither.
      held: In your pack
      missing: Not in your pack
    caption: The realm’s quests
    columns:
      exp: Exp
      hide: Hide
      level: Level
      quest: Quest
    copyRow:
      many: '{name} ({id}) — {stepCount} steps, {exp} exp'
      one: '{name} ({id}) — {stepCount} step, {exp} exp'
    # The quest counter's own ability number, spelled the way `abil` spells one
    # — `PhoenixQuest(133)` — rather than the `#642` an item or a monster row
    # is drawn with. It is the number the server's own listing prints.
    counter: '({id})'
    counterTooltip: The ability number the realm counts this quest with, as abil prints it
    # The walk a step's several items add up to, solved by main from where the
    # character is standing (todo 01). The realm states a step's items in the
    # order its own opcodes run, which is nobody's walk.
    errand:
      again: Again from here
      againTitle: Work the order out again from where this character is standing now
      head: 'Best order from {place}'
      # The last leg. "Then back to" and not "return": the step is somewhere you
      # go, and two of them are places you have never been before.
      home: then back to
      leg:
        many: '{moves} moves'
        one: '{moves} move'
      # A step that wants more things at once than the solver will weigh. The
      # order is exact rather than greedy, so the work is exponential in them.
      noStop: '—'
      noWay: The realm places none of these anywhere this character can walk to.
      stop: '{place} — {moves} moves from the stop before it'
      title: The shortest walk through one place for each of these and back, priced for this character
      tooMany: 'This step wants {items} things at once, which is more than the order can be worked out for.'
      total:
        many: '{moves} moves'
        one: '{moves} move'
      # The two admissions a row can carry instead of a number. They are
      # different and the second is the one somebody can act on.
      unplaced: The realm does not say where this one is
      unreachable: There is no way from here to where this one is
    find: Find a quest, a person, a word to say
    flag:
      needs: at {rank}
      sets: to {rank}
      step: '{from} → {to}'
      title: The quest counter this step moves, as the realm counts it
    gate:
      abilityAbsent: never started {name}
      abilityAny: has {name}
      abilityAtLeast: '{name} at {rank} or more'
      abilityAtMost: '{name} at {rank} or less'
      abilityExact: '{name} at exactly {rank}'
      alignmentBetween: alignment {low} to {high}
      alignmentEvil: alignment {value} or higher
      alignmentGood: alignment {value} or lower
      item: carrying {name}
      itemAbsent: not carrying {name}
      klass: '{name} only'
      levelAtLeast: level {level}+
      levelAtMost: level {level} or under
      levelBetween: level {min}–{max}
      lives:
        many: '{count} lives or more'
        one: '{count} life or more'
      price: costs {amount}
      skill: rolls {stat} against {value}
      race: '{name} only'
      spell: under {name}
    gives: Gives
    # The book's three shelves, in reading order. One word each, because a
    # head is a label; the sentence is its hover text. `Shut` rather than
    # `Not yet`: a class or a race is never a yet, and the row's own tooltip
    # says which kind of shut it is.
    group:
      barred: Shut
      barredTitle: What the realm's gates shut this character out of; each row says why
      done: Done
      doneTitle: Every step of these is behind this character
      open: Open
      openTitle: What this character can get on with, started or not
    hideHidden: Hide them again
    hideOne: Hide {name}
    none: This realm scripts no quests the client can read. A realm converted before quests were
      indexed states none until it is converted again.
    # The plan to one step: the steps still to do to reach it, from where the
    # character stands — steps, never rooms. `by.*` is how each item is got,
    # split around the realm names that are controls; `snag.*` is what the
    # realm states would stop it being carried unattended.
    plan:
      back: Back to the steps
      blocked: Blocked
      button: Plan it
      buttonTitle: The steps still to do to reach this one, from where this character stands
      count: '×{count}'
      by:
        ask: ask
        at: at
        buy: buy at
        carried: in your pack
        detour: '{moves} out of the way'
        price: '{copper} copper each'
        earlier: from step {rank}
        kill: kill
        say: say {word}
        sold: sold at {shops}
        unplaced: nowhere the realm names
      # What the plan's counters cost, and where the cash comes from (todo 00).
      cash:
        owed: 'costs {owed} copper'
        owedAtLeast: 'costs at least {owed} copper'
        inPurse: in the purse
        purseUnread: purse not read
        fromBank: '{short} from {bank}'
        fromBankTitle:
          'The purse holds {purse}; the run withdraws the rest at {place}, which last said {held}.'
        short: the purse and the banks on record hold too little
        shortTitle:
          'The purse holds {purse} and no bank on record holds the rest. Ask a bank for its balance
          to put it on record.'
      fromNowhere: from nowhere the client can place
      fromRank: from rank {from}
      fromStart: from the start
      fromUnstated: from the start, with no rank stated — type abil for the realm's count
      get: Get
      head: Plan to rank {to}
      headUnranked: Plan
      # A rejected ask, in the error's words: not work in progress, and not a
      # realm with no plan.
      failed: 'The plan could not be worked out: {reason}'
      loading: Working the plan out…
      noAct: nothing the client can tell you to do here
      none: The realm has no plan for this step.
      nothing: Nothing left to do to reach this step.
      routeTo: Route to
      # A step that rolls (todo 106): said as a chance where the sheet gives one.
      roll: 'may fail — rolls {stat} against {value}'
      rollChance: 'may fail — rolls {stat} against {value}, about {chance}% a try'
      rollTitle: 'A testskill roll: the stat less the value, clamped to 2–98, against 1–100. Run it asks again while it fails.'
      # The run of a plan (todo 102): the press, its refusal, and the
      # progression the runner publishes -- in the track's own three words.
      run: Run it
      runTitle: Carry this plan step by step, from where this character stands
      runStop: Stop
      runStopTitle: Stop the run, and everything it started
      runStarting: Starting…
      runRefused: 'Not run: {reason}'
      runNow: 'Running: {detail}'
      runNowQuiet: Running
      runDone: 'Done — {reason}'
      runStopped: 'Stopped — {reason}'
      runTries: 'roll {tries}'
      snag:
        corridor: '{spell} ×{rooms} · run through'
        corridorOpen: '{spell} ×{rooms} · run through, and the way out is past this leg'
        corridorOpenTitle: This leg ends inside it, so the count is to the leg's end and the next leg does not carry it.
        corridorTitle: 'The way in puts {spell} on you for {ticks} ticks, and then {then}: cross the {rooms} rooms without stopping'
        corridorTitleShort: 'The way in puts {spell} on you: cross the {rooms} rooms without stopping'
        hazard: '{spell} ×{rooms}'
        hazardMoves: '{spell} ×{rooms} · may move you'
        hazardNeeds: 'A spell the rooms on the way cast; stopped by carrying {needs}'
        hazardSafe: '{spell} ×{rooms} · safe with {item}'
        hazardSafeTitle: 'A spell the rooms on the way cast; {item} stops it, and the plan has one'
        hazardTitle: A spell the rooms on the way cast, which nothing carried stops
        hazardUnread: '{spell} ×{rooms} · effect unread'
        hazardUnreadTitle: The realm's script for this spell has a step the client cannot follow, so it cannot say what the rooms do to you.
        unplaced: '{item}: nowhere known'
        unreachable: No way there
      stops: 'for the {spell} on the way'
      unpriced: Unpriced
      untraced: The realm traces this step to nobody, nowhere and no death, so there is no act to plan.
      untracedTarget: The step itself is traced to nobody, nowhere and no death; the plan stops at the rank before it.
    progress:
      clear: Not started
      done:
        many: '{done} of {total} steps done'
        one: '{done} of {total} step done'
      fromRealm: Steps done, counted by the realm itself
      fromWatching: Steps this client watched you take; type abil for the realm's own count
      fromYou: Steps you have said are done
      mark: Say this quest is done through rank {rank}
      realm: From abil
      realmAt: From abil at {time}
      unmark: Say this step is not done yet
      watched: Watched, not counted
    reward:
      ability: '{name} to rank {rank}'
      abilityAdd: '{name} {amount}'
      alignment: alignment {amount}
      coins: '{amount} {coin}'
      exp: '{amount} exp'
      lives:
        many: '{count} lives'
        one: '{count} life'
      spell: teaches {name}
      # The verb alone, drawn before the spell's name, which is a lookup
      # control of its own. `spell` above is the same sentence as one string,
      # for the copy text and the find field.
      spellVerb: teaches
    showHidden: Show {count} hidden
    showOne: Show {name} again
    side:
      any: Anybody
      evil: Evil
      good: Good
      neutral: Neutral
    source:
      # The three acts a script hands a thing over for. The verb, the place
      # word and the words to say are drawn apart from the names because a
      # name is a lookup control and a room is a walk, and `kill` and `in` are
      # neither. An ask names no place: the asker is the place.
      askVerb: ask
      forWord: for {word}
      inWord: in
      killVerb: kill
      mobsVerb: dropped by
      sayWord: '“{word}”'
      shops: sold at {names}
      step: from step {rank}
    step:
      ask: ask {who} {word}
      # A step the realm scripts onto a room: the phrase is typed there, at
      # nobody. `doVerb` is the word drawn before it, as `verb` is for an ask.
      doHere: do {word} there
      doVerb: do
      # A step a monster's death hands over: nothing is said, so there is no
      # word and no asker — `kill` is the whole sentence for the copy text,
      # `killVerb` the word drawn before the monster's own lookup control.
      kill: kill {who}
      killVerb: kill
      orSay: or {words}
      verb: ask
      walkTo: Walk to {place} — {room}
    title: Quest Book
  banks:
    badge: '{count} banked'
    copper: '{copper} copper coins (cc)'
    copyRow: '{name}: {copper} copper coins (cc)'
    none: No balance on record. Send 'bank' to query vault.
