      'Going hunting: {room} — {steps} steps away, which is a journey, for about {rate} experience
      an hour.'
    movingOn:
      '{loopName} is paying {here} an hour; {mob} is worth about {rate}, so that is where this
      character is going.'
    refusalLoop: 'Could not start {loopName}: {why}'
    refusalNoRate:
      'Nothing within reach has a rate worth walking to, above the {floor} an hour this character
      asks for.'
    refusalNoRooms: The best lair within reach names no room to stand in.
    refusalNoRoute: 'No route to {room}: {why}'
    refusalNothingReachable: Nothing within reach is worth hunting.
    refusalNotReached: 'Did not reach {room}: {why}'
