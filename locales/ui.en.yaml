    whyHealth: health at {percent}
    whyMana: mana at {percent}
    whyAttackers: '{count} attackers'
    whyCompany: Player present in room (PvP abort)
    whyPvp: '{attacker} attacked you'
    # Todo 818: a monster's row says to escape it, or to hang up on it.
    whyDreaded: '{mob} is here, and its monster rule says to run'
    whyStalker: '{mob} is here, and its monster rule says to hang up'
