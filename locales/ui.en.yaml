    removePlayerTitle: Take every permission back off {name}
    remoteControlNote:
      Answers @health, @do, @join, @forget, @get-all, @party, @wait and @ok on its own;
      every other @ command is read and reported, never answered.
    replyRoutingNote: The answer goes back the way the question came — ask by telepath to be answered.
  party:
    assistHint:
      Swing at what the leader — whoever this character follows — was last seen hitting, while it
      is still in the room. Never a player; still under the combat health floor.
    assistLabel: Auto-Assist Leader
    blessingsMoved:
      Blessing the party lives on the Spells tab now — one list for self and party, in priority
      order, recast on wear-off events with a clock behind them.
    defendHint:
      Swing at a monster seen attacking any party member, while it is still in the room. The fight came to the
      party, so it fires whatever Attack Target Selection says. Never a player.
    defendLabel: Auto-Defend Party
    legend: Following
    remotesLegend: Party @ commands
    remotesNote:
      What anybody who has **joined** this party may ask this character for. An invitation
      nobody accepted is not membership, and a Deny on somebody by name still beats this.
    remotesOffWarning:
      Answering @ commands is off for this character, so nothing here is answered yet. The
      switch is on the Remotes page.
    restHint: Out of combat only, like every rest. Meditates only for a class with mana.
    restLabel: Rest With Leader
    warning:
      Whether the realm's command window is per connection or per host is unmeasured. These make
      a second automated character useful; turning them on is choosing to run that experiment.
  profile:
    accentLabel: Colour
    autoConnectLabel: Connect on Start
    autoReconnectHint:
      Only for a connection that was lost. Pressing Disconnect, hanging up on low health or
      leaving the realm yourself all stop it. Waits 0s, 5s, 10s, then 15s.
    autoReconnectLabel: Reconnect if the Connection Drops
    copyFromHint: Everything but the name and password — a starting point, not a link to later changes.
    copyFromLabel: Copy From
    copyFromNone: Nothing — start empty
    encodingHint:
      CP437 unless you know the realm has moved on — its banners are block glyphs that are
      not valid UTF-8.
    encodingLabel: Encoding
    hostLabel: Host
    hostPlaceholder: paramud.mudinfo.net
    idHint:
      Letters, numbers, - and _ — names the file, the log and the tab, separate from the display
      name.
    idLabel: File Name
    idPlaceholder: thorn
    manageRealms: Manage realms…
    namePlaceholder: Thorn the Unready
    passwordHint: Kept in this character’s own file, and never shown back.
    passwordLabel: Password
    passwordPlaceholderSet: •••••••• — leave blank to keep it
    passwordPlaceholderUnset: none set
    playsOnElsewhere: Somewhere else — type the address
    playsOnLabel: Plays On
    portLabel: Port
    themeInherit: As set in MudEngine
    themeLabel: Theme
    themeSystem: Follow the system
    usernameLabel: Username
  realms:
    confirmRemove: Remove this realm?
    databaseBrowse: Browse…
    databaseClear: Clear
    empty: Choose a realm, or add one.
    loginLegend: Login Menus
    loginNote:
      When the realm prints the text on the left, the client sends what is on the right. Leave
      the answer blank to send a bare Enter, which several menus want.
    loopsNote:
      Every character that plays here can walk these, without being told to. A character may
      add loops of its own on its own page.
    nameHint: What your characters call this realm. Renaming it moves every character that plays here.
    nameLabel: Name
    namePlaceholder: Paradigm Game 1 PVE
    new: + New realm
    removed: Realm removed.
    saved: '{realmName} saved.'
    stepSendPlaceholder: '1'
    stepWhenPlaceholder: Please select a realm
    submit: Add realm
  sections:
    character: Character
    login: Login
  spells:
    addBlessing: Add a blessing
    blessingDownAria: Move blessing {number} down
    blessingDuplicate:
      An earlier row already casts this spell at this target — only that one is kept when this
      saves.
    blessingDownTitle: Lower priority
    blessingFallback: Recast After, s
    blessingFallbackAria: Blessing {number} fallback seconds
    blessingInCombat: In Combat
    blessingMinMana: Not Below Mana %
    blessingMinManaAria: Blessing {number} mana floor %
    blessingOverHeal: Before Healing
    blessingSpellAria: Blessing {number} spell
    blessingTargetAria: Blessing {number} target
    blessingTargetParty: Party
    blessingTargetSelf: Self
    blessingUpAria: Move blessing {number} up
    blessingUpTitle: Higher priority
    blessingsLegend: Auto-Buff / Blessings
    blessingsNote:
      Spells the client keeps active for you. When the game says one has worn off, it is cast
      again straight away. The top of the list is cast first, and blessings on yourself always
      come before ones on the party. A blessing on a party member recasts on its own timer,
      because its wear-off shows on their screen, not yours.
    notifyWearOffLabel: Notify Caster on Buff Wear-Off
    notifyWearOffHint:
      When a party member's blessing on this character wears off, telepath them @bless-expired so
      their client recasts at once instead of on its clock. Both ends must run mudengine.
    cureBlindnessLabel: Cure Blindness Spell
    cureDiseaseLabel: Cure Disease Spell
    cureLegend: Cures
    cureNote: Cast the moment the game says you are blinded, poisoned or diseased, and again after
      thirty seconds if it still shows. A blank field does nothing. A field is greyed out when
      your spellbook has nothing that cures it.
    curePoisonLabel: Cure Poison Spell
    cureHint: The spell to cast when this lands on you. Blank does nothing.
    cureClosedHint: Your spellbook has no spell that cures this, so there is nothing to cast.
    bookUnreadNote:
      This character's spellbook hasn't been read yet. The client reads it automatically the
      next time the character logs in; until then these fields can't suggest anything.
    pickerPlaceholder: search spells
    removeBlessingAria: Remove blessing {number}
    removeBlessingTitle: Remove
    areaCastHint:
      Cast bare — c <spell>, no target — when the fight is crowded enough. Refused while a monster the realm
      calls good stands in the room, because an AE spell hits everything there.
    areaCastLabel: Area Effect (AE) / Room Spell
    areaMinManaHint:
      The AE spell is the expensive one, so its floor is the higher of this and the ordinary mana floor. 0
      defers to that floor alone.
    areaMinManaLabel: AE Spell Min Mana %
    areaMinMobsHint:
      Targets at or above which the AE spell is chosen — what is in this fight or would join
      it, never a shopkeeper.
    areaMinMobsLabel: AE Min Targets
    castHint:
      Sent as c <spell> <target> on the mid-round tick. The whole name — the realm matches on a
      prefix.
    castLabel: Combat Spell (Round Spell)
    healBelowInCombatHint:
      A separate floor while fighting. 0 uses the one beside it for both; set it lower so a scratch
      does not cost a round.
    healBelowInCombatLabel: Heal In Combat Below %
    healBelowLabel: Heal If Below HP %
    healHint: Cast on this character, bare. Only spells the realm lets you cast on yourself are offered.
    healLabel: Self Healing Spell
    healLegend: Healing
    healNoSelfCast: The realm says this spell cannot be cast on yourself.
    healNoPartyCast: The realm says this spell cannot be cast on another character.
    healParty: Auto-Heal Party Members
    healPartyHint: A member the roster has not listed has no health to read, and is never healed on a guess.
    healPartyWithHint:
      Cast on the member who is hurt. Only spells the realm lets you cast on another character
      are offered.
    healPartyWithLabel: Party Healing Spell
    healToHint: Keep healing that target until it is back to this. 0 casts once at the threshold.
    healToLabel: Heal Up To HP %
    legend: Attack Spell
    minManaHint: Falls through to the round attacks below this. 0 always casts.
    minManaLabel: Not Below Mana %
    note: Buffs, heals and everything conditional are automation.rules in the options file.
    rulesPointerNote:
      One cast, chosen by a number, on the mid-round tick — which is the one thing about
      a spell a rule cannot express. Everything else a caster wants is automation.rules.
  tabs:
    alerts: Alerts
    combat: Combat
    health: Health
    movement: Movement
    party: Party
    remotes: Remotes
    spells: Spells
    talk: Talk
  talk:
