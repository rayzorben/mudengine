# Every word the client's chrome shows, in one place.
#
# Components look these up with t('section.key') — see src/shared/i18n.ts.
# The rules for the words themselves are docs/terminology.md: labels of at
# most four words, one-sentence tooltips, the realm's own vocabulary for
# anything the realm names, MegaMUD's words where a player already has them,
# and one word per thing (a synonym is a bug).
#
# {name} is a placeholder the code fills in at render time. Some strings are
# asserted verbatim by scripts/smoke.mjs — check before rewording.
#
# src/shared/__tests__/i18n-coverage.test.ts fails the build for a key used
# in code but absent here, and for a key here that nothing reads.
# The client itself: window title, the error boundary, running twice.
app:
  supplies:
    invalidList: The supplies list could not be read, so nothing was saved.
  automation:
    unknownSwitch: Unrecognized automation switch.
  config:
    reloadFailed: 'Options not reloaded: {error}'
    internalTemplateAdded: 'Added to internal.yaml, from the template: {added}.'
    templateAdded: 'Added to your options file, from the template: {added}.'
    templateReconcileFailed: 'Options file not changed: {error}'
  debug:
    noSession: There is no session to write a report for.
    realmUnknown: (not dialed)
    reportTitle: mudengine debug report
  gpu:
    softwareCompositing: The window is not drawn by the GPU (compositing {compositing},
      rasterization {rasterization}, WebGL {webgl}). Every frame is drawn in software, which is why
      typing and scrolling are slow. Check the graphics driver, or how the client was started.
  connect:
    invalidTarget: Invalid connection target.
    noCharacterFile: 'Connection failed: Character "{id}" has no realm configured.'
  crash:
    guardNotice: 'Client error encountered. Background sessions remain connected: {message}'
  dialog:
    allFilesFilter: All files
    chooseRealmTitle: Choose a world database
    realmDatabaseFilter: World database
  errorBoundary:
    body: Active character sessions are unaffected. Reload to restore the interface.
    heading: UI Rendering Error
    reload: Reload window
  instance:
    alreadyRunning: This profile is already running. Switched to existing window.
    homeHeld: '{home} is already in use by another mudengine (pid {pid}). Two clients sharing one
      home write the same files and connect the same characters. Stop the other one first, or delete
      {file} if it is not running.'
    staleLock: Took over the lock left by pid {pid}, which is no longer running.
  loop:
    invalidName: Invalid path/loop name.
    invalidLoop: Invalid loop definition.
    invalidPicks: The loop builder sent something other than a list of up to {max} rooms.
    notFound: No loop named {name} in this character's options.
    unknownScope: Invalid loop scope.
  onboarding:
    noCharactersYet: No characters are set up yet, so settings opened on a new one. Ctrl/⌘ , reopens
      it. Nothing connects until a character exists.
  profiles:
    fileGoneStillConnected:
      The file for "{id}" is gone, but the character is still connected. Disconnect to
      close it.
    incompleteDraft: 'Character setup incomplete: a realm is required.'
    invalidId: A character's file name may only use letters, numbers, - and _.
    loadFailed: 'Character not loaded: {error}'
    noSuchCharacter: No such character.
    stillConnected: '{name} is still connected.'
  quit:
    cancelButton: Cancel
    confirmButton: Quit and disconnect
    consequenceDetail: Quitting disconnects them. On a PvP realm, hanging up at the wrong time can
      cost items, or the character.
    dialogTitle: Quit mudengine
    whoIsConnected:
      many: '{count} characters are still in the realm: {names}.'
      one: '{name} is still in the realm.'
  remotes:
    invalidName: Unrecognized remote (@) command.
  route:
    invalidPayload: Invalid route.
    noRealmData: No world data loaded
    unknownRoom: Current room unknown. Move or look so the client can find the character.
  servers:
    invalidDraft: A realm needs a name, a host and a port between 1 and 65535.
    noSuchServer: No such realm.
  session:
    notConnected: Not connected.
  settings:
    invalidGlobalDraft: Invalid settings payload.
  window:
    createFailed: Could not open a window.
    noMainWindow: There is no main window to move it to.
    noSecondWindow: This client is running in a browser tab, which cannot open a second window for a
      character.
    nothingToGather: Nothing to gather.
    onlyCharacterHere: That is the only character in this window.
    unknownCaller: Unknown calling window.
  home:
    outside: That path is outside the client's home folder, so it was not listed.
    unreadable: '{path} could not be listed: {message}'
  clipboard:
    none: This host has no clipboard, so the window keeps its own.
  markTooltip: '{name} {version}'
  markVersion: v{version}
  windowTitle: mudengine
# Lines the client itself prints into the terminal or pushes as one-off notices.
notices:
  config:
    servers:
      noHost: '{file} does not name a host, so it is not a realm'
      readError: '{file} could not be read: {message}'
  desktopAlerts:
    refused: Desktop notifications are on, but this system blocks them. Nothing will show outside
      the window until they are allowed.
    title: '{name}'
    unavailable: Desktop notifications are on, but nothing here can show them. Alerts are still kept
      on the Alerts card.
    untitled: MudEngine
  migration:
    talkHold: The Talk card now holds its place for 45 seconds after you scroll, instead of 15.
      {file} was updated to match.
    hunting: Auto-Hunt is now a setting, off by default. It was added to {file} with a comment
      explaining it.
    toolbarGainedBack: The toolbar has a Back button. Each press walks one room back the way the
      character came. It was added to the toolbar in {file}, along with how far back it can go.
    oneTransportButton: The toolbar's three movement buttons are now one play/stop button for
      whichever route or loop is active. {file} was updated to match, including the distance at
      which play asks before walking a character back.
    lightStated:
      one: 'Lighting a torch before entering a dark room is now a setting, on by default. It was
        added to {count} file with a comment explaining it: {fileList}'
      many: 'Lighting a torch before entering a dark room is now a setting, on by default. It was
        added to {count} files with a comment explaining it: {fileList}'
    suppliesStated: 'A supplies section was added to {file}: the items a character keeps in stock
      and where it buys them. It is empty, so nothing changes until you add an item.'
    conditionWaitsStated:
      one: 'Whether a route or a loop walks on while blind, poisoned or confused is a setting per
        condition, off by default. {keys} was written into {count} file with the paragraph that
        explains it: {fileList}'
      many: 'Whether a route or a loop walks on while blind, poisoned or confused is a setting per
        condition, off by default. {keys} was written into {count} files with the paragraph that
        explains it: {fileList}'
    keyPickupStated:
      one: "Picking up a key that one of the room's exits needs, when it is on the floor, is now a
        setting, on by default. It was added to {count} file with a comment explaining it:
        {fileList}"
      many: "Picking up a key that one of the room's exits needs, when it is on the floor, is now a
        setting, on by default. It was added to {count} files with a comment explaining it:
        {fileList}"
    anonymousConnectionDropped: 'The account and "connect on launch" settings under connection: were
      removed from {file}. The client no longer connects without a character, and each character''s
      file holds its own account.'
    bankAskedOnEntry:
      many: '`bank` was added to the login commands in {count} files, before the final look. Bank
        balances are now kept between sessions, and this checks the balance once as you enter the
        realm. {fileList}'
      one: '`bank` was added to the login commands in {count} file, before the final look. Bank
        balances are now kept between sessions, and this checks the balance once as you enter the
        realm. {fileList}'
    blessingsKeyedOnSpell:
      many: Each bless row is now named by its spell alone, and only party rows have a recast timer.
        A bless on yourself is recast when the game says it has worn off, with a backup timer based
        on your own casts. {count} files were updated. {fileList}
      one: Each bless row is now named by its spell alone, and only party rows have a recast timer.
        A bless on yourself is recast when the game says it has worn off, with a backup timer based
        on your own casts. {count} file was updated. {fileList}
    blessingsMerged:
      many: Buffs and party blesses are now one list, spells.blessings. Each is recast when it wears
        off, with the old interval kept as a backup timer. {count} files were updated and their rows
        carried over. {fileList}
      one: Buffs and party blesses are now one list, spells.blessings. Each is recast when it wears
        off, with the old interval kept as a backup timer. {count} file was updated and its rows
        carried over. {fileList}
    charactersMoved: Characters moved from {from} to {to}.
    conversationLogKept: The Talk card's history is now saved to disk and restored when the client
      starts. Two settings, whether to keep it and for how many days, were added to your options
      file with a comment explaining them.
    entityPredicates:
      many: 'Three settings were added to {count} files, all off: pick up anything worth more than a
        set value, never pick up anything heavier than a set weight, and drop items the world data
        values at nothing. These became possible once items carried their own entry from the world
        data. {fileList}'
      one: 'Three settings were added to {count} file, all off: pick up anything worth more than a
        set value, never pick up anything heavier than a set weight, and drop items the world data
        values at nothing. These became possible once items carried their own entry from the world
        data. {fileList}'
    gmudRealmFailed: 'The {realm} realm could not be removed from your realms: {reason}'
    gmudRealmRemoved: '{realm} no longer ships with the client and was removed from your realms
      ({dir}). No character was playing on it. The six Paradigm realms are unchanged, and a new
      character now starts on the realm the built-in map came from.'
    healSplit:
      many: 'Healing now uses two spells: one cast on this character and one cast on a party member,
        because the game marks which spells can be cast on whom. `healPartyWith` and a `healTo`
        limit were added to {count} files. Files that already healed the party kept their spell.
        {fileList}'
      one: 'Healing now uses two spells: one cast on this character and one cast on a party member,
        because the game marks which spells can be cast on whom. `healPartyWith` and a `healTo`
        limit were added to {count} file. A file that already healed the party kept its spell.
        {fileList}'
    lookNoLongerBroadcast:
      many: The client no longer uses `l` to re-read a room, because it shows the same text and
        tells everyone in the room you are looking around. A bare Enter does the same thing quietly,
        so the idle command and the final look on entering the realm were changed in {count} files.
        {fileList}
      one: The client no longer uses `l` to re-read a room, because it shows the same text and tells
        everyone in the room you are looking around. A bare Enter does the same thing quietly, so
        the idle command and the final look on entering the realm were changed in {count} file.
        {fileList}
    loopShelfPinned: A Loops button was added to your toolbar. It opens every loop the client knows.
      You can also press Ctrl/Cmd L, or the circular arrow next to the play controls.
    tuningKeysChanged: 'Your internal.yaml was updated: added {added}; removed {removed}. The values
      are the defaults, so nothing behaves differently. They are just in the file you edit now.
      {file}'
    tuningNothingAdded: nothing
    tuningNothingRemoved: nothing
    autoReconnectStated:
      many: '"Reconnect if the connection drops" was added to {count} character files, turned on,
        with a comment explaining it. This is what they were already doing. {fileList}'
      one: '"Reconnect if the connection drops" was added to {count} character file, turned on, with
        a comment explaining it. This is what it was already doing. {fileList}'
    newAutomationStated:
      many: 'New settings were added to {count} files with comments explaining them: dropping junk,
        depositing cash at the bank, defending the party, the area spell, and what to do when a
        player attacks. All are off, which matches what the client was already doing. {fileList}'
      one: 'New settings were added to {count} file with comments explaining them: dropping junk,
        depositing cash at the bank, defending the party, the area spell, and what to do when a
        player attacks. All are off, which matches what the client was already doing. {fileList}'
    teleportStated: '"automation.safety.fleeGoto" was added to {file}, turned off. It is a
      last-resort teleport used after Auto-Run. The command is set per realm, on the realm''s
      settings page.'
    markStated: '"ui.showLogo" was added to {file}, turned on. The client shows its logo at the top
      of the card rail. Turn it off there, or on the MudEngine settings page.'
    alertRowsBecameEvents: Alert rows in {count} file(s) ({fileList}) now name events instead of
      channels. A channel only said what kind of thing a row was about, not what happened. Channel
      rows were moved to the closest event ({pairs}), which is narrower than a whole channel, so
      check the Alerts section. Every row also got a 30-second quiet time.
    alertRowsNoChannels: no channel rows
    alertSurfaceConverted: 'The alert floor, the muted channels and the item watch list became rows
      in your own alert list, in {count} file(s). Your settings were carried over: a muted channel
      is now a row that does not alert, a watched word is an item row, and a muted notification is a
      row that still shows. {fileList}'
    alertFloorDropped: '"ui.alerts.minimum" was removed from {count} file(s). Alert levels now
      belong to each event, not each channel, so there was nothing to convert it to. Everything
      shows again unless one of your own rows says otherwise. Your rows are in the Alerts section of
      settings. {fileList}'
    desktopSwitchesBecameRows: '"ui.alerts.desktop" was removed from {count} file(s). Its two
      switches are now set on each alert row: "Notify" says whether the row shows a desktop
      notification, and "Even when MudEngine is in front" says whether it does so while you are
      looking at the window. Set them per row in the Alerts section of settings. {fileList}'
    desktopSwitchesSilenced: Notifications were turned off completely in {count} file(s), so every
      alert row there has "Notify" turned off to keep them quiet. Turn it back on for the rows you
      want to be interrupted for. {fileList}
    darkConsoleStated: '"ui.console" was added to {file}, turned on. With a light theme, the console
      keeps a dark palette, because a light palette has to turn the game''s black background white.
      Choose the dark palette or turn it off there, or on the MudEngine settings page.'
    consolePaletteStated: '"ui.console.palette" was added to {file} as "theme", which keeps the
      console you have now. Seven palettes can recolor what the game sends, four dark and three
      light. Choosing one there or on the MudEngine settings page overrides the two settings next to
      it.'
    statusLineStated: '"automation.statline" and "ui.rewrites" were added to {file}, all off. The
      first sets the status line when you log in, so every prompt shows maximum health and mana, exp
      and cash. The second lets you design your own status line and listings, drawn in place of the
      game''s. Turn them on there, or in the Rewrites section of settings.'
    rewritesGathered: '"ui.statline" in {file} became the Status line design under "ui.rewrites",
      next to the other listings the console can redraw: the inventory, the who list, a shop''s
      list, the party and the experience line. All were added, turned off. The Rewrites section in
      settings lists them.'
    rewritesListed: '"ui.rewrites" in {file} is now a list of designs. Each listing it had became
      one design, on or off as before, with its lines combined into one template, and the status
      line''s color bands now apply to the whole block. The Rewrites section in settings lists them,
      and each design opens in an editor that shows every value it can use.'
    statusLineAsksQuieted: pro and set were added to the quiet list in {file}, so the status line's
      own commands stay out of the console. Remove them there to see them.
    diagnosticsPreferenceDropped:
      many: '"ui.showDiagnostics" was removed from {count} files. The diagnostics cards are now
        hidden every time the client starts, and "Show diagnostics" in the command palette shows
        them until the window closes. {fileList}'
      one: '"ui.showDiagnostics" was removed from {count} file. The diagnostics cards are now hidden
        every time the client starts, and "Show diagnostics" in the command palette shows them until
        the window closes. {fileList}'
    combatAndPotionSettings:
      many: 'Combat and potion settings changed in {count} files. "joinFights" is now
        "politeAttacks" (MegaMUD''s name, and it works the same way). "whileWalking" is gone: routes
        and loops both fight now, and turning auto-combat off during one skips the fighting.
        "avoidUndead", "avoidDeathSpell" and the attack priority list were removed. The two named
        potion slots became rows in "potions", keeping any threshold you had set. {fileList}'
      one: 'Combat and potion settings changed in {count} file. "joinFights" is now "politeAttacks"
        (MegaMUD''s name, and it works the same way). "whileWalking" is gone: routes and loops both
        fight now, and turning auto-combat off during one skips the fighting. "avoidUndead",
        "avoidDeathSpell" and the attack priority list were removed. The two named potion slots
        became rows in "potions", keeping any threshold you had set. {fileList}'
    combatFloorDropped:
      many: '"combat.minHealth" was removed from {count} files. There is no longer a minimum health
        for starting a fight. Low health is handled by running and resting instead. {fileList}'
      one: '"combat.minHealth" was removed from {count} file. There is no longer a minimum health
        for starting a fight. Low health is handled by running and resting instead. {fileList}'
    fightCostDropped:
      many: '"combat.maxFightCost" was removed from {count} files. Fights are no longer skipped
        because of their expected cost. The Room card still shows the estimate, but nothing acts on
        it. {fileList}'
      one: '"combat.maxFightCost" was removed from {count} file. Fights are no longer skipped
        because of their expected cost. The Room card still shows the estimate, but nothing acts on
        it. {fileList}'
    recoveryBounds:
      many: '"recoverGearTries" and "recoverGearFloor" were added to {count} files. Going back for
        your gear now stops after two trips that fail to reach it, or when you are down to two
        lives. {fileList}'
      one: '"recoverGearTries" and "recoverGearFloor" were added to {count} file. Going back for
        your gear now stops after two trips that fail to reach it, or when you are down to two
        lives. {fileList}'
    alertRules:
      many: '"ui.alerts.rules" was added to {count} files with the default rows. Your own alert list
        now decides everything that is shown. {fileList}'
      one: '"ui.alerts.rules" was added to {count} file with the default rows. Your own alert list
        now decides everything that is shown. {fileList}'
    potionRules:
      many: '"automation.health.potions" was added to {count} files, empty. Name an item and a
        condition under Health to have it used. {fileList}'
      one: '"automation.health.potions" was added to {count} file, empty. Name an item and a
        condition under Health to have it used. {fileList}'
    levelling:
      many: '"automation.train.levels" and "trainer" were added to {count} files, turned off. The
        client will not walk a character to a trainer to level until you turn this on. {fileList}'
      one: '"automation.train.levels" and "trainer" were added to {count} file, turned off. The
        client will not walk a character to a trainer to level until you turn this on. {fileList}'
    doorForcingStated:
      many: Picking locks and bashing doors are now settings, added to {count} files with a comment
        explaining them. Both are off, which matches what the client was already doing. {fileList}
      one: Picking locks and bashing doors are now settings, added to {count} file with a comment
        explaining them. Both are off, which matches what the client was already doing. {fileList}
    hangPenalties:
      one: '"hangUp.onlyWhenClean" became "hangUp.penalties" in {count} file. It says whether the
        realm penalizes a hangup. The options file says no (a PvE realm), each character follows its
        realm, and Paradigm''s realm menu reports its own. Set it under Health › Auto-Hangup, or per
        realm. The backup next to each file has the old value. {fileList}'
      many: '"hangUp.onlyWhenClean" became "hangUp.penalties" in {count} files. It says whether the
        realm penalizes a hangup. The options file says no (a PvE realm), each character follows its
        realm, and Paradigm''s realm menu reports its own. Set it under Health › Auto-Hangup, or per
        realm. The backup next to each file has the old value. {fileList}'
    wardsMoved:
      many: '"automation.movement.useWards" moved to "automation.health.useWards" in {count} files
        and was turned on. It follows the game''s own item rules, like using the waterskin against
        the desert spell. It shipped turned off a day earlier, so the old "false" was the client''s
        default, not your choice. Turn it off under Health in settings. The backup next to each file
        has the old value. {fileList}'
      one: '"automation.movement.useWards" moved to "automation.health.useWards" in {count} file and
        was turned on. It follows the game''s own item rules, like using the waterskin against the
        desert spell. It shipped turned off a day earlier, so the old "false" was the client''s
        default, not your choice. Turn it off under Health in settings. The backup next to the file
        has the old value. {fileList}'
    doorsOpened:
      many: Opening and bashing doors on a route are now on by default. They were turned on in
        {count} files where they were off only because the client had written that default, not
        because you chose it. Picking locks is unchanged and still off. Turn either one off again in
        the Movement section of settings. The backup next to each file has the old value. {fileList}
      one: Opening and bashing doors on a route are now on by default. They were turned on in
        {count} file where they were off only because the client had written that default, not
        because you chose it. Picking locks is unchanged and still off. Turn either one off again in
        the Movement section of settings. The backup next to the file has the old value. {fileList}
    gearButtonPinned: A gear button was added to your toolbar, next to the connect button. It
      re-equips what the client last saw in each worn slot. Press it first after a death.
    blessSwitchPinned: An Auto-Bless switch was added to your toolbar, next to Retaliate. When it is
      off, your bless spells are not cast until you turn it back on.
    loopsRenamed:
      one: 'The loops that ship with the client now use the names their authors gave them, instead
        of the room they start in. {count} of your loops was copied from that list and has been
        renamed to match: {loopList}'
      many: 'The loops that ship with the client now use the names their authors gave them, instead
        of the room they start in. {count} of your loops were copied from that list and have been
        renamed to match: {loopList}'
    globalLoopsLifted:
      many: '{count} loops moved from the options file into {globalLoopsDir}. Every character can
        use them.'
      one: '{count} loop moved from the options file into {globalLoopsDir}. Every character can use
        it.'
    databaseZipped:
      many: 'World databases are now kept zipped: a fifth of the size, and read without unzipping.
        {count} realm files pointed to an unzipped copy that is gone, and now point to the zip file
        next to it.'
      one: 'World databases are now kept zipped: a fifth of the size, and read without unzipping. A
        realm file pointed to an unzipped copy that is gone, and now points to {file}.'
    loreRekeyed:
      many: '{count} records learned from a world database the client now includes were moved to the
        built-in world they belong to ({worlds}).'
      one: One record learned from a world database the client now includes was moved to the
        built-in world it belongs to ({worlds}).
    mapDensityStated: The Map card now has a density slider, so "view.mapRoomPixels" was replaced by
      the slider's two limits and removed from your tuning file. A value you had set there measured
      something different, so it was not carried over.
    optionsMoved: Options moved from {from} to {to}.
    spellChoice:
      one: '"automation.spells.autoChoose" was added to {fileList}, turned off. When on, it picks
        the attack spell and the cures from your spellbook each round. Until you turn it on, the
        spells you named are cast.'
      many: '"automation.spells.autoChoose" was added to {count} files ({fileList}), turned off.
        When on, it picks the attack spell and the cures from your spellbook each round. Until you
        turn it on, the spells you named are cast.'
    training: '"automation.train" was added to {file}, turned off. At a trainer with unspent CPs, it
      opens the stat screen and buys the stats set under Training, cheapest first. Nothing is spent
      until you turn it on and raise a stat.'
    restNextDoor:
      one: '"automation.health.restNextDoor" was added to {fileList}, turned on. In a lair with a
        short regen time, the character rests in a neighboring room instead, after checking that it
        is empty.'
      many: '"automation.health.restNextDoor" was added to {count} files ({fileList}), turned on. In
        a lair with a short regen time, the character rests in a neighboring room instead, after
        checking that it is empty.'
    gearRecovery:
      one: '"automation.movement.recoverGear" was added to {fileList}, turned off. After a death, it
        walks back for your gear and puts it on. Nothing happens until you turn it on.'
      many: '"automation.movement.recoverGear" was added to {count} files ({fileList}), turned off.
        After a death, it walks back for your gear and puts it on. Nothing happens until you turn it
        on.'
    accountJoinedTheScript:
      one: The username and password prompts are now login steps, so {fileList} got a row for each.
        Realms word these prompts differently, and the client used to recognize only one wording.
        Your account details stay on the character; the rows refer to them.
      many: The username and password prompts are now login steps, so {count} files ({fileList})
        each got a row for each. Realms word these prompts differently, and the client used to
        recognize only one wording. Your account details stay on the character; the rows refer to
        them.
    pagerRepeats:
      one: A login step in {fileList} answers a pager prompt ("(N)onstop, (Q)uit, or (C)ontinue?").
        A BBS shows this once per screen, not once per login, so the step is now set to "answer
        every time". It used to be answered once, and the login then got stuck at the second one.
      many: Login steps in {count} files ({fileList}) answer a pager prompt ("(N)onstop, (Q)uit, or
        (C)ontinue?"). A BBS shows this once per screen, not once per login, so each step is now set
        to "answer every time". They used to be answered once, and the login then got stuck at the
        second one.
    mobRules:
      one: '"automation.combat.mobRules" was added to {fileList}, empty. It holds one row per
        monster, saying whether to leave it alone and where it falls in the attack order. Nothing
        changes until you add one.'
      many: '"automation.combat.mobRules" was added to {count} files ({fileList}), empty. It holds
        one row per monster, saying whether to leave it alone and where it falls in the attack
        order. Nothing changes until you add one.'
    mobRulesFolded:
      one: '"automation.combat.avoid" and "combat.mobPriority" were combined into one
        "combat.mobRules" list in {fileList}. An avoided monster is now a row set to Never Attack,
        and every ranked monster kept its priority.'
      many: '"automation.combat.avoid" and "combat.mobPriority" were combined into one
