    movement: Movement
    party: Party
    remotes: Remotes
    spells: Spells
    rewrites: Rewrites
    talk: Talk
    train: Training
    gear: Gear
    quests: Quests
  # Running a quest's plan -- `automation.quests` (todo 102). One switch,
  # and the warning in the open: a run walks, buys, hunts and fights unattended.
  quests:
    legend: Quests
    warning: A run walks across the realm, buys, hunts and fights for as long as the quest takes,
      and stops only for what would stop a route. Turn it on only for a character you mean to leave
      alone with it.
    enabled: Auto-Quest
    enabledHint: Lets the Quest card's Run it button carry out a plan step by step, using walking,
      shopping and auto-combat. When off, the button refuses and names this switch.
  talk:
    legend: Other Players
    lookHint: Once per person, at an idle moment instead of the instant they arrive, and never
      during a fight. What they wear shows on their Worn tab, with the time it was seen.
    lookLabel: Auto-Look at Players
    lookWarning: A look is a command from the same budget as walking and fighting, and the game
      tells the person you looked at them.
  worldDatabaseHint: Blank uses whatever the realm calls itself at its menu, MajorMUD or Paradigm.
    Type majormud or paradigm to choose one, or point to your own .mdb, SQLite copy or .zip for a
    realm whose rooms are different.
  worldDatabaseLabel: World Database
  worldDatabasePlaceholder: 'the built-in world the realm names: MajorMUD or Paradigm'
