  deny: Deny
  denyTitle: Never answer @{remote} for {name}, whatever the gang or the party grants
  findPlaceholder: Find an @ command
  fromGang: from the gang
  fromParty: from the party
  granted: '{granted} of {total} granted'
  noMatch: No @ command matches “{query}”.
  on: 'On'
  onPartyTitle: Let anybody who has joined this party ask for @{remote}
  onTitle: Let anybody in the gang ask for @{remote}
  showAll: Show all
  showing: '{shown} of {total}'
  support:
