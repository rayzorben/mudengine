    # and says why, which is the moment a party member's `aid` is the only
    # thing that helps.
    mortallyWounded: 'Mortally wounded: the game refuses every command until this character gets up.
      Nothing is being sent. Someone in the room can aid it.'
    whyMortallyWounded: 'on the ground at {hp} health'
