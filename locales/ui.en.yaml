      many: 'Not running: {why}, but every exit ({directions}) leads back to a room just run from.
        {then}'
    escapeOnlyBackReason: every exit leads back to a room just run from
    escapeStanding: Standing and fighting.
    escapeStaying: 'Not running: {why}, but nothing is moving this character anywhere, so it stays
