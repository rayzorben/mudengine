    removeAriaLabel: Remove {loopName}
    removeTitle: Remove this loop
    scopeGlobal: every character
    scopeRealm: this realm
  # Going hunting on its own -- `automation.hunting` (todo 05). Under Movement
  # beside the loops: what it decides is a place.
  hunting:
    auto: Auto-Hunt (Find the Best Spot)
    autoHint: When there is nothing else to do, find the best hunting spot within reach, walk there,
      and loop around it. The loop is built fresh each time and never saved.
    legend: Hunting
    note: The Hunting card rates every lair the map reaches for this character. This goes to the top
      pick without a click.
    radius: Look Within (Steps)
    radiusHint: How far to look for a lair, in steps. Blank is everywhere the exits reach.
  train:
    legend: Training
    warning: A point bought here is permanent, and the screen it is bought on renames the character
      if anything else is typed into it. The client types only numbers, only into the six stat
      fields, then saves.
    stats: Auto Train Stats
    # Going to collect the level. Experience past the threshold does nothing
    # at all until a trainer is paid, so a client left overnight without this
    # comes back with a night's experience and the same character.
    levels: Go and Train Levels
    levelsHint: When you have enough exp, walk to a trainer and level. Off by default, because a
      character saving up levels for a reroll should not be leveled without asking.
    trainerLabel: Trainer
    trainerHint: Only trainers the world data says will train this character at this level. Class
      training rooms stop at level 10 and every trainer has a level range, so this list shrinks as
      the character grows.
    trainerCheapest: The cheapest that will take me
    trainerOption: '{name} — {room} ({cost} copper)'
    trainerNowhere: The world data names no trainer that will train this character at its level.
      Nothing will be walked to until one does.
    trainerStale: The trainer chosen here no longer trains this character. Pick another, or leave it
      on the cheapest; nothing will be walked to until then.
    statsHint: At a trainer with unspent CPs, opens the stat screen, buys the stats set below as far
      as the CPs go (cheapest first), and saves. When off, the client leaves that screen alone.
    wantedNote: The value each stat should reach. 0, or a value at or below the current one, leaves
      that stat alone; values above the race's maximum are capped. The first ten points above the
      race's base cost 1 CP each, the next ten 2 each, and so on.
    strength: Strength
    intellect: Intellect
    willpower: Willpower
    agility: Agility
    health: Health
    charm: Charm
  movement:
    provideLight: Auto-Light (Light Dark Rooms)
    provideLightHint: Lights a carried light source (a torch, a lantern, a glowing pearl, anything
      the world data counts as one) before stepping into a room the character could not see in, and
      on arriving in one. It decides from the room's light level, the race's night vision and what
      is worn. On by default.
    lightDimRooms: Light Dim Rooms Too
    lightDimRoomsHint: Also in rooms the game still describes (dimly lit, barely visible). Uses up
      the torch for comfort, not need.
    walkWhileBlind: Walk While Blind
    walkWhileBlindHint: When off, a route or loop waits until your sight returns (MegaMUD's
      IgnoreBlind default). A blind character cannot read the room it walks into.
    walkWhilePoisoned: Walk While Poisoned
    walkWhilePoisonedHint: When off, a route or loop waits until the poison wears off (MegaMUD's
      IgnorePoison default). Paralysis always stops you; a step while held is refused.
    walkWhileConfused: Walk While Confused
    walkWhileConfusedHint: When off, a route or loop waits until the confusion wears off (MegaMUD's
      IgnoreConfusion default). A confused character's commands can be ignored.
    fightOnArrival: Auto-Combat On at Arrival
    fightOnArrivalHint: Turns auto-combat back on when a route you asked for arrives, since walking
      with it off is how you travel without fighting. Loops and errands are unaffected.
    extinguishInLight: Put the Light Out in Lit Rooms
    extinguishInLightHint: Removes a lit torch in a room that does not need it, when nothing is
      moving the character, so the torch lasts through the sewer instead of burning out on the way
      there.
    recoverGear: Recover Your Gear After Death
    recoverGearFloorLabel: Keep at least (lives)
    recoverGearFloorHint: Stop going back once you are down to this many lives. Lives are limited,
      and a recovery walks a stripped character back to whatever killed it. 0 never stops.
    recoverGearTriesLabel: Give up after (tries)
    recoverGearTriesHint: How many trips in a row can fail to reach your gear before it stops
      trying. A trip that gets there resets the count. 0 never gives up.
    recoverGearHint: Walks back to the room where the character died, picks up the gear and coins
      still there, and puts the gear back on. Waits when hurt, fights nothing on the way, and
      reports every refusal.
    collectKeys: Pick Up a Key the Way Out Needs
    collectKeysHint: Only when the world data says an exit of the room needs it, your inventory does
      not show one, and it is on the floor here. A locked door with no key is a wall the router
      plans around, so this is the one time picking it up matters. On by default.
    doorsLegend: Doors
    stealthLegend: Stealth
    lightLegend: Light
    afflictionsLegend: Afflictions
    keepOutLegend: Avoiding
    keepOutOf: Places to Avoid
    keepOutOfHint: Words for a path or place, as the game writes them. A route you ask for that
      crosses one is shown next to the way around, and you choose; loops, errands and quest runs go
      around.
    keepOutOfPlaceholder: 'vortex, Negative Power Plane'
    carryLegend: What It Carries
    loopsNote: These belong to this character alone. Loops for everyone on a realm go on that
      realm's page; loops for every character go on the Global page.
    loopsWarning: These loops name rooms in the built-in world, but this character uses its own
      world data.
    bankWhichLabel: Bank At
    bankWhichHint: Which bank this character uses. Each bank keeps its own balance, so depositing at
      whichever bank you pass leaves several balances that cannot be added up. Any bank deposits
      wherever you are.
    bankWhichAny: Any bank
    bankWhichOption: '{name} — {room}'
    bankWhichStale: This realm's world data has no such bank, so nothing is deposited. Pick one from
      the list.
    bankDepositHint: At a bank with more cash on hand than the threshold, deposits everything above
      the amount to keep, then checks the balance. Never when the cash amount is unknown.
    bankDepositLabel: Auto-Deposit Coins
    bankKeepHint: What stays on hand for tolls and shops. 100 copper is 1 gold crown.
    bankKeepLabel: Cash to Keep on Hand
    bankLegend: Banking
    bankThresholdHint: Deposits only once cash on hand is over this, so a trip is not wasted on
      small change. 100 copper is 1 gold crown.
    bankThresholdLabel: Deposit When Cash Exceeds
    dropEnabledHint: Only what you list below is ever dropped, and never anything worn, wielded or
      lit. The world data does not mark quest items, so this list alone decides what is junk.
    dropEnabledLabel: Auto-Drop Junk Items
    dropItemsHint: Matched by the start of the name, the same way the game reads drop.
    dropItemsLabel: Junk Item Names
    dropItemsPlaceholder: rusty sword, torch
    dropLegend: Dropping Junk
    dropWhenEncumberedHint: Waits until the game's inventory shows your load as anything but None.
      When off, junk is dropped as soon as it is in your inventory.
    dropWhenEncumberedLabel: Drop Only When Encumbered
    lootCoins: Auto-Get Cash
    lootCoinKindsHint: Which coins are worth picking up. Cheap coins are most of what drops, and
      each pickup is a command. Unchecking all of them picks up none.
    lootCoinKindsLabel: Coins to Collect
    lootDiscardKindsHint: Which coins to drop whenever you carry any. A coin on neither list is
      kept, so you can stop picking up copper without throwing away the copper you have.
    lootDiscardKindsLabel: Coins to Discard
    lootConvertAtLabel: Convert When
    lootConvertWithHint: An item that turns small coins into large ones, like GreaterMUD's coin bag.
      The client cannot tell which item does this, so name it yourself. MajorMUD has none.
    lootConvertWithLabel: Convert Cash With
    lootGradeHeavy: Heavy
    lootGradeMedium: Medium
    lootGradeNever: Never
    lootStopAtGradeHint: Stop picking up coins once the game rates your load this heavy. The rating
      is the game's own word from your inventory.
    lootStopAtGradeLabel: Stop Collecting At
    lootMinPriceHint: Also picks up anything the world data values at or above this, in copper. 0 is
      off, and items with no value in the world data are never picked up by this.
    lootMinPriceLabel: Auto-Get Over Value
    lootMaxEncumbranceHint: Never picks up anything heavier, whatever the list says. 0 is no limit;
      items with no weight in the world data are not refused.
    lootMaxEncumbranceLabel: Max Item Weight
    dropWorthlessHint: 'Drops anything the world data values at zero: only an explicit zero, never
      an item with no value listed, and never one marked Not Droppable.'
    dropWorthlessLabel: Auto-Drop Worthless Items
    searchEnabledHint: The game hides exits, and a route may be planned through one nobody has found
      yet. Never in combat or while resting, and once per room, not once per status line.
    searchEnabledLabel: Auto-Search Rooms
    searchLegend: Searching
    searchTriesHint: Each search is a command from the same budget as fighting. Whether one search
      is enough has never been measured.
    searchTriesLabel: Searches Per Room
    lootItemsHint: Matched by the start of the name, the same way the game reads get. This does not
      check weight, value or selling.
    lootItemsLabel: Auto-Get Items List
    lootItemsPlaceholder: gem, scroll
    lootLegend: Auto-Loot
    bashDoors: Auto-Bash Doors
    bashDoorsHint: Forces the door when your strength is close to what the world data lists for it.
      It costs health, and a bashed door is left open.
    bashTries: Bashes Per Door
    openDoors: Auto-Open Doors
    openDoorsHint: A route stops at a closed door unless this is on. A locked door costs a command
      per try.
    openTries: Tries Per Door
    pickLocks: Auto-Pick Locks
    pickLocksHint: Tried before bashing, because it costs no health. Needs picklocks close to what
      the world data lists for the lock; the door is opened for you afterwards.
    pickTries: Picks Per Door
    sneak: Auto-Sneak on Move
    sneakHint: Decides whether the next room notices you arrive. Sneaking can fail.
  remotes:
    addPlayerLabel: Grant Player Permissions
    addPlayerPlaceholder: Ardren
    addPlayerHint: As the game spells it. Clicking a name on the Realm or Players card opens the
      same permissions.
    answerHint: When off, @ commands are read and ignored. Answering needs the other character to
      run mudengine too.
    channelWarning: A channel that lets another player's commands move this character. It answers
      nobody until something below is granted, and @kill and @hangup are always refused.
    enabledLabel: Enable Remote Control
    gangLegend: Gang Permissions
    gangWarning: "Membership is read from the who list: this character's row and the asker's must
      both show the same gang. Until the who list has shown both, the gang grants nobody anything."
    gangpathHint: 'A gangpath answer goes to the whole gang: "gb @exp" is answered with "gb
      {Made…}", and every member sees both.'
    gangpathLabel: Allow Remotes on Gangpath
    legend: Answering Other Players
    playerLegend: Permissions for {name}
    partyListNote: "There is a third list on the Party page: what anyone who has joined this
      character's party may ask for. It comes with @health, @bless-expired and @heal, and nothing
      else."
    removePlayer: Remove
    removePlayerTitle: Remove every permission from {name}
    remoteControlNote: Answers or acts on the @ commands checked below, for whoever they are granted
      to. Every other @ command is read and reported, never answered.
    replyRoutingNote: The answer goes back the way the question came, so ask by telepath to be
      answered by telepath.
  party:
    askHealHint: Say @heal in the room below this, while in a party. A member running MegaMUD or
      this client answers with a heal. 0 never asks.
    askHealLabel: Ask for Healing Below %
    assistHint: Attack what the leader (whoever this character follows) was last seen attacking,
      while it is still in the room. Never a player, and still subject to the combat health limit.
    assistLabel: Auto-Assist Leader
    blessingsMoved: 'Blessing the party is now on the Spells tab: one list for yourself and the
      party, in priority order, recast when they wear off, with a backup timer.'
    defendHint: Attack a monster seen attacking any party member, while it is still in the room. The
      fight came to the party, so this ignores Attack Target Selection. Never a player.
    defendLabel: Auto-Defend Party
    healLegend: Healing
    healNote: A member's @heal is answered by Auto-Heal Party Members on the Spells page, when @heal
      is checked under Party @ commands below.
    legend: Following
    remotesLegend: Party @ commands
    remotesNote: What anyone who has **joined** this party may ask this character for. An invitation
      nobody accepted is not membership, and a Deny on someone by name still overrides this.
    remotesOffWarning:
      Answering @ commands is off for this character, so nothing here is answered yet. The
      switch is on the Remotes page.
    restHint: Only out of combat, like every rest. Meditates only for a class with mana.
    restLabel: Rest With Leader
    warning: It is not yet known whether the game limits commands per connection or per computer.
      These settings make a second automated character useful; turning them on means testing that
      yourself.
  profile:
    accentLabel: Color
    autoConnectLabel: Connect on Start
    autoReconnectHint: Only after a lost connection. Pressing Disconnect, hanging up on low health,
      or leaving the realm yourself all stop it. Waits 0s, 5s, 10s, then 15s.
    autoReconnectLabel: Reconnect if the Connection Drops
    copyFromHint: Everything except the name and password. A starting point, not a link to later
      changes.
    copyFromLabel: Copy From
    copyFromNone: Nothing (start empty)
    encodingHint: CP437 unless you know the realm has changed. Its banners use block characters that
      are not valid UTF-8.
    encodingLabel: Encoding
    hostLabel: Host
    hostPlaceholder: paramud.mudinfo.net
    idHint: Letters, numbers, - and _. Names the file, the log and the tab, separate from the
      display name.
    idLabel: File Name
    idPlaceholder: thorn
    manageRealms: Manage realms…
    namePlaceholder: Thorn the Unready
    passwordHint: Stored in this character's own file and never shown again. The realm's login steps
      send it wherever they say {password}, which is how realms with differently worded prompts are
      answered.
    passwordLabel: Password
    passwordPlaceholderSet: •••••••• (leave blank to keep it)
    passwordPlaceholderUnset: none set
    portLabel: Port
    realmElsewhere: Somewhere else (type the address)
    realmLabel: Realm
    themeInherit: As set in MudEngine
    themeLabel: Theme
    themeSystem: Follow the system
    usernameLabel: Username
  realms:
    confirmRemove: Remove this realm?
    databaseBrowse: Browse…
    databaseClear: Clear
    empty: Choose a realm, or add one.
    loginLegend: Login Menus
    loginNote: When the game shows the text on the left, the client sends the text on the right.
      Leave the answer blank to send a bare Enter, which several menus want. Write {user} or
      {password} to send this character's own. Realms word those two prompts differently, so they
      are rows here like any other, and the account itself is on the character's page.
    loopsNote: Every character on this realm can walk these without being told to. A character can
      add its own loops on its own page.
    mobRuleNote: Every character on this realm follows these, after any rule of its own. A monster
      set to Never Attack is left alone; when one of the others is in the room, its priority decides
      and the usual weighing is skipped.
    nameHint: What your characters call this realm. Renaming it moves every character that plays here.
    nameLabel: Name
    namePlaceholder: Paradigm Game 1 PVE
    new: + New realm
    removed: Realm removed.
    saved: '{realmName} saved.'
    stepSendPlaceholder: '1'
    stepWhenPlaceholder: Please select a realm
    submit: Add realm
  gear:
    legend: Equipment Sets
    note: A set names only the slots it cares about. What the character wears is the "always" set
      with whichever other set applies on top, so "Moving" can be one line about boots instead of a
      full copy of your gear.
    enabled: Swap Gear to Suit
    enabledHint: 'When on, the sets below are put on and taken off as the situation changes:
      walking, fighting, or fighting one named monster. The off-hand item comes off before a
      two-handed weapon goes on, and the weapon hand goes first, so switching back frees the hand
      before the shield is equipped.'
    setAdd: Add a set
    setNamePlaceholder: What to call it
    setNameAria: Set {number} name
    setWhenAria: When set {number} applies
    setMobPlaceholder: Any monster
    setMobAria: Set {number} monster
    setRemoveTitle: Remove this set
    setRemoveAria: Remove set {number}
    setShadowed: An earlier set already claims this situation, so this one never applies.
    itemAdd: Add an item
    itemPlaceholder: The item, as your inventory lists it
    itemAria: Set {number}, item {item}
    itemRemoveTitle: Remove this item
    itemRemoveAria: Remove item {item} from set {number}
    whenAlways: always
    whenMoving: while moving
    whenFighting: while fighting
    offRoundLegend: Between rounds
    offRoundNote: Using an item on what you are fighting, between attacks. The game will not use a
      weapon that is not in hand, so with a two-handed weapon it costs six commands a round
      (off-hand off, weapon on, use, weapon back, off-hand back) against a limit of three. 0 rounds
      never uses it.
    offRoundItem: Item to use
    offRoundItemHint: The item, as your inventory lists it. It is put in hand, used on whatever you
      are fighting, and your gear is put back afterwards.
    offRoundEvery: Every (rounds)
    offRoundEveryHint: At most one use every this many rounds. 0 never uses it. Each use is a round
      this character is not attacking, so a low number in a long fight means fewer attacks.
  sections:
    character: Character
    login: Login
  nav:
    character: Which character
    label: Settings sections
    realm: Which realm
  spells:
    addBlessing: Add a bless spell
    blessingDownAria: Move blessing {number} down
    blessingDuplicate: An earlier row already casts this spell on this target. Only that one is kept
      when this saves.
    blessingDownTitle: Lower priority
    blessingFallback: Recast After, s
    blessingFallbackAria: Blessing {number} fallback seconds
    blessingInCombat: In Combat
    blessingMinMana: Not Below Mana %
    blessingMinManaAria: Blessing {number} mana floor %
    blessingOverHeal: Before Healing
    blessingSpellAria: Blessing {number} spell
    blessingTargetAria: Blessing {number} target
    blessingTargetParty: Party
    blessingTargetSelf: Self
    blessingUpAria: Move blessing {number} up
    blessingUpTitle: Higher priority
    blessingsLegend: Bless Spells
    blessingsNote: Spells the client keeps up for you. When the game says one has worn off, it is
      cast again right away. The top of the list is cast first, and blesses on yourself always come
      before ones on the party. A bless on a party member is recast on its own timer, because the
      wear-off message shows on their screen, not yours.
    notifyWearOffLabel: Tell Caster When a Bless Ends
    autoBlessLabel: Auto-Bless
    autoBlessHint: Cast the bless spells below automatically. When off, mana is saved for healing
      through a fight without clearing the list. The toolbar has the same switch.
    invokeItemsLabel: Bless From an Item
    invokeItemsHint: Use a carried item to cast the bless it grants, when that bless is not up. Only
      items the world data says have unlimited uses; nine weapons in the built-in world bless this
      way, for no mana and no charge. Items with a fixed number of charges are left alone.
    notifyWearOffHint: When a party member's bless on this character wears off, telepath them
      @bless-expired so their client recasts it right away instead of waiting for its timer. Both
      players must run mudengine.
    cureBlindnessLabel: Cure Blindness Spell
    cureDiseaseLabel: Cure Disease Spell
    cureFreedomLabel: Freedom Spell
    cureLegend: Cures
    cureNote: Cast as soon as the game says you are blinded, poisoned, diseased or held in place,
      and again after thirty seconds if it is still there. A blank field does nothing. A field is
      grayed out when your spellbook has nothing that cures it.
    curePoisonLabel: Cure Poison Spell
    cureHint: The spell to cast when this lands on you. Blank does nothing.
    cureClosedHint: Your spellbook has no spell that cures this, so there is nothing to cast.
    bookUnreadNote: This character's spellbook has not been read yet. The client reads it
      automatically next time the character logs in; until then these fields cannot suggest
      anything.
    pickerPlaceholder: search spells
    removeBlessingAria: Remove blessing {number}
    removeBlessingTitle: Remove
    areaCastHint: Cast with no target (c <spell>) when the fight is crowded enough. Not cast while a
      monster the world data calls good is in the room, because an area spell hits everything there.
    areaCastLabel: Area Effect (AE) / Room Spell
    areaMinManaHint: The area spell costs the most, so its minimum is the higher of this and the
      normal mana minimum. 0 uses the normal minimum alone.
    areaMinManaLabel: AE Spell Min Mana %
    areaMinMobsHint: 'The number of targets at which the area spell is chosen: monsters in this
      fight or about to join it, never a shopkeeper.'
    areaMinMobsLabel: AE Min Targets
    castHint: Sent as c <spell> <target> on the mid-round tick. Use the whole name; the game matches
      on the start of it.
    castLabel: Attack Spell
    autoChoose: Auto Choose Best Spell
    autoChooseHint: 'Picks the attack spell each round from your spellbook and the world data: never
      one the monster resists, the cheapest one that would kill it, otherwise the strongest. Heals
      are chosen the same way against the health you are actually missing, so a scratch does not get
      a major heal, and cures are picked where their fields are blank. The spells below are cast
      when this is off, and when it is on but the spellbook cannot answer.'
    fallbackCastHint: Cast instead for the rest of the fight once the game says the attack spell has
      no effect on the target. Blank leaves the fight to your regular attacks.
    fallbackCastLabel: Fallback Spell
    attackCastsHint: Casts of the attack spell per target, then your regular attacks take over. 0 is
      no limit; MegaMUD's default is 1.
    attackCastsLabel: Casts Per Target
    areaCastsHint: Casts of the area spell per fight. 0 is no limit.
    areaCastsLabel: AE Casts Per Fight
    healBelowInCombatHint: A separate threshold while fighting. 0 uses the one next to it for both;
      set it lower so a scratch does not cost a round.
    healBelowInCombatLabel: Heal In Combat Below %
    healBelowLabel: Heal If Below HP %
    healHint: Cast on this character with no target. Only spells you can cast on yourself are shown.
    healLabel: Self Healing Spell
    healLegend: Healing
    healNoSelfCast: This spell cannot be cast on yourself.
    healNoPartyCast: This spell cannot be cast on another character.
    healParty: Auto-Heal Party Members
    healPartyHint: A member the party list has not shown has no health to read, and is never healed
      on a guess.
    healPartyWithHint: Cast on the member who is hurt. Only spells that can be cast on another
      character are shown.
    healPartyWithLabel: Party Healing Spell
    healToHint: Keep healing that target until it is back to this. 0 casts once at the threshold.
    healToLabel: Heal Up To HP %
    legend: Attack Spells
    minManaHint: Below this, your regular attacks take over. 0 always casts.
    minManaLabel: Not Below Mana %
    note: Buffs, heals and anything conditional are set in automation.rules in the options file.
    rulesPointerNote: One spell, cast by a number, on the mid-round tick, which is the one thing a
      rule cannot do. Everything else a caster needs is in automation.rules.
  statline:
    legend: The Status Line
    controlLabel: Set the Status Line
    controlHint: Sends the client's own statline template when you log in, so every prompt shows
      maximum health and mana, exp, exp needed for the next level, and cash. Then sends pro once to
      check what the game has, which is how the prompt is read.
    templateNote: 'The template sent is set statline full custom
      [HP=%h/%H,MA=%m/%M,Exp=%x,Need=%X,Wealth=%c%r]: The game saves it on the character, so it
      stays set after the client closes. Either way, the client reads whatever the line turns out to
      be and says which pattern it uses.'
  rewrites:
    listLegend: Your Designs
    note: Each design is drawn in place of what the game printed, with what the client knows added,
      as soon as the listing is complete; what was drawn stays in the scrollback. One design draws
      each listing, and turning one on turns off the others for it.
    empty: None. Add one below.
    enabledAria: Draw {name} yourself
    editAria: Edit {name}
    editTitle: Open in the editor
    removeAria: Remove {name}
    removeTitle: Remove this design
    add: New design
    entities:
      statline: the status line
      inventory: the inventory
      who: the who list
      shop: a shop's list
      party: the party
      experience: the experience line
    bandsLegend: Vital Colors
    bandsNote: On every line the client draws, a health or mana number is colored by its share of
      maximum; the first band whose minimum it reaches wins. With no bands, the line keeps its own
      color. With an unknown maximum, no color.
    bandsHp: Health Colors
    bandsMana: Mana Colors
    bandFromLabel: From, %
    bandColourLabel: Color
    bandRemove: Remove
    bandRemoveAria: Remove band {number}
    addBand: Add a band
    editor:
      ariaLabel: Design a rewrite
      nameLabel: Name
      entityLabel: Draws
      enabledLabel: Draw It Myself
      enabledHint: The game's lines for this are held back until the listing is complete, and this
        design is drawn in their place. When off, the game's own lines are shown.
      templateLabel: Template
      templateHint: Text with tags in braces, one line here per line in the console. Click a value,
        a color or a control on the left to insert it at the cursor.
      done: Done
      typed: what you type
      typedNote: The text after the row is what you type into it. A color left open at the end of
        the template colors your typing, because nothing resets after the line the cursor is on.
      previewLabel: As it will be drawn
      previewEmpty: Nothing to draw.
      previewSample: Drawn from sample data; connect this character to see its own numbers.
      cells: '{cells} of {max} cells; what you type shares the row, so leave it room.'
      tooWide: "{cells} cells, wider than the {max} the status line holds, so the game's own line is
        shown until this is shorter."
      oneLine: The status line is one line, so only the first line here is drawn.
      problems:
        unclosed: '{tag} was never closed.'
        stray: '{tag} has nothing open to close; it is drawn as typed.'
        badTest: '{tag} is not a test this template language understands; its branch is never used.'
      sidebar:
        listing: This listing
        character: Character
        row: Inside a row
        colours: Colors
        controls: Controls
        rowsOf: 'Fields of {tag}'
        repeat: Repeat for each
        repeatHint: Draws the middle once per row, with the row's fields in scope.
        insertHint: Puts {tag} at the caret.
        pickColour: Any color
        pickColourHint: Your own color, as a hex code the palette cannot change.
        ground: On the ground
        closers: Closers
        closersHint: Restores the color or style that was in effect before.
        ifHint: Draws the middle only when the test is true; else if and else handle the other
          cases.
        forHint: Draws the middle once per row, with the row's fields in scope.
        tableHint: Lines up every value inside in columns; header names them in a first row.
        groupHint: 'Breaks off matching items into a new list: {group items matching "^token of " as tokens}'
        filtersHint: 'After a figure: |upper |lower |left |right |center |width:12 |or:text for a blank.'
        kindText: text
        kindNumber: number
        kindFlag: yes or no
        kindGlyph: a picture two cells wide
        kindList: a list
        kindRecord: values
  tabs:
