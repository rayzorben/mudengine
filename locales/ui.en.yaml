# Every word the client's chrome shows, in one place.
#
# Components look these up with t('section.key') — see src/shared/i18n.ts.
# The rules for the words themselves are docs/terminology.md: labels of at
# most four words, one-sentence tooltips, the realm's own vocabulary for
# anything the realm names, MegaMUD's words where a player already has them,
# and one word per thing (a synonym is a bug).
#
# {name} is a placeholder the code fills in at render time. Some strings are
# asserted verbatim by scripts/smoke.mjs — check before rewording.
#
# src/shared/__tests__/i18n-coverage.test.ts fails the build for a key used
# in code but absent here, and for a key here that nothing reads.
# The client itself: window title, the error boundary, running twice.
app:
  supplies:
    invalidList: The supplies list sent was not one this client could read, so nothing was written.
  automation:
    unknownSwitch: Unrecognized automation switch.
  config:
    reloadFailed: Options not reloaded — {error}
    internalTemplateAdded: 'Added to internal.yaml, from the template: {added}.'
    templateAdded: 'Added to your options file, from the template: {added}.'
    templateReconcileFailed: Options file left alone — {error}
  debug:
    noSession: There is no session to write a report for.
    realmUnknown: (not dialled)
    reportTitle: mudengine debug report
  gpu:
    softwareCompositing: 'The window is not drawn by the GPU (compositing {compositing}, rasterization {rasterization}, WebGL {webgl}): every frame is composed in software, which is why typing and scrolling crawl. Check the graphics driver, or how the client was launched.'
  connect:
    invalidTarget: Invalid connection target.
    noCharacterFile: 'Connection failed: Character "{id}" has no realm configured.'
  crash:
    guardNotice: 'Client error encountered. Background sessions remain connected: {message}'
  dialog:
    allFilesFilter: All files
    chooseRealmTitle: Choose a realm database
    realmDatabaseFilter: Realm database
  errorBoundary:
    body: Active character sessions are unaffected. Reload to restore interface.
    heading: UI Rendering Error
    reload: Reload window
  instance:
    alreadyRunning: This profile is already running. Switched to existing window.
    homeHeld: '{home} is already in use by another mudengine (pid {pid}). Two clients on one home
      write the same files and dial the same characters; stop the other one first, or delete
      {file} if it is not running.'
    staleLock: The lock left by pid {pid}, which is no longer running, was taken over.
  loop:
    invalidName: Invalid path/loop name.
    invalidLoop: Invalid loop definition.
    invalidPicks: The loop builder sent something that is not a list of at most {max} rooms.
    notFound: No loop named {name} in this character's options.
    unknownScope: Invalid loop scope.
  onboarding:
    noCharactersYet:
      No characters configured, so the settings screen is open on a new one. Ctrl/⌘ , reopens it; nothing
      connects until a character exists.
  profiles:
    fileGoneStillConnected:
      The file for "{id}" is gone, but the character is still connected. Disconnect to
      close it.
    incompleteDraft: 'Character configuration incomplete: Realm is required.'
    invalidId: A character’s file name may only use letters, numbers, - and _.
    loadFailed: Character not loaded — {error}
    noSuchCharacter: No such character.
    stillConnected: '{name} is still connected.'
  quit:
    cancelButton: Cancel
    confirmButton: Quit and disconnect
    consequenceDetail:
      Quitting disconnects them. On a PvP realm an unclean disconnect can cost items,
      or the character.
    dialogTitle: Quit mudengine
    whoIsConnected:
      many: '{count} characters are still in the realm: {names}.'
      one: '{name} is still in the realm.'
  remotes:
    invalidName: Unrecognized remote (@) command.
  route:
    invalidPayload: Invalid route path.
    noRealmData: No realm data loaded
    unknownRoom: Current room unknown. Move or look to locate character.
  servers:
    invalidDraft: A realm needs a name, a host and a port between 1 and 65535.
    noSuchServer: No such realm.
  session:
    notConnected: Not connected.
  settings:
    invalidGlobalDraft: Invalid settings payload.
  window:
    createFailed: Could not open a window.
    noMainWindow: There is no main window to move it to.
    noSecondWindow: This client is running in a browser tab, which has no second window to move a
      character into.
    nothingToGather: Nothing to gather.
    onlyCharacterHere: That is the only character in this window.
    unknownCaller: Unknown calling window.
  home:
    outside: That path is outside the client's home directory, so it was not listed.
    unreadable: '{path} could not be listed: {message}'
  clipboard:
    none: This host has no clipboard of its own; the window keeps one instead.
  windowTitle: mudengine
# Lines the client itself prints into the terminal or pushes as one-off notices.
notices:
  config:
    servers:
      noHost: '{file} does not name a host, so it is not a realm'
      readError: '{file} could not be read: {message}'
  desktopAlerts:
    refused:
      'Desktop notifications are switched on, but this system will not show them. Nothing will be
      raised outside the window until it is allowed to.'
    title: '{name}'
    unavailable:
      'Desktop notifications are switched on, but nothing here can show one. Alerts are still kept
      on the Alerts card.'
    untitled: MudEngine
  migration:
    talkHold:
      'The Talk card now holds its place for 45 seconds after you scroll, rather than 15, and
      {file} was migrated to match.'
    hunting:
      'Going hunting on its own is a setting now, off, and {file} was given the block with the
      paragraph that explains it.'
    toolbarGainedBack:
      'The toolbar has a back button — one room back the way the character came, per press — and
      {file} was migrated to put it on the row, with the length of trail it walks.'
    oneTransportButton:
      "The toolbar's three transport buttons are one — play or stop, whichever of a route and a
      loop is on — and {file} was migrated to match, with the figure that decides when play asks
      before walking a character back to what it left."
    lightStated:
      one:
        'Lighting a torch before a dark room is now a setting, on by default, and was written into
        {count} file with the paragraph that explains it: {fileList}'
      many:
        'Lighting a torch before a dark room is now a setting, on by default, and was written into
        {count} files with the paragraph that explains it: {fileList}'
    suppliesStated:
      'A supplies block was written into {file} — the things a character keeps in stock and where
      it buys them. Empty, so nothing changes until an item is added.'
    conditionWaitsStated:
      one: 'Walking on while blind or poisoned is a setting, off by default, and was written into
        {count} file with the paragraph that explains it: {fileList}'
      many: 'Walking on while blind or poisoned is a setting, off by default, and was written into
        {count} files with the paragraph that explains it: {fileList}'
    keyPickupStated:
      one:
        'Picking up a key an exit of the room needs, when it is lying on that floor, is a setting --
        on by default -- and was written into {count} file with the paragraph that explains it:
        {fileList}'
      many:
        'Picking up a key an exit of the room needs, when it is lying on that floor, is a setting --
        on by default -- and was written into {count} files with the paragraph that explains it:
        {fileList}'
    anonymousConnectionDropped:
      'The account and "connect on launch" under connection: were removed from {file}. The client no
      longer connects without a character; each character''s own file carries its account.'
    bankAskedOnEntry:
      many:
        '`bank` was added to the entry probe in {count} files, before the closing look. A balance
        is now kept between sessions; this refreshes the one vault you can reach on the way in.
        {fileList}'
      one: '`bank` was added to the entry probe in {count} file, before the closing look. A balance
        is now kept between sessions; this refreshes the one vault you can reach on the way in.
        {fileList}'
    blessingsKeyedOnSpell:
      many:
        'A blessing row is now named by its spell alone, and only party rows carry a recast clock
        — a self blessing recasts on the wear-off the game prints, with a watchdog measured from
        your own casts. {count} files were rewritten to the new shape. {fileList}'
      one: 'A blessing row is now named by its spell alone, and only party rows carry a recast clock
        — a self blessing recasts on the wear-off the game prints, with a watchdog measured from
        your own casts. {count} file was rewritten to the new shape. {fileList}'
    blessingsMerged:
      many: 'Buffs and party blessings became one list — spells.blessings, recast on wear-off events
        with the old interval as the clock behind them — and {count} files were rewritten with their
        rows carried across. {fileList}'
      one: 'Buffs and party blessings became one list — spells.blessings, recast on wear-off events
        with the old interval as the clock behind them — and {count} file was rewritten with its
        rows carried across. {fileList}'
    charactersMoved: Characters moved from {from} to {to}.
    conversationLogKept:
      "The Talk card's history is now kept on disk and restored when the client starts. The two
      settings — whether, and for how many days — were written into your options file with the
      paragraph that explains them."
    entityPredicates:
      many:
        "Three settings were added to {count} files, all off: pick up anything over a value, never
        pick up anything over a weight, and drop what the realm itself prices at nothing. Each asks
        the realm a question about a thing, which the client could not do until items carried the
        realm's own row. {fileList}"
      one: "Three settings were added to {count} file, all off: pick up anything over a value, never
        pick up anything over a weight, and drop what the realm itself prices at nothing. Each asks
        the realm a question about a thing, which the client could not do until items carried the
        realm's own row. {fileList}"
    gmudRealmFailed: 'The {realm} realm could not be removed from your realms: {reason}'
    gmudRealmRemoved:
      '{realm} no longer ships with the client and was removed from your realms ({dir}); nothing
      was playing on it. The six Paradigm realms are unchanged, and a new character now starts on
      the one the built-in map was built from.'
    healSplit:
      many: 'Healing is two spells now — one cast on this character and one cast on a party member,
        because the realm marks which spells may be cast on whom. `healPartyWith` and a `healTo`
        ceiling were written into {count} files; a file that was already healing the party kept
        its spell. {fileList}'
      one: 'Healing is two spells now — one cast on this character and one cast on a party member,
        because the realm marks which spells may be cast on whom. `healPartyWith` and a `healTo`
        ceiling were written into {count} file; a file that was already healing the party kept
        its spell. {fileList}'
    lookNoLongerBroadcast:
      many:
        'The client no longer re-reads rooms with `l` — it prints the same block and tells everybody
        in the room you are looking around. A bare Enter does it silently, so the idle command and
        the closing look on entering the realm were changed in {count} files. {fileList}'
      one:
        'The client no longer re-reads rooms with `l` — it prints the same block and tells everybody
        in the room you are looking around. A bare Enter does it silently, so the idle command and
        the closing look on entering the realm were changed in {count} file. {fileList}'
    loopShelfPinned:
      'The Loops button was added to your toolbar. It opens every loop the client knows —
      Ctrl/Cmd L, or the circular arrow beside the transport controls.'
    tuningKeysChanged:
      'Your internal.yaml was brought up to date: added {added}; removed {removed}. The values are
      the shipped ones, so nothing behaves differently — what changes is that they are in the file
      you edit. {file}'
    tuningNothingAdded: nothing
    tuningNothingRemoved: nothing
    autoReconnectStated:
      many:
        '"Reconnect if the connection drops" was written into {count} character files, on, with the
        paragraph that explains it. It is what they were already doing. {fileList}'
      one:
        '"Reconnect if the connection drops" was written into {count} character file, on, with the
        paragraph that explains it. It is what it was already doing. {fileList}'
    newAutomationStated:
      many:
        'New settings — dropping junk, banking the purse, defending the party, the crowd spell and
        the reaction to a player attacking — were written into {count} files with the paragraphs
        that explain them. All off, which is what the client was already doing. {fileList}'
      one:
        'New settings — dropping junk, banking the purse, defending the party, the crowd spell and
        the reaction to a player attacking — were written into {count} file with the paragraphs
        that explain them. All off, which is what the client was already doing. {fileList}'
    markStated:
      '"ui.showLogo" was written into {file}, on: the client draws its own mark at the left of the
      status rail. Turn it off there or on the MudEngine page in settings.'
    alertRowsBecameEvents: 'Alert rows in {count} file(s) ({fileList}) now name events rather than
      channels: a row said what kind of thing it was about, not what happens. Channel rows were
      carried to the nearest happening ({pairs}), which is narrower than a whole channel — check
      the Alerts section. Every row also gained a 30-second quiet time.'
    alertRowsNoChannels: no channel rows
    alertSurfaceConverted:
      'The alert floor, the muted channels and the find watch became rows of your own alert list,
      in {count} file(s): every question they answered is a row, and two ways of asking one
      question is how one of them comes to look broken. Your settings were carried over — a muted
      channel is a row that does not alert, a watched word an item row, a muted notification a row
      that still shows. {fileList}'
    alertFloorDropped:
      '"ui.alerts.minimum" was removed from {count} file(s): a level is a property of a line rather
      than of a channel, so no row says what a floor said and none was invented for it. Everything
      is shown again unless one of your own rows says otherwise — the Alerts section in settings is
      where they are. {fileList}'
    desktopSwitchesBecameRows:
      '"ui.alerts.desktop" was removed from {count} file(s): its two switches are questions each
      alert row already answers — "Notify" says whether a row raises one outside the window, and
      "Even when MudEngine is in front" says whether that holds while you are looking. Set them per
      row in the Alerts section of settings. {fileList}'
    desktopSwitchesSilenced:
      'Notifications were switched off altogether in {count} file(s), so every alert row there has
      "Notify" turned off to keep the same silence. Turn it back on for the rows worth being
      interrupted for. {fileList}'
    darkConsoleStated:
      '"ui.console" was written into {file}, on: under a light theme the console keeps a dark
      palette, because a light one has to make the realm''s black its paper. Choose which dark
      palette, or turn it off, there or on the MudEngine page in settings.'
    consolePaletteStated:
      '"ui.console.palette" was written into {file} as "theme", which is the console you already
      have. Seven palettes repaint what the realm sends — four dark, three light — and naming one
      there or on the MudEngine page in settings outranks the two keys beside it.'
    statusLineStated:
      '"automation.statline" and "ui.rewrites" were written into {file}, all off: whether the
      client sets the prompt''s shape on the way in, so every prompt carries the maxima, the
      experience and the purse, and the status line and listings you can design to draw in the
      realm''s place. Turn any on there or on the Rewrites section in settings.'
    rewritesGathered:
      '"ui.statline" in {file} became the Status line design under "ui.rewrites", beside the
      listings the console can draw in the realm''s place — the pack, the roster, a shop''s
      shelf, the party and the experience line, all written in, off. The Rewrites section in
      settings keeps the list.'
    rewritesListed:
      '"ui.rewrites" in {file} is a list of designs now: each listing it stated became one
      design, on or off as it was, its lines folded into one template, and the status line''s
      colour bands became the block''s. The Rewrites section in settings keeps the list, and
      each design opens in an editor that lists every figure it may name.'
    statusLineAsksQuieted:
      "pro and set were added to the quiet list in {file}: the status-line routine's own asks stay
      out of the console. Remove them there to see them."
    diagnosticsPreferenceDropped:
      many:
        '"ui.showDiagnostics" was removed from {count} files: the diagnostics cards are now hidden on
        every launch and "Show diagnostics" in the command palette shows them for as long as the
        window is open. {fileList}'
      one:
        '"ui.showDiagnostics" was removed from {count} file: the diagnostics cards are now hidden on
        every launch and "Show diagnostics" in the command palette shows them for as long as the
        window is open. {fileList}'
    combatAndPotionSettings:
      many:
        'Combat and potion settings changed in {count} files: "joinFights" is now "politeAttacks"
        (MegaMUD''s own name and direction), "whileWalking" is gone — a route and a lap both fight
        now, and turning auto-combat off during one declines it — and "avoidUndead",
        "avoidDeathSpell" and the attack priority list have been removed. The two named potion
        slots became rows in "potions", keeping any threshold you had set. {fileList}'
      one: 'Combat and potion settings changed in {count} file: "joinFights" is now "politeAttacks"
        (MegaMUD''s own name and direction), "whileWalking" is gone — a route and a lap both fight
        now, and turning auto-combat off during one declines it — and "avoidUndead",
        "avoidDeathSpell" and the attack priority list have been removed. The two named potion
        slots became rows in "potions", keeping any threshold you had set. {fileList}'
    combatFloorDropped:
      many: '"combat.minHealth" was removed from {count} files: there is no longer a health floor on
        opening a fight. Low health is the retreat''s business and the rest''s, which act on the
        character rather than on the decision to swing back. {fileList}'
      one: '"combat.minHealth" was removed from {count} file: there is no longer a health floor on
        opening a fight. Low health is the retreat''s business and the rest''s, which act on the
        character rather than on the decision to swing back. {fileList}'
    fightCostDropped:
      many: '"combat.maxFightCost" was removed from {count} files: a fight is no longer declined for
        what it is expected to cost. The Room card still draws the figure; nothing refuses on it.
        {fileList}'
      one: '"combat.maxFightCost" was removed from {count} file: a fight is no longer declined for
