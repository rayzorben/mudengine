        health can cover the trap ahead and still leave that much of your maximum. {fileList}
      one: Resting before a trap was added to {count} file, set to 45%. A walk now waits until
        health can cover the trap ahead and still leave that much of your maximum. {fileList}
    restCeiling:
      many: A rest-to limit was added to {count} files, turned off. With it, the character keeps
        sitting back down until health reaches it. Casting interrupts a rest and standing
        regenerates six times slower, so without it one heal ended resting for the whole recovery.
        {fileList}
      one: A rest-to limit was added to {count} file, turned off. With it, the character keeps
