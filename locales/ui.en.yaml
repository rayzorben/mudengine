      the room the realm named as where you are.'
    probeReason: a step has gone unanswered — asking where you are tells a slow realm from a lost step
    readSettledByLocate:
      'The realm answered a later question before “{command}”, so that re-read is not coming.
      Nothing was held up by it.'
