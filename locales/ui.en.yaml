      note: What the client writes down. Every one of these is a file beside the options, and the
        recordings hold everything the realm sent and every command sent back — including, on a
        hand-typed login, a password.
    tabs:
      appearance: Appearance
      records: Records
  combat:
    attackForMe: Auto-Attack
    attackLegend: Attack
    attacksLegend: Attacks
    attackVerbHint:
      The realm’s own word. A verb this class cannot use is dropped the first time the realm
      says so.
    attackVerbLabel: Attack Command
    attackVerbPlaceholder: a
    attackWithPlaceholder: a
    mobRuleAdd: Add a monster
    mobRuleDefault: Default — follow the game logic
    mobRuleDuplicate: Already listed above. A monster is treated one way; this row does nothing.
    mobRuleFirst: First — always attack this first
    mobRuleHigh: High — before everything below
    mobRuleLast: Last — after everything else
    mobRuleLegend: Monster Rules
    mobRuleLow: Low — after the game logic
    mobRuleNameAria: 'Monster for rule {number}'
    mobRuleNamePlaceholder: Monster name
    mobRuleNever: Never Attack — leave it alone
    mobRuleNote:
      One row per monster you care about. Never Attack is refused before anything else; the
      other five are the order the rest are attacked in, and where one of these is in the room
      the band decides outright and the usual weighing is skipped. Anything unlisted counts as
      Default.
    mobRuleRemoveAria: 'Remove rule {number}'
    mobRuleRemoveTitle: Remove this monster
    mobRuleTreatAria: 'How monster {number} is treated'
    maxMonsterExpHint: Will not attack anything worth more experience than this. 0 is off,
      unknown monsters will be attacked.
    maxMonsterExpLabel: Max Monster Experience
    minMobsLabel: Min Monsters in Room
    minMobsHint:
      Will not open a fight in a room holding fewer than this — for a character whose value is an
      area spell. 0 is off.
    maxTargetHealthHint:
      Will not attack anything the realm gives more health than this. 0 is off, and a monster the
      realm cannot place is not refused by it.
    maxTargetHealthLabel: Max Target Health
    engageAll: Attack All Monsters
    engageHint:
      What the world data says about a monster, never its name — one it calls good is attacked only
      if named below.
    engageHostile: Hostile / Aggressive Only
    engageLabel: Attack Target Selection
    engageLikely: Suspected Hostiles Only
    engageNone: Retaliate Only
    hitBack: Retaliate When Attacked
    hitBackHint: Swings at whatever is already swinging at this character. Cannot open a fight.
    politeAttacks: Polite Attacks
    politeAttacksHint:
      MegaMUD's Polite Attacks. On, a monster somebody outside your party is already fighting is
      left to them, and the trace says whose it was. Retaliation is unaffected.
    masterSwitch: Enable Auto-Combat
    masterSwitchHint: The master switch. With this off nothing below sends anything, whatever it says.
    maxMobsHint: Will not open a fight in a room holding more than this. 0 never refuses.
    maxMobsLabel: Max Monsters in Room
    monstersLegend: Monsters
    openerHint: Sent for the first blow of a fight only. Blank for none.
    openerLabel: Opening Attack
    openerPlaceholder: bs
    hideForOpener: Hide Between Fights
    hideForOpenerHint:
      Sends hide when this character is seen in an empty room, and sneak instead while a lap or
      route has it, so the opening backstab lands again. Only for an opener of bs.
    openingFightsWarning: Opening fights unasked can cost a character; the default only retaliates.
    openWarning: With this on, the client opens fights by itself — never on a player.
    refreshHint: Rounds between looks, so a monster that died or walked in is noticed. 0 never looks.
    refreshLabel: Room Look Interval (Rounds)
    rulesPointerNote:
      When to cast, when to buff and when to loot are automation.rules in the options
      file — guard expressions with comments explaining why, which is what YAML is good at and this
      screen is not.
  crumbs:
    characters: Characters
    global: Global
    mudEngine: MudEngine
    realms: Realms
  dialog:
    closeAria: Close settings
    # The corner of the panel. Drag to resize, double-click to put it back.
    resizeAria: Resize settings
    ariaLabel: Settings
    characterRequired: This client plays characters, and there are none yet. Make one below and this screen will let you out.
  footer:
    openConfig: Options file
    openProfiles: Characters folder
  formActions:
    idle: Saved as you type.
    notSaved: Not saved.
    redo: Redo
    saved: Saved.
    saving: Saving…
    undo: Undo
    undoTitle: Undo the last change
  global:
    combat:
      advancedPacing: looking around and how fast to send
      pacingMinGapLabel: Least Gap, ms
      pacingNote:
        'How fast commands may go out is measured from the status line, not guessed: the realm
        accepts about twenty in flight and silently discards the rest.'
      pacingTimeoutLabel: Give Up After, ms
      pacingWindowLabel: In Flight
    loading: Reading the options file…
    movement:
      advancedWalking: walking, and staying connected
      clearRouteLabel: Route Timeout (sec)
      idleAfterLabel: Anti-Idle Interval (sec)
      idleCommandLabel: Anti-Idle Command
      idleCommandPlaceholder: l
      idleEnabled: Enable Anti-Idle (Prevent Disconnect)
      loopsNote:
        Every character can walk these, whatever realm it plays on. A realm’s own loops go on its
        page, and a character’s on its own.
      onEnterHint:
        What the client asks the realm once, on the way in. Every one of these is a command
        spent, so the list is short on purpose. On GreaterMUD, `abil` is what fills the quest
        book in with the realm's own count of each quest — no other realm has that command,
        and one that does not will say the word out loud in the room.
      onEnterLabel: Post-Login / Entry Commands
      onEnterPlaceholder: rm, st, i, exp, sc, l
      onPartyChangeLabel: Party Change Commands
      onPartyChangePlaceholder: party
      stepTimeoutHint:
        Spent twice per step — once waiting for the command to reach the wire, once waiting for
        the realm to answer it — with one forced prompt between them. The wait before a step is
        given up on is about twice this.
      stepTimeoutLabel: Wait Per Step, ms
      minExpRateHint:
        Stops a running loop whose experience per hour has fallen under this, once it has run a
        quarter of an hour — a lap that has stopped working looks like one that is working until
        somebody checks. 0 never stops.
      minExpRateLabel: Stop Loop Under Exp/Hour
    realm:
      hostPlaceholder: paramud.mudinfo.net
      loginMenuSendPlaceholder: '1'
      loginMenusNote:
        When the realm prints the text on the left, the client sends what is on the right, with
        {user} and {password} standing in for the character's own. A new realm starts with these;
        each realm keeps its own on its page afterwards.
      noteBeforeCharacter: Until you have made a character, this is also the address the client connects to.
    saved: Settings saved.
    startingValuesNote:
      Starting values. A new realm or character takes a copy of these when you make it
      and keeps its own from then on, so changing them here changes what the next one starts with
      and leaves the ones you already have alone.
    tabs:
      realm: Realm
  health:
    belowHealthLabel: Below Health %
    belowManaLabel: Below Mana %
    belowManaHint:
      Also run under this share of mana — MegaMUD's ManaRun%. A caster with an empty pool is losing
      whatever the health bar says. 0 never runs for mana.
    retreatHint:
      Walking out of the fight breaks combat and carries none of the penalty a disconnect does.
      There is no flee command on this server family, so the way out is always a direction — the
      one you came in by where that is known, and an exit of this room otherwise.
    retreatLabel: Auto-Retreat
    retreatLegend: Auto-Retreat
    retreatStrategyHint:
      How far to go. step-back is the one move out. safe-haven takes the same move and then walks
      to the room below once the fight is over. Which exit is chosen is not a setting — the way you
      came is always preferred over one you have never used.
    retreatStrategyLabel: Retreat Strategy
    safeHavenHint: Named as a loop stop is, with the map/room so a shared name is not guessed at.
    safeHavenLabel: Safe Room / Retreat Room
    safeHavenPlaceholder: Newhaven, Town Gates 1/2150
    hangUpCleanHint: Leave this on. The five-minute PvP window is invisible on screen.
    hangUpCleanLabel: Refuse Likely Penalties
    hangUpLabel: Auto-Hangup / Emergency Disconnect
    hangUpLegend: Auto-Hangup
    hangUpOnPlayer: Hangup on Player Sighting
    hangUpWarning:
      An unclean disconnect costs a share of maximum health, and at low health it kills — use
      Auto-Retreat.
    meditateBelowHint: Sends med below this. Ignored for a class with no mana.
    meditateBelowLabel: Meditate If Below Mana %
    outnumberedHint: A health threshold notices being swarmed too late. 0 never.
    outnumberedLabel: Retreat If Attackers Exceed
    pvpActionHint:
      What to do about the fight itself. Retreat runs the moment the attack is seen, whatever
      Auto-Retreat says — a player opening on you is not a health threshold.
    pvpActionLabel: PvP Reaction
    pvpLegend: Attacked by a Player
    pvpNotifyHint: Says so on the gangpath (bg), once per attacker per five-minute window, with the
      room and your health riding along. It speaks to your whole gang.
    pvpNotifyLabel: Broadcast PvP Alert to Gang (bg)
    # The player's own *use this when that* list (todo 19), and since todo 00
    # the only one. The name field is filtered by the condition from the
    # realm's own data, so a rule for poison offers the antidotes and not the
    # healing potions.
    potionRuleLegend: When to use an item
    useWards: Follow the realm's own rules too
    useWardsHint:
      The realm writes rules of this shape itself, and this is whether they are obeyed. Where it
      says a spell stops a room's effect and a carried item's use casts that spell, the item is
      used before the step into such a room, and again whenever the spell lapses while standing in
      one. A use spends a charge and a round. The rules this realm holds are listed below.
    wardRow:
      one: against {hazard}, cast in {rooms} room
      many: against {hazard}, cast in {rooms} rooms
    potionRuleNote:
      Name an item and say what makes it worth using. The list is what this realm says would
      serve the condition; anything else can still be typed, and only an item the pack lists is
      ever asked for.
    potionRuleAdd: Add a rule
    potionRuleNamePlaceholder: item, as the pack lists it
    potionRuleNameAria: 'Item for rule {number}'
    potionRuleWhenAria: 'When rule {number} fires'
    potionRuleBelow: below
    potionRuleBelowAria: 'Threshold for rule {number}, as a percentage'
    potionRuleVerbAria: 'Verb for rule {number}'
    potionRuleRemoveAria: 'Remove rule {number}'
    potionRuleRemoveTitle: Remove this rule
    potionRuleDuplicate: An earlier rule already says this item at this condition and depth.
    potionWhenHp: health below
    potionWhenMana: mana below
    potionWhenPoisoned: poisoned
    potionWhenBlind: blinded
    potionWhenDiseased: diseased
    potionWhenHeld: held
    recoverLegend: Recover
    restBelowHint: Sends rest out of combat below this, and holds a running loop still at the same
      figure. 0 never rests and never pauses a loop.
    restBelowLabel: Rest If Below HP %
    restToHint:
      Sits back down after something breaks the rest, and walks a held loop on again, once health
      reaches this. Casting breaks a rest and standing regenerates six times slower, so this is
      what gives you rest, heal, rest, heal. 0 rests once and resumes at the floor. Lifted to Rest
      If Below if it is under it.
    restToLabel: Keep Resting To HP %
    restBeforeTrapsHint:
      Before stepping through a trap, waits until health covers the trap's damage and still
      leaves this share of maximum after it — or what the lair beyond is expected to take, if
      more. Its own switch, so it rests before a trap even with Rest If Below at 0. 0 walks into
      any trap at any health.
    restBeforeTrapsLabel: Keep After a Trap HP %
    restNextDoor: Rest Next Door to a Lair
    restNextDoorHint:
      A room that makes monsters on a short clock is not a resting place. Looks into a neighbour the
      realm holds no lair in, steps there only if it is empty, rests, and steps back.
    restingNote: One pair for both, because nothing rests while a loop is marching — a separate
      pause figure under the resting floor left the character walking while it was too hurt to sit
      down. Resting is a state the character is in, and only moving, attacking and casting break
      it, so nothing is sent while the status line already says (Resting), and nothing is ever
      spent standing up, because the next command you wanted does that for free.
  hint:
    ariaLabel: What this does
  login:
    addStep: Add a menu
    legend: Login Menus, This Character
    note: "Usually empty: the menus are from {realmOrAddress}. Anything here replaces that script
      rather than being added to it, the rows that send {user} and {password} included — so the
      first one you add starts as a copy of the realm's."
    noteFallbackAddress: the address this character dials
    removeStepAria: Remove step {stepNumber}
    removeStepTitle: Remove this menu
    stepRepeatAria: Answer every time, step {stepNumber}
    stepRepeatTitle:
      'Answer this every time it appears, not just once. For a pager — "(N)onstop, (Q)uit, or
      (C)ontinue?" — which a BBS asks once per screenful. A menu is asked once, so leave this
      off: a menu that comes back means the answer was refused.'
    stepSendAria: Send, step {stepNumber}
    stepSendPlaceholder: '2'
    stepWhenAria: When the realm says, step {stepNumber}
    stepWhenPlaceholder: Please select a character
  loopPicker:
    done: Done
    emptyCatalogue: No loops shipped with this build. A loop is still four lines of YAML in automation.loops.
    loading: Reading the shipped loops…
    noMatches: Nothing matches “{query}”.
    searchAriaLabel: Search the shipped loops
    searchPlaceholder: Search {count} shipped loops
    stopsCount:
      many: '{count} stops'
      one: '{count} stop'
    searchPlaceholderLoading: Search the shipped loops
  loopSection:
    addLoop: Add a loop
    empty: None. A loop is a list of rooms walked in sequence; add one below, and start it from the palette.
    heading: Loops
    inheritedNote: 'It also walks {count} it does not own, edited where {itLivesOrTheyLive}:'
    removeAriaLabel: Remove {loopName}
    removeTitle: Take this loop off
    scopeGlobal: every character
    scopeRealm: this realm
  # Going hunting on its own -- `automation.hunting` (todo 05). Under Movement
  # beside the loops: what it decides is a place.
  hunting:
    auto: Auto-Hunt (Find the Best Spot)
    autoHint:
      With nothing else to do, ask where the best hunting is within reach, walk there, and run a
      loop round it. The loop is built from the survey each time and is never saved.
    legend: Hunting
    note: The Hunting card ranks every lair the map reaches and prices it for this character. This
      is the same answer, walked to without a click.
    radius: Look Within (Steps)
    radiusHint: How far to look for a lair, in steps. Blank is everywhere the exits reach.
  train:
    legend: Training
    warning: A point bought here is permanent, and the form it is bought on renames the character if
      anything else is typed into it. The client types only figures, only into the six stat
      fields, and saves.
    stats: Auto Train Stats
    # Going to collect the level. Experience past the threshold does nothing
    # at all until a trainer is paid, so a client left overnight without this
    # comes back with a night's experience and the same character.
    levels: Go and train levels
    levelsHint:
      'When the experience is there, walk to a trainer and level. Off by default: a character
      banking levels for a reroll should not be levelled behind your back.'
    trainerLabel: Trainer
    trainerHint:
      Only the trainers the realm says will take this character at this level. The class training
      rooms stop at level 10 and every trainer has a band, so this list shrinks as the character
      grows.
    trainerCheapest: The cheapest that will take me
    trainerOption: '{name} — {room} ({cost} copper)'
    trainerNowhere:
      The realm names no trainer that will take this character at its level. Nothing will be
      walked to until one does.
    trainerStale:
      The trainer chosen here no longer takes this character. Pick another, or leave it on the
      cheapest; nothing will be walked to meanwhile.
    statsHint:
      At a trainer with character points unspent, opens the stat screen, buys the wanted figures
      below as far as the points go — cheapest point first — and saves. Off, the client stands
      down from that screen and touches nothing.
    wantedNote:
      Where each stat should end up. 0, or a figure at or under the current one, leaves that stat
      alone; the race's ceiling caps a figure above it. The first ten points above the race's base
      cost 1 CP each, the next ten 2 each, and so on.
    strength: Strength
    intellect: Intellect
    willpower: Willpower
    agility: Agility
    health: Health
    charm: Charm
  movement:
    provideLight: Auto-Light (Light Dark Rooms)
    provideLightHint:
      Readies a carried light — a torch, a lantern, a glowing pearl, anything the realm files as
      one — before a step into a room the character could not read, and on arriving in one, worked
      out from the room's level, the race's night vision and what is worn. On by default.
    lightDimRooms: Light Dim Rooms Too
    lightDimRoomsHint:
      Also in rooms the server describes anyway (dimly lit, barely visible). Spends the torch on a
      preference rather than a need.
    walkWhileBlind: Walk While Blind
    walkWhileBlindHint:
      Off, a route or a loop stands still until sight returns — MegaMUD's IgnoreBlind default. A blind
      character cannot read the room it walks into.
    walkWhilePoisoned: Walk While Poisoned
    walkWhilePoisonedHint:
      Off, a route or a loop stands still until the poison runs its course — MegaMUD's IgnorePoison
      default. Paralysis always holds; a step while held is refused.
    fightOnArrival: Auto-Combat On at Arrival
    fightOnArrivalHint:
      Turns auto-combat back on when a route you asked for arrives, since walking with it off is how
      you get somewhere without fighting on the way. Loops and errands are left alone.
    extinguishInLight: Put the Light Out in Lit Rooms
    extinguishInLightHint:
      Removes the lit torch in a room that does not need it, while nothing is walking the character,
      so a torch lasts the sewer rather than the walk there.
    recoverGear: Recover Your Gear After Death
    recoverGearFloorLabel: Keep at least (lives)
    recoverGearFloorHint:
      Stop going back once this many lives are left. Lives are finite and a recovery walks a
      stripped character back to whatever killed it. 0 never stops.
    recoverGearTriesLabel: Give up after (tries)
    recoverGearTriesHint:
      How many journeys in a row may fail to reach the kit before it stops trying. A journey that
      gets there clears the run. 0 never gives up.
    recoverGearHint:
      Walks back to the room the character died in, takes the kit and coins still lying there, and
      puts the kit back on. Holds when hurt and fights nothing on the way; every refusal is said.
    collectKeys: Pick Up a Key the Way Out Needs
    collectKeysHint:
      Only when the realm says an exit of the room needs it, no listing has shown it in the pack,
      and it is lying on this floor. A keyed door with no key is a wall the router plans around, so
      this is the one moment bending down is worth anything. On by default.
    doorsLegend: Doors
    stealthLegend: Stealth
    lightLegend: Light
    afflictionsLegend: Afflictions
    carryLegend: What It Carries
    loopsNote: These belong to this character alone. Loops for everyone who plays a realm go on that
      realm’s page; loops for every character go on the Global page.
    loopsWarning: These loops name rooms in the world that ships with the client, and this character
      uses its own.
    bankWhichLabel: Bank At
    bankWhichHint:
      Which counter this character's vault is at. A balance is per counter and the realm states
      each separately, so depositing at whichever bank you walk past leaves several figures that
      cannot be added up. Any counter deposits wherever you happen to be standing.
    bankWhichAny: Any counter
    bankWhichOption: '{name} — {room}'
    bankWhichStale: This realm does not place that counter, so nothing is deposited. Pick one from the list.
    bankDepositHint:
      At a bank counter with cash on hand over the threshold, deposits everything above the
      retained amount and asks the vault its figure. Never on an unread balance.
    bankDepositLabel: Auto-Deposit Coins
    bankKeepHint: What stays on hand for tolls and shops. 100 copper is a gold crown.
    bankKeepLabel: Retain Cash on Hand
    bankLegend: Banking
    bankThresholdHint:
      Deposits only once cash on hand exceeds this, so a lap is not spent on small change.
      100 copper is a gold crown.
    bankThresholdLabel: Minimum Deposit Threshold
    dropEnabledHint: Only what you name below is ever dropped, and never anything worn, wielded or
      lit. The realm data does not mark quest items, so this list is the one authority on junk.
    dropEnabledLabel: Auto-Drop Junk Items
    dropItemsHint: Matched by prefix, because that is how the realm reads drop.
    dropItemsLabel: Junk Item Names
    dropItemsPlaceholder: rusty sword, torch
    dropLegend: Dropping Junk
    dropWhenEncumberedHint: Waits for the realm itself to grade the load as anything but None on the
      inventory listing. Off, junk is dropped as soon as it turns up in the pack.
    dropWhenEncumberedLabel: Drop Only When Encumbered
    lootCoins: Auto-Get Cash
    lootCoinKindsHint:
      Which coins are worth bending down for. The cheap ones are most of what drops and every get
      is a command; unticking them all takes none.
    lootCoinKindsLabel: Coins to Collect
    lootDiscardKindsHint:
      Which coins to put back on the floor whenever you are carrying any. A coin on neither row is
      kept — that is how you stop collecting copper without throwing away the copper you have.
    lootDiscardKindsLabel: Coins to Discard
    lootConvertAtLabel: Convert When
    lootConvertWithHint:
      An item that turns small coin into large — GreaterMUD's coin bag. The client cannot tell
      which item does this, so name it yourself. MajorMUD has none.
    lootConvertWithLabel: Convert Cash With
    lootGradeHeavy: Heavy
    lootGradeMedium: Medium
    lootGradeNever: Never
    lootStopAtGradeHint:
      Stop collecting coins once the server grades the load this heavily. The grade is the
      server's own word, read off the inventory listing.
    lootStopAtGradeLabel: Stop Collecting At
    lootMinPriceHint:
      Also takes anything the realm prices at or above this, in copper. 0 never does, and an item
      the realm cannot price is never taken by it.
    lootMinPriceLabel: Auto-Get Over Value
    lootMaxEncumbranceHint:
      Never picks anything heavier up, whatever the list says. 0 never refuses; an item the realm
      cannot weigh is not refused.
    lootMaxEncumbranceLabel: Max Item Weight
    dropWorthlessHint:
      Drops anything the realm prices at zero. Only its explicit zero, never an item it says
      nothing about, and never one it marks Not Droppable.
    dropWorthlessLabel: Auto-Drop Worthless Items
    searchEnabledHint:
      The realm hides exits, and a route may be planned through one nobody has looked
      for. Never in combat, never while resting, and once per room rather than once per status line.
    searchEnabledLabel: Auto-Search Rooms
    searchLegend: Searching
    searchTriesHint: Each try is a command out of the same budget the fighting is done from. Whether
      one look is enough has never been measured.
    searchTriesLabel: Searches Per Room
    lootItemsHint:
      Matched by prefix, because that is how the realm reads get. Nothing here weighs, values or
      sells.
    lootItemsLabel: Auto-Get Items List
    lootItemsPlaceholder: gem, scroll
    lootLegend: Auto-Looting
    bashDoors: Auto-Bash Doors
    bashDoorsHint:
      Brute force, when your strength is close to what the realm records for the door. It
      costs health, and a bashed door is open already.
    bashTries: Bashes Per Door
    openDoors: Auto-Open Doors
    openDoorsHint: A route stops at a shut door unless this is on. A locked one costs a command per try.
    openTries: Tries Per Door
    pickLocks: Auto-Pick Locks
    pickLocksHint: Tried before bashing, because it costs no health. Needs picklocks near what the
      realm records for the lock; the door is opened for you afterwards.
    pickTries: Picks Per Door
    sneak: Auto-Sneak on Move
    sneakHint: Decides whether the next room notices you arrive. Sneaking can fail.
  remotes:
    addPlayerLabel: Grant Player Permissions
    addPlayerPlaceholder: Ardren
    addPlayerHint: As the realm spells it. Clicking a name on the Realm or Players card opens the
      same permissions beside the listing.
    answerHint: Off, an @ command is read and ignored — answering needs the other character to run
      mudengine too.
    channelWarning:
      A channel by which another player’s typing moves the character — it answers nobody
      until something below is granted, and @kill and @hangup are always refused.
    enabledLabel: Enable Remote Control
    gangLegend: Gang Permissions
    gangWarning: Membership is read from the who listing — this character's row and the asker's must
      both name the same gang. Until a listing has shown both, the gang grants nobody anything.
    gangpathHint: 'A gangpath answer is spoken to the whole gang — “gb @exp” is answered “gb
      {Made…}” where every member sees both halves.'
    gangpathLabel: Allow Remotes on Gangpath
    legend: Answering Other Players
    playerLegend: Permissions for {name}
    partyListNote:
      There is a third list on the Party page — what anybody who has joined this character's
      party may ask for. It ships with @health, @bless-expired and @heal on it, and nothing else.
    removePlayer: Remove
    removePlayerTitle: Take every permission back off {name}
    remoteControlNote:
      Answers or acts on the @ commands that can be ticked below, for whoever they are granted to;
      every other @ command is read and reported, never answered.
    replyRoutingNote: The answer goes back the way the question came — ask by telepath to be answered.
  party:
    askHealHint:
      Say @heal in the room below this while in a party; a member running MegaMUD or this client
      answers with a heal. 0 never asks.
    askHealLabel: Ask for Healing Below %
    assistHint:
      Swing at what the leader — whoever this character follows — was last seen hitting, while it
      is still in the room. Never a player; still under the combat health floor.
    assistLabel: Auto-Assist Leader
    blessingsMoved:
      Blessing the party lives on the Spells tab now — one list for self and party, in priority
      order, recast on wear-off events with a clock behind them.
    defendHint:
      Swing at a monster seen attacking any party member, while it is still in the room. The fight came to the
      party, so it fires whatever Attack Target Selection says. Never a player.
    defendLabel: Auto-Defend Party
    healLegend: Healing
    healNote:
      A member's own @heal is answered by Auto-Heal Party Members on the Spells page, when @heal is
      ticked under Party @ commands below.
    legend: Following
    remotesLegend: Party @ commands
    remotesNote:
      What anybody who has **joined** this party may ask this character for. An invitation
      nobody accepted is not membership, and a Deny on somebody by name still beats this.
    remotesOffWarning:
      Answering @ commands is off for this character, so nothing here is answered yet. The
      switch is on the Remotes page.
    restHint: Out of combat only, like every rest. Meditates only for a class with mana.
    restLabel: Rest With Leader
    warning:
      Whether the realm's command window is per connection or per host is unmeasured. These make
      a second automated character useful; turning them on is choosing to run that experiment.
  profile:
    accentLabel: Colour
    autoConnectLabel: Connect on Start
